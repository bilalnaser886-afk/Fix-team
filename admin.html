<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
/* المظهر قبل أي رسم — نفس مفتاح باقي الشاشات */
(function(){
  try{
    var m = localStorage.getItem('ifix-theme') || 'auto';
    var h = new Date().getHours();
    var d = m === 'dark' || (m === 'auto' && (h >= 19 || h < 7));
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>لوحة الأدمن — I Fix Team</title>
<link rel="icon" href="favicon32.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<style>
  *{box-sizing:border-box;}
  :root{
    --on-chrome:#FFFFFF; --on-color:#FFFFFF; --ink-2:#334155;
    --ink:#101014; --muted:#64748B; --line:#EEF0F3;
    --paper:#F1F5F9; --card:#FFFFFF; --faint:#94A3B8; --ink-2:#475569;
    --danger:#DC2626; --danger-bg:#FEF2F2; --danger-border:#FCA5A5;
    --success:#16A34A; --success-bg:#DCFCE7; --success-border:#86EFAC;
    --info:#2563EB; --warn:#B45309;
  }

  /* ===== الوضع الداكن ===== */
  html[data-theme="dark"]{
    color-scheme:dark;
    --on-chrome:#E9EFF5; --on-color:#0E1721;
    --ink:#E9EFF5; --muted:#92A6B8; --line:#2F4356;
    --paper:#131E29; --card:#1B2A3A; --faint:#71879B; --ink-2:#C3D2DF;
    --danger:#F87171; --danger-bg:rgba(248,113,113,.15); --danger-border:rgba(248,113,113,.45);
    --success:#4ADE80; --success-bg:rgba(74,222,128,.15); --success-border:rgba(74,222,128,.45);
    --info:#3B82F6; --warn:#F0A81E;
  }
  body{ font-family:'Tajawal',sans-serif; margin:0; background:var(--paper); color:var(--ink);
    padding-bottom:60px; -webkit-tap-highlight-color:transparent; }
  .topbar{ background:#0F172A; color:var(--on-chrome); padding:calc(14px + env(safe-area-inset-top)) 18px 14px; }
  .topbar h1{ font-family:'Cairo',sans-serif; font-size:19px; margin:0; }
  .topbar .sub{ font-size:12px; opacity:.7; margin-top:2px; }
  .topbar .who{ font-size:12px; opacity:.85; margin-top:8px; }
  .wrap{ max-width:640px; margin:0 auto; padding:16px; }
  .sec{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;
    box-shadow:0 2px 10px rgba(16,16,20,.04); }
  .sec-title{ font-weight:800; font-size:15px; margin-bottom:4px; }
  .hint{ font-size:12.5px; color:var(--muted); margin:0 0 12px; line-height:1.7; }
  button{ font-family:inherit; cursor:pointer; touch-action:manipulation; }
  .btn{ width:100%; border:none; border-radius:10px; padding:13px; font-size:15px; font-weight:800; color:var(--on-color);
    background:var(--info); }
  .btn.warn{ background:var(--warn); }
  .btn.danger{ background:var(--card); color:var(--danger); border:1px solid var(--danger-border); }
  .btn.ghost{ background:var(--card); color:var(--ink-2); border:1px solid var(--line); }
  .mini{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13px;
    font-weight:700; color:var(--ink-2); min-height:40px; }
  .mini.on{ background:var(--success-bg); color:var(--success); border-color:var(--success-border); }
  /* صف الصلاحية — مزاح لجوه شوية عشان يبان تابع للمستخدم فوقه */
  .cap-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:0 0 8px; padding:9px 11px; margin-inline-start:14px;
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
  }
  .cap-name{font-size:12.5px; font-weight:700; color:var(--ink);}
  .cap-hint{font-size:11px; color:var(--muted); line-height:1.6; margin-top:2px;}
  .cap-btn{
    flex:none; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;
    padding:7px 12px; border-radius:8px; white-space:nowrap;
    background:var(--card); border:1.5px solid var(--line); color:var(--muted);
  }
  .cap-btn.on{background:var(--success-bg); border-color:var(--success-border); color:var(--success);}
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--paper); }
  .badge{ display:inline-block; border-radius:8px; padding:4px 10px; font-size:12.5px; font-weight:800; }
  input, textarea, select{ width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    font-size:14px; font-family:inherit; margin-bottom:9px; }
  .mode-box{ background:var(--paper); border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .log{ max-height:230px; overflow:auto; }
  .log-item{ border-bottom:1px solid var(--paper); padding:7px 0; font-size:12.5px; line-height:1.6; }
  .log-meta{ color:var(--faint); font-size:11px; }
  .loading{ text-align:center; padding:50px 20px; color:var(--muted); }
  .lang-toggle{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:var(--on-color);
    border-radius:9px; min-height:36px; padding:0 12px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; }
  .toast{ position:fixed; left:0; right:0; bottom:0; z-index:9999; color:var(--on-color); text-align:center;
    font-weight:800; font-size:14px; padding:13px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>⚙️ <span data-i18n="adm.title">لوحة تحكم الأدمن</span></h1>
  <div class="sub" data-i18n="adm.subtitle">I Fix Team — إدارة النظام</div>
  <div class="who" id="whoBox" data-i18n="adm.checking">جارٍ التحقق…</div>
  <div id="langHost" style="margin-top:10px;"></div>
</div>

<div class="wrap" id="wrap"><div class="loading">جاري التحميل…</div></div>

<script>
// ===== إعدادات البيئة: إنتاج / تجريبي (Staging) =====
// الاتصال + تحديد البيئة + esc + شريط STAGING اتنقلوا لـ common.js
// (بيتحمّل فوق قبل السكربت ده). ADMIN_EMAILS تحت لسه محلية عن قصد.

// إيميلات الأدمن — حسب البيئة
const ADMIN_EMAILS_BY_ENV = {
  production: ['belal0@fix.com'],
  staging:    ['belal0@fix.com']
};
const ADMIN_EMAILS = (ADMIN_EMAILS_BY_ENV[APP_ENV] || []).map(e => e.toLowerCase());

let currentUser = { name:'', email:'' };
// esc اتنقلت لـ common.js

// ===== التخزين على app_data =====
const storage = {
  async get(key){
    const { data, error } = await sb.from('app_data').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    return data ? { key, value:data.value } : null;
  },
  async set(key, value){
    const { error } = await sb.from('app_data').upsert({ key, value, updated_at:new Date().toISOString() });
    if(error) throw error;
    return { key, value };
  }
};

// ===== الحالة =====
const PENDING_TECHS_KEY='pending-technicians';
const SYSTEM_CONFIG_KEY='system-config', ROLES_KEY='user-roles', FLAGS_KEY='feature-flags',
      AUDIT_KEY='audit-log', BROADCAST_KEY='broadcast';   // SUBINFO_KEY في common.js
let subInfo = {};
let systemConfig = { mode:'normal', betaAnnId:null, trialStart:null, trialDays:7, trialAnnId:null };
let userRoles = {}, featureFlags = {}, auditLog = [];

const KNOWN_FLAGS = [
  { key:'gemini_invoice_ocr', desc:'قراءة فواتير قطع الغيار بالذكاء الاصطناعي (OCR)' },
  { key:'silent_label_print', desc:'طباعة الليبل مباشرة من غير نافذة الطباعة' },
  { key:'device_lock_codes',  desc:'رمز قفل الجهاز (رقم / نمط / صورة)' },
  { key:'live_broadcasts',    desc:'الإشعارات اللحظية من الأدمن' },
];

// ============================================================
// 🎁 الفترة المجانية — مصدر الحقيقة بقى جدول shop
// ------------------------------------------------------------
// كانت متخزّنة في app_data، وده كان بيعمل حلقة مقفولة: عشان
// تكتب في app_data لازم يكون الاشتراك شغّال، وعشان الاشتراك
// يشتغل لازم تكتب الفترة المجانية في app_data.
//
// دلوقتي تاريخ نهاية التجربة في shop.trial_until — وجدول shop
// سياساته بتتحقق إنك أدمن وبس، من غير أي شرط اشتراك. فالحلقة
// اتكسرت، وقاعدة البيانات بقت هي اللي بتقرر (subscription_active).
//
// systemConfig لسه بيتكتب فيه mode/trialStart/trialAnnId — بس
// دول للعرض والبانرات بس، مش للقرار.
// ============================================================
let shopSub = { paid_until:null, trial_until:null };

async function loadShopSub(){
  try{
    const { data, error } = await sb.from('shop')
      .select('paid_until, trial_until').eq('id',1).maybeSingle();
    if(error) throw error;
    shopSub = data || { paid_until:null, trial_until:null };
  }catch(e){
    console.error('[الاشتراك] فشلت قراءة جدول shop:', e);
    shopSub = { paid_until:null, trial_until:null };
  }
}

function paidActive(){
  return !!(shopSub.paid_until && new Date(shopSub.paid_until) > new Date());
}
function trialActive(){
  return !!(shopSub.trial_until && new Date(shopSub.trial_until) > new Date());
}
function trialDaysLeft(){
  if(!shopSub.trial_until) return 0;
  const ms = new Date(shopSub.trial_until).getTime() - Date.now();
  return Math.max(0, Math.ceil(ms/86400000));
}
function isFeatureEnabled(key){ const f = featureFlags[key]; return !!(f && f.is_enabled); }

function toast(msg, ok){
  const t = document.createElement('div');
  t.className = 'toast'; t.style.background = ok===false ? 'var(--danger)' : 'var(--success)';
  t.textContent = msg; t.onclick = () => t.remove();
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

async function saveConfig(){ await storage.set(SYSTEM_CONFIG_KEY, JSON.stringify(systemConfig)); }
async function saveRoles(){ await storage.set(ROLES_KEY, JSON.stringify(userRoles)); }

// فنيين اتضافوا من شاشة الصيانة ولسه مستنيين إيميل وحساب
let pendingTechs = [];
async function loadPendingTechs(){
  try{
    const r = await storage.get(PENDING_TECHS_KEY);
    const _p = (r && r.value) ? JSON.parse(r.value) : null;
    pendingTechs = Array.isArray(_p) ? _p : [];   // لو الداتا اتخزّنت بشكل غلط منقعش
  }catch(e){ pendingTechs = []; }
}
async function savePendingTechs(){ await storage.set(PENDING_TECHS_KEY, JSON.stringify(pendingTechs)); }

// الاسم ده اتعمله حساب فعلاً؟ لو أيوه مايبقاش معلّق
function techHasAccount(name){
  const n = (name||'').trim().toLowerCase();
  return Object.values(userRoles).some(rl => {
    const en = normRole(rl);
    return en.role === 'technician' && (en.techName||'').trim().toLowerCase() === n;
  });
}
function livePendingTechs(){
  return pendingTechs.filter(x => x && x.name && !techHasAccount(x.name));
}
async function saveFlags(){ await storage.set(FLAGS_KEY, JSON.stringify(featureFlags)); }
async function addAudit(action){
  try{
    auditLog.unshift({ at:new Date().toISOString(), by:currentUser.name||currentUser.email, email:currentUser.email, action });
    auditLog = auditLog.slice(0,300);
    await storage.set(AUDIT_KEY, JSON.stringify(auditLog));
  }catch(e){}
}

// ===== تحميل كل الإعدادات =====
async function loadAll(){
  // ⚠️ shop الأول: لو الاشتراك خلص، قراءة app_data تحت بتترفض
  //    (سياساتها فيها subscription_active) وبتقع في الـ catch —
  //    لكن جدول shop بيتقرا دايماً، فحالة الاشتراك بتفضل معروفة
  //    ولوحة الأدمن تفضل قادرة تفعّل.
  await loadShopSub();
  try{ const r = await storage.get(SYSTEM_CONFIG_KEY); if(r&&r.value) systemConfig = Object.assign(systemConfig, JSON.parse(r.value)); }catch(e){}
  try{ const r = await storage.get(ROLES_KEY); if(r&&r.value) userRoles = JSON.parse(r.value)||{}; }catch(e){}
  try{ const r = await storage.get(FLAGS_KEY); if(r&&r.value) featureFlags = JSON.parse(r.value)||{}; }catch(e){}
  try{ const r = await storage.get(AUDIT_KEY); if(r&&r.value) auditLog = JSON.parse(r.value)||[]; }catch(e){}
  try{ const r = await storage.get(SUBINFO_KEY); if(r&&r.value) subInfo = JSON.parse(r.value)||{}; }catch(e){}
  await loadPendingTechs();
  let changed = false;
  for(const f of KNOWN_FLAGS){
    if(!featureFlags[f.key]){ featureFlags[f.key] = { is_enabled:false, description:f.desc, updated_at:new Date().toISOString() }; changed = true; }
  }
  if(changed){ try{ await saveFlags(); }catch(e){} }
}

// ===== الواجهة =====
function render(){
  // الوضع بيتحسب من الحقيقة (جدول shop) مش من الإعدادات المخزّنة —
  // عشان لو التجربة خلصت، الشاشة تقول كده فوراً حتى لو app_data
  // اتقفل ومقدرناش نحدّث mode جواه.
  const m = systemConfig.mode === 'beta' ? 'beta' : (trialActive() ? 'trial' : 'normal');
  const modeLabel = m==='beta' ? '🛠️ '+t('adm.modeBeta') : (m==='trial' ? '🎁 '+t('adm.modeTrial') : '✅ '+t('adm.modeNormal'));
  const left = trialDaysLeft();

  document.getElementById('wrap').innerHTML = `
    <div class="sec">
      <div class="mode-box">
        <div style="font-size:13px;color:var(--muted);">${t('adm.currentMode')}</div>
        <div style="font-weight:800;font-size:17px;margin-top:2px;">${modeLabel}</div>
        ${m==='trial' ? `<div style="font-size:13px;color:var(--warn);margin-top:4px;">${t('adm.daysLeft',{n:left})}</div>` : ''}
      </div>
      <button class="btn ghost" onclick="location.href='dashboard.html'">🗂️ ${t('adm.openDashboard')}</button>
    </div>

    <!-- ⚠️ قسم «وضع البيتا» وقسم «الفترة المجانية» اتشالوا بالكامل
         (أغسطس ٢٠٢٦) بناءً على طلب المالك: العميل بيدفع اشتراك عادي،
         والفترة المجانية والبيتا مالهمش لازمة.
         الدوال setMode / changeTrialDays لسه موجودة تحت في الكود بس
         مفيش أي زرار بيناديها — سايبينها عشان لو احتجناها يوم نرجّع
         الزراير بس، من غير ما نعيد كتابة منطق كامل. -->
    <div class="sec">
      <div>
        <div class="sec-title">💳 تفعيل اشتراك مدفوع</div>
        <p class="hint">بعد ما المسؤول يدفع — اضغط واختار المدة، والخدمة هتشتغل فوراً لكل الموظفين.</p>
        <button class="btn" onclick="activatePaid()">✅ تفعيل الاشتراك بعد الدفع</button>
        <div class="hint" id="paidUntilLbl" style="margin-top:6px;"></div>
        ${paidActive() ? `
        <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line,#334155);">
          <p class="hint" style="margin-top:0;">لإلغاء الاشتراك فوراً — الخدمة هتتقفل عند كل الموظفين على طول.</p>
          <button class="btn danger" onclick="cancelPaid()">🛑 إلغاء الاشتراك المدفوع</button>
        </div>` : ''}
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">💳 بيانات الاشتراك المسجّلة</div>
      <p class="hint">اللي بيتكتب من صفحة «حسابي» — ابعت طرق الدفع على الإيميل ده. المستخدم يقدر يعدّلها في أي وقت والتعديل بيظهر هنا.</p>
      <div style="margin-bottom:8px;"><button class="mini" onclick="refreshSubInfo()">↻ تحديث البيانات</button></div>
      ${subInfo && (subInfo.email || subInfo.phone || subInfo.name) ? `
        <div style="line-height:2;">
          <div>👤 <b>${esc(subInfo.name||'—')}</b></div>
          <div>📞 <span dir="ltr">${esc(subInfo.phone||'—')}</span></div>
          <div>✉️ <span dir="ltr">${esc(subInfo.email||'—')}</span></div>
          ${subInfo.plan ? `<div>📦 الخطة المطلوبة: <b>${esc(subInfo.plan)}</b></div>` : ''}
          ${subInfo.at ? `<div class="hint">اتسجّلت: ${new Date(subInfo.at).toLocaleString('ar-EG')}</div>` : ''}
          ${subInfo.by ? `<div class="hint">بواسطة: ${esc(subInfo.by)}</div>` : ''}
        </div>`
      : `<p class="hint">لسه محدش سجّل بيانات.</p>`}
    </div>

    <div class="sec">
      <div class="sec-title">📢 ${t('adm.bcSection')}</div>
      <p class="hint">${t('adm.bcHint')}</p>
      <input id="bcTitle" placeholder="${t('adm.bcTitlePh')}" />
      <textarea id="bcBody" rows="2" placeholder="${t('adm.bcBodyPh')}"></textarea>
      <select id="bcAudience" onchange="bcAudienceChanged()">
        <option value="all">📢 للكل</option>
        <option value="accountant">💼 المحاسبين بس</option>
        <option value="technician">🔧 الفنيين بس</option>
        <option value="dispatcher">🚦 مسؤولي الحركة بس</option>
        <option value="user">👤 شخص بعينه…</option>
      </select>
      <select id="bcUser" style="display:none;">
        ${Object.keys(userRoles).sort().map(em => {
          const en = userRoles[em];
          const rl = (typeof en === 'string') ? en : (en && en.role) || '';
          const nm = (en && en.techName) ? en.techName : em;
          return `<option value="${esc(em)}">${esc(nm)} — ${esc(roleLabel(rl))}</option>`;
        }).join('')}
      </select>
      <select id="bcType">
        <option value="info">📢 ${t('adm.bcInfo')}</option>
        <option value="warning">⚠️ ${t('adm.bcWarn')}</option>
        <option value="success">✅ ${t('adm.bcGood')}</option>
      </select>
      <div style="margin:8px 0;">
        <button class="mini" onclick="fillSubTemplate()">📄 استخدم نص "بدء خطة الاشتراك"</button>
        ${bcIsSubPlan ? `<span class="badge" style="background:var(--success-bg);color:var(--success);margin-inline-start:8px;">● منشور أسعار — هيفتح «حسابي» للمستلم</span>` : ''}
      </div>
      <button class="btn" onclick="sendBroadcast()">${t('adm.bcSend')}</button>
    </div>

    <div class="sec">
      <div class="sec-title">🎛️ ${t('adm.flagsSection')}</div>
      <p class="hint">${t('adm.flagsHint')}</p>
      ${KNOWN_FLAGS.map(f => {
        const on = isFeatureEnabled(f.key);
        return `<div class="row">
          <div style="flex:1;">
            <div style="font-size:13.5px;font-weight:700;">${esc(f.desc)}</div>
            <div style="font-size:11px;color:var(--faint);font-family:monospace;">${esc(f.key)}</div>
          </div>
          <button class="mini ${on?'on':''}" style="min-width:92px;" onclick="toggleFlag('${f.key}')">${on ? '● '+t('adm.flagOn') : '○ '+t('adm.flagOff')}</button>
        </div>`;
      }).join('')}
    </div>

    <div class="sec">
      <div class="sec-title">👥 ${t('adm.rolesSection')}</div>
      <p class="hint">${t('adm.rolesHint')}</p>
      <div style="font-size:12.5px;color:var(--ink-2);line-height:1.9;margin-bottom:10px;">
        ${t('adm.envAdmins')} (${APP_ENV==='production'?t('adm.envProd'):t('adm.envStaging')}):
        <b style="font-family:monospace;">${esc(ADMIN_EMAILS.join('، '))}</b>
        ${Object.keys(userRoles).length
          ? Object.entries(userRoles).map(([em,rl]) => {
              const en = normRole(rl);
              return `<div class="row">
              <span style="font-family:monospace;font-size:12px;">${esc(em)} — ${esc(roleLabel(en.role))}${en.techName ? ' (' + esc(en.techName) + ')' : ''}</span>
              <button class="mini" style="color:var(--danger);" onclick="removeRole('${esc(em)}')">${t('adm.delete')}</button>
            </div>
            ${CAPS.filter(c => c.forRoles.includes(en.role)).map(c => `
              <div class="cap-row">
                <div>
                  <div class="cap-name">${c.icon} ${esc(c.label)}</div>
                  <div class="cap-hint">${esc(c.hint)}</div>
                </div>
                <button class="cap-btn ${hasCap(en,c.key)?'on':''}"
                        onclick="toggleCap('${esc(em).replace(/'/g,"\\'")}','${c.key}')">
                  ${hasCap(en,c.key) ? '● مفتوحة' : '○ مقفولة'}
                </button>
              </div>`).join('')}`;}).join('')
          : `<div style="color:var(--faint);margin-top:6px;">${t('adm.noRoles')}</div>`}
      </div>
      <button class="mini" onclick="addRole()">➕ ${t('adm.addRole')}</button>

      ${(() => {
        const pend = livePendingTechs();
        if(!pend.length) return '';

async function setMode(kind){
  const texts = {
    beta:'تفعيل وضع البيتا؟', trial:`تحويل لوضع التجربة المجانية (${systemConfig.trialDays||7} يوم)؟`,
    cancelBeta:'إلغاء وضع البيتا والرجوع للوضع العادي؟', cancelTrial:'إلغاء الوضع المجاني والرجوع للوضع العادي؟'
  };
  if(!confirm(texts[kind])) return;
  try{
    // ══ ترتيب الخطوات هنا مقصود ومهم ══
    // بدء التجربة: نكتب في shop **الأول**. الكتابة دي مسموحة دايماً
    // للأدمن، وأول ما تنجح الخدمة بتفتح — وساعتها بس نقدر نكتب في
    // app_data. لو عكسنا الترتيب، حفظ الإعدادات هيترفض والزرار
    // هيفضل مايشتغلش زي ما كان بيحصل قبل كده.
    //
    // إلغاء التجربة: العكس. بنحفظ الإعدادات وإحنا لسه مفتوحين،
    // وبعدين نقفل — لأن بعد القفل مش هنقدر نكتب.
    if(kind==='trial'){
      const days = systemConfig.trialDays || 7;
      const end  = new Date(Date.now() + days*86400000);
      const { error } = await sb.from('shop')
        .upsert({ id:1, trial_until: end.toISOString() });
      if(error) throw error;
      shopSub.trial_until = end.toISOString();
      systemConfig.mode='trial'; systemConfig.trialStart=new Date().toISOString(); systemConfig.trialAnnId=Date.now();
    }
    if(kind==='beta'){ systemConfig.mode='beta'; systemConfig.betaAnnId=Date.now(); }
    if(kind==='cancelBeta'){ systemConfig.mode='normal'; systemConfig.betaAnnId=null; }
    if(kind==='cancelTrial'){ systemConfig.mode='normal'; systemConfig.trialStart=null; systemConfig.trialAnnId=null; }

    await saveConfig();

    if(kind==='cancelTrial'){
      const { error } = await sb.from('shop').upsert({ id:1, trial_until: null });
      if(error) throw error;
      shopSub.trial_until = null;
    }
    await addAudit({beta:'فعّل وضع البيتا', trial:'بدأ الفترة المجانية', cancelBeta:'ألغى وضع البيتا', cancelTrial:'ألغى الوضع المجاني'}[kind]);
    render(); toast('تم الحفظ ✅');
  }catch(e){ toast('فشل الحفظ: ' + (e.message||e), false); }
}

// 💳 تفعيل الاشتراك بعد الدفع
// ------------------------------------------------------------
// بيكتب تاريخ نهاية الاشتراك في جدول shop (عمود paid_until).
// كل الصفحات بتفحصه أول ما تفتح — فالخدمة بترجع فوراً لكل
// الموظفين من غير ما تعمل أي حاجة تانية.
// ============================================================
async function activatePaid(){
  const v = prompt('مدة الاشتراك بالشهور؟\n1 = شهر · 3 = ثلاثة شهور · 6 = ستة شهور', '1');
  if(v === null) return;
  const months = parseInt(v, 10);
  if(!(months > 0)){ toast('اكتب رقم صحيح', false); return; }

  // بنبدأ من تاريخ النهاية الحالي لو لسه سارياً (تمديد)، وإلا من النهاردة
  let start = new Date();
  try{
    const { data } = await sb.from('shop').select('paid_until').eq('id',1).maybeSingle();
    if(data && data.paid_until && new Date(data.paid_until) > start) start = new Date(data.paid_until);
  }catch(e){}

  const end = new Date(start);
  end.setMonth(end.getMonth() + months);
  if(!confirm(`تفعيل الاشتراك لمدة ${months} شهر؟\nالخدمة هتشتغل لحد: ${end.toLocaleDateString('ar-EG')}`)) return;

  try{
    // التجربة بتتلغي مع الدفع — فمفيش لبس بين الاتنين، والبانر
    // بتاعها بيختفي فوراً عند كل الموظفين.
    const { error } = await sb.from('shop')
      .upsert({ id:1, paid_until: end.toISOString(), trial_until: null });
    if(error) throw error;
    shopSub.paid_until = end.toISOString();
    shopSub.trial_until = null;

    // نرجّع الوضع العادي عشان بانر التجربة يختفي
    systemConfig.mode = 'normal';
    systemConfig.trialStart = null; systemConfig.trialAnnId = null;
    await saveConfig();

    await addAudit(`فعّل اشتراك مدفوع ${months} شهر — لحد ${end.toISOString().slice(0,10)}`);
    render();
    showPaidUntil();
    toast('✅ الاشتراك اتفعّل — الخدمة رجعت لكل الموظفين');
  }catch(e){
    toast('فشل التفعيل: ' + (e.message||e), false);
  }
}

// ============================================================
// 🛑 إلغاء الاشتراك المدفوع
// ------------------------------------------------------------
// ⚠️ ترتيب الخطوات هنا مقصود:
//    السجل (audit-log) والإعدادات متخزّنين في app_data، وسياسة
//    الكتابة عليه بتتحقق من subscription_active(). أول ما نمسح
//    paid_until الخدمة بتتقفل — وأي كتابة بعد كده بتترفض.
//    فبنكتب الأول وإحنا لسه مفتوحين، وبنقفل آخر حاجة.
//
// ملحوظة: لو فيه فترة مجانية سارية، الخدمة هتفضل شغالة بعد
// الإلغاء — لأن subscription_active() بتقبل أي واحد فيهم.
// ============================================================
async function cancelPaid(){
  if(!paidActive()){ toast('مفيش اشتراك مدفوع ساري', false); return; }

  const stillTrial = trialActive();
  const warn = stillTrial
    ? `\n\n🎁 ملحوظة: فيه فترة مجانية سارية (${trialDaysLeft()} يوم) — الخدمة هتفضل شغالة لحد ما تخلص.`
    : '\n\n⛔ الخدمة هتتقفل فوراً عند كل الموظفين.';

  if(!confirm('إلغاء الاشتراك المدفوع؟' + warn)) return;
  if(!stillTrial && !confirm('متأكد؟ كل الموظفين هيتقفل عليهم النظام دلوقتي حالاً.')) return;

  try{
    // (١) السجل الأول — وإحنا لسه قادرين نكتب
    await addAudit('ألغى الاشتراك المدفوع يدوياً');

    // (٢) وبعدين القفل
    const { error } = await sb.from('shop').upsert({ id:1, paid_until: null });
    if(error) throw error;
    shopSub.paid_until = null;

    render(); showPaidUntil();
    toast(stillTrial ? '✅ الاشتراك اتلغى — التجربة لسه شغالة'
                     : '🛑 الاشتراك اتلغى — الخدمة اتقفلت');
  }catch(e){
    console.error('cancelPaid failed:', e);
    toast('فشل الإلغاء: ' + (e.message||e), false);
  }
}

// الأدوار المتاحة — لازم تفضل زي اللي في dashboard.html
const ROLES = ['super_admin', 'accountant', 'dispatcher', 'technician'];
const ROLE_LABEL_KEYS = {
  super_admin: 'adm.roleSuper',
  accountant:  'adm.roleAcc',
  dispatcher:  'adm.roleDisp',
  technician:  'adm.roleTech'
};
function roleLabel(r){ const k = ROLE_LABEL_KEYS[r]; try{ return k ? t(k) : r; }catch(e){ return r; } }

// بيقرا الشكلين: النص القديم "super_admin" والكائن الجديد {role, techName}
function normRole(v){
  if(typeof v === 'string') return { role: v, techName: '', caps: [] };
  if(v && typeof v === 'object') return {
    role: v.role || 'accountant',
    techName: v.techName || '',
    caps: Array.isArray(v.caps) ? v.caps : []      // الصلاحيات الإضافية
  };
  return { role: 'accountant', techName: '', caps: [] };
}

// ============================================================
// الصلاحيات الإضافية
// ------------------------------------------------------------
// الأدمن والمحاسب عندهم كل حاجة ضمنياً (نفس منطق has_cap في
// قاعدة البيانات). الصلاحيات دي بتتمنح للأدوار التانية بس.
//
// مهم: نفس الاسم بالظبط اللي السيرفر بيدوّر عليه — لو اتغيّر
// هنا لازم يتغيّر في 01-capabilities.sql وفي الـ Edge Function.
// ============================================================
const CAPS = [
  { key:'purchases', icon:'🧾', label:'فواتير المشتريات ومخزن قطع الغيار',
    hint:'قراءة الفواتير بالذكاء الاصطناعي + المخزن + ربط القطع بالأجهزة',
    forRoles:['dispatcher'] },  // الديسباتشر بس — صفحة الفني مش موصّلة بالموديول
  { key:'parts_review', icon:'🔩', label:'مراجعة قطع الغيار',
    hint:'يشوف كومنت قطع الغيار اللي الفني كتبه على كل جهاز، ويربط القطع بالأجهزة',
    forRoles:['dispatcher'] },
  // ⚠️ قراءة فقط — عن قصد. تسجيل الدفعات والخصومات والرصيد الافتتاحي
  //    شغل المحاسب وحده. الديسباتشر بيشوف ويدوّر ويطبع PDF وبس.
  //    القفل ده مش في الواجهة بس: مفتاح accounts-ledger **الكتابة**
  //    فيه محصورة على الأدمن والمحاسب في قاعدة البيانات أصلاً.
  { key:'accounts_view', icon:'🧾', label:'عرض الحسابات (قراءة فقط)',
    hint:'يشوف آجل المحلات ويدوّر فيه ويصدّر كشف PDF — من غير تسجيل دفعة ولا خصم ولا حذف',
    forRoles:['dispatcher'] }
];
function hasCap(en, cap){ return (en.caps || []).includes(cap); }

async function toggleCap(em, cap){
  const en = normRole(userRoles[em]);
  const on = hasCap(en, cap);
  const caps = on ? en.caps.filter(c => c !== cap) : en.caps.concat([cap]);
  try{
    userRoles[em] = { role: en.role, techName: en.techName, caps };
    await saveRoles();
    await addAudit((on ? 'قفل' : 'فتح') + ' صلاحية ' + cap + ' لـ ' + em);
    render();
    toast(on ? 'اتقفلت 🔒' : 'اتفتحت ✅');
  }catch(e){ toast('فشل الحفظ: ' + (e.message||e), false); }
}

async function addRole(){
  const em = prompt(t('adm.emailPrompt'));
  if(em===null) return;
  const e = (em||'').trim().toLowerCase();
  if(!e || !e.includes('@')){ toast(t('adm.badEmail'), false); return; }

  const menu = ROLES.map((r,i) => (i+1) + ') ' + roleLabel(r)).join('\n');
  const pick = prompt(t('adm.pickRole') + '\n' + menu, '2');
  if(pick===null) return;
  const role = ROLES[(parseInt(pick,10) || 0) - 1];
  if(!role){ toast(t('adm.badRole'), false); return; }

  // الفني بس هو اللي محتاج ربط بالاسم المكتوب على الأجهزة
  let techName = '';
  if(role === 'technician'){
    const nm = prompt(t('adm.techNamePrompt'));
    if(nm===null) return;
    techName = (nm||'').trim();
  }

  try{
    // بنحافظ على الصلاحيات الموجودة — تعديل الدور مش المفروض يمسحها
    const prevCaps = normRole(userRoles[e]).caps;
    userRoles[e] = Object.assign(
      techName ? { role, techName } : { role },
      prevCaps.length ? { caps: prevCaps } : {}
    );
    await saveRoles();
    await addAudit('ظبط صلاحية ' + roleLabel(role) + ' لـ: ' + e + (techName ? ' (' + techName + ')' : ''));
    render(); toast('تمت الإضافة ✅');
  }
  catch(err){ toast('فشل الحفظ: ' + (err.message||err), false); }
}
// بيربط فني معلّق بإيميل — نفس نتيجة addRole بالظبط، بس الاسم متعبّى مسبقاً
async function grantTechAccount(name){
  const em = prompt('إيميل الفني "' + name + '":');
  if(em === null) return;
  const e = (em || '').trim().toLowerCase();
  if(!e || !e.includes('@')){ toast(t('adm.badEmail'), false); return; }
  if(userRoles[e] && !confirm('الإيميل ده عليه صلاحية بالفعل. تستبدلها؟')) return;

  try{
    const prevCaps = normRole(userRoles[e]).caps;   // نفس السبب: مانمسحش صلاحيات موجودة
    userRoles[e] = Object.assign({ role:'technician', techName:name },
                                 prevCaps.length ? { caps: prevCaps } : {});
    await saveRoles();
    // اتعمله حساب → يخرج من قايمة المعلّقين
    pendingTechs = pendingTechs.filter(x => (x.name||'').trim() !== name.trim());
    await savePendingTechs();
    await addAudit('عمل حساب فني لـ: ' + name + ' (' + e + ')');
    render(); toast('اتعمل الحساب ✅');
  }catch(err){ toast('فشل الحفظ: ' + (err.message||err), false); }
}

  const audience = document.getElementById('bcAudience').value || 'all';
  const target   = (document.getElementById('bcUser')||{}).value || '';
  if(!title && !body){ toast('اكتب عنوان أو نص الإشعار', false); return; }
  if(audience === 'user' && !target){ toast('اختار الشخص الأول', false); return; }

  const who = audience === 'user' ? ('👤 ' + target) : (BC_AUDIENCE[audience] || 'كل المستخدمين');
  if(!confirm(`تبعت الإشعار ده لـ ${who} دلوقتي؟`)) return;

  try{
    // مفتاح مستقل لكل جمهور — و للشخص الواحد: broadcast:user:<الإيميل>
    const bcKey = audience === 'all' ? BROADCAST_KEY
                : audience === 'user' ? (BROADCAST_KEY + ':user:' + target.toLowerCase())
                : (BROADCAST_KEY + ':' + audience);
    await storage.set(bcKey, JSON.stringify({ id:Date.now(), title, body, type, audience, target, subPlan: !!bcIsSubPlan }));
    await addAudit(`بعت إشعار (${who}): ` + (title||body).slice(0,60));
    document.getElementById('bcTitle').value=''; document.getElementById('bcBody').value='';
    bcIsSubPlan = false;                      // نصفّرها عشان اللي بعده ما ياخدهاش بالغلط
    render();
    toast(`اتبعت لـ ${who} ✅`);
  }catch(e){ toast('فشل الإرسال: ' + (e.message||e), false); }
}
async function doLogout(){
  try{ await sb.auth.signOut(); }catch(e){}
  location.href = 'index.html';
}

// ===== حارس الدخول: لازم جلسة + إيميل أدمن =====
(async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href = 'index.html'; return; }
  currentUser.email = (session.user.email||'').toLowerCase();
  try{
    const { data:prof } = await sb.from('profiles').select('full_name').eq('id', session.user.id).single();
    currentUser.name = (prof && prof.full_name) ? prof.full_name : currentUser.email;
  }catch(e){ currentUser.name = currentUser.email; }

  if(!ADMIN_EMAILS.includes(currentUser.email)){
    // مش أدمن → يروح شاشة المحاسب
    location.href = 'dashboard.html';
    return;
  }
  document.getElementById('whoBox').textContent = `${currentUser.name} — ${t('adm.roleSuper')}`;
  try{ I18N.setUser(currentUser.email); I18N.mountLangToggle(document.getElementById('langHost')); }catch(e){}
  await loadAll();
  render();
})();
</script>
