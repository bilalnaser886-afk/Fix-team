// تعديل العطل — من زرار الكارت مباشرة
// ------------------------------------------------------------
// الفني بيكتشف إن المشكلة الحقيقية غير اللي اتكتب وقت الاستلام،
// فبيصحّحها من غير ما يفتح الجهاز.
//
// ⚠️ النص القديم **مش بيضيع**. بيتسجّل في سجل الجهاز قبل الكتابة،
//    فأي حد يفتح السجل يشوف: كان كذا وبقى كذا ومين غيّره وإمتى.
//    ده الفرق بين "تعديل" و"مسح".
//
// ⚠️ الخانة بتفتح **والعطل الحالي مكتوب فيها** — عشان الفني
//    يعدّل كلمة بدل ما يعيد كتابة السطر كله ويغلط.
// ============================================================
async function editIssue(id){
  const d = devices.find(x=>x.id===id); if(!d) return;
  const old = (d.issue || '').trim();
  const neu = (prompt(t('tp.editIssuePh'), old) || '').trim();
  if(!neu) return;                       // اتلغى أو فاضي
  if(neu === old){ toast(t('tp.noChange')); return; }

  const _args = { from: old || '—', to: neu };
  const note  = mkNote(t('note.issueEdit', _args), 'note.issueEdit', _args);
  const all   = notesForSave(d, note);
  const patch = { reportedIssue: neu, activityNotes: all,
                  lastModifiedAt: nowIso(), lastModifiedBy: ME };
  if(!(await save(id, patch))) return;

  d.issue = neu;
  if(d._raw){ d._raw.reportedIssue = neu; d._raw.activityNotes = all; }
  d.notes = all.map(n => ({ by:n.by||'', role:n.role||'', at:n.at||'',
                            text:n.text||'', kind:n.kind, args:n.args }));
  render();
  if(sheetId===id) renderSheet();
  toast(t('tp.issueSaved'));
}

// ============================================================
// مسح الباركود بالكاميرا
// ------------------------------------------------------------
// الباركود على الليبل فيه كود الجهاز (زي dev_1712345678901).
// بنطابق بالأرقام: مبتتأثرش بلغة الكيبورد ولا بالمسافات، والكود
// فيه ١٣ رقم فريدة — نفس أسلوب الداشبورد.
// ============================================================
function scanFind(text){
  const raw = String(text || '').trim();
  if(!raw) return null;
  const digits = raw.replace(/[^0-9]/g, '');
  if(digits.length >= 10){
    const byDigits = devices.find(d => {
      const idd = String(d.id).replace(/[^0-9]/g, '');
      return idd && (idd === digits || idd.endsWith(digits) || digits.endsWith(idd));
    });
    if(byDigits) return byDigits;
  }
  const up = raw.toUpperCase().replace(/^#/, '');
  return devices.find(d =>
    String(d.id).toUpperCase() === up ||
    String(d.id).slice(-5).toUpperCase() === up) || null;
}

function scanWithCamera(){
  if(!window.IFixScan) return;
  IFixScan.open(async text => {
    const hit = scanFind(text);
    if(hit) return openSheet(hit.id);
    // ⚠️ مش في قايمتي — ممكن يكون جهاز فني تاني.
    //    الفني بيشوف أجهزته هو بس (is_my_device في المنظور)، فمفيش
    //    طريقة نلاقيه بالقراءة العادية. بنسأل السيرفر عن الجهاز ده
    //    بالتحديد عن طريق دالة بترجّع بيانات تعريفه بس.
    if(await tryClaimScan(text)) return;
    // ولا ده ولا ده؟ نحط النص في البحث بدل ما نسيب المستخدم في اللاشيء
    const box = document.getElementById('q');
    if(box){ box.value = text; render(); box.focus(); }
    toast(t('scan.notFound'));
  });
}

// ============================================================
// مسحت جهاز مش بتاعي
// ------------------------------------------------------------
// بنسأل السيرفر عنه، ولو موجود بنعرض اختيارين:
//   🤝 مساعد (٢٥٪)   ·   🔄 استلام كامل
//
// ⚠️ الاستلام بيتم من غير تأكيد من الفني الأساسي — ده قرار مقصود.
//    الحماية إن كل حركة بتتسجّل في سجل الجهاز باسم اللي عملها
//    ووقتها ومين كان ماسكه قبلها.
// ============================================================
function scanIdFrom(text){
  const raw = String(text || '').trim();
  // الباركود بيبقى معرّف الجهاز كامل، والبحث اليدوي ممكن يبقى رقم التذكرة
  const m = raw.match(/dev_\d{10,}/i);
  return m ? m[0] : raw.replace(/^#/, '');
}

async function tryClaimScan(text){
  const id = scanIdFrom(text);
  if(!id) return false;
  try{
    const { data, error } = await sb.rpc('tech_scan_device', { p_id: id });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;
    const dev = Array.isArray(data) ? data[0] : data;
    if(!dev) return false;
    openClaim(dev);
    return true;
  }catch(e){
    console.error('tech_scan_device failed:', e);
    return false;
  }
}

async function doClaim(id, mode){
  if(mode === 'full' && !confirm('هتستلم الجهاز بالكامل والفني الحالي هيخرج منه.\nمتأكد؟')) return;
  const ov = document.getElementById('claimOv');
  try{
    const { error } = await sb.rpc('tech_claim_device',
      { p_id: id, p_mode: mode, p_tech_name: ME });
    if(error) throw error;
    if(ov) ov.remove();
    toast(mode === 'full' ? 'الجهاز بقى معاك ✅' : 'اتسجّلت مساعد (٢٥٪) ✅');

    render();
    openSheet(id);
  }catch(e){
    console.error('tech_claim_device failed:', e);
    toast('فشل الاستلام: ' + esc(e.message || e));

async function addNote(){

async function doHandoff(){
  const d=devices.find(x=>x.id===sheetId); if(!d||!handMode||!handTarget) return;

  const full  = handMode === 'full';
  const _kind = full ? 'note.handoffFull' : 'note.handoffAssist';
  const _args = { from: d.tech || '—', to: handTarget };
  const note  = mkNote(t(_kind, _args), _kind, _args);
  const patch = { activityNotes: notesForSave(d, note), lastModifiedAt: nowIso(), lastModifiedBy: ME };

  if(full){
    patch.technician = handTarget;
    // لو المستلم كان هو المساعد، مبقاش مساعد — بقى الأساسي
    if(d.assist === handTarget) patch.assistTechnician = '';
  } else {
    patch.assistTechnician = handTarget;
  }

  if(!(await save(d.id, patch))) return;

  if(full){
    // الجهاز مبقاش تحت مسؤوليته — نشيله من القائمة
    devices = devices.filter(x => x.id !== d.id);
    toast(`${t('rp.device')} اتسلّم بالكامل لـ ${esc(handTarget)} 🔄`);

    d.assist = handTarget;

    toast(`${esc(handTarget)} بقى ${t('tp.handAssist')} على ${t('rp.device')} 🤝`);
    render(); renderSheetKeepNote();
  }
}

// ============================================================
// 📦 قطع الغيار المخزنة (الاستوك) — شباك الفني على نفس المخزن
// ------------------------------------------------------------
// ⚠️ مفيش جدول جديد ولا نسخة تانية من البيانات. النافذة دي
//    بتقرا وبتكتب في نفس جدول `spare_parts` وعلى القطع اللي
//    `category = 'stored'` — نفس اللي بيظهر في «مخزن قطع الغيار»
//    تحت تبويب «قطع غيار مخزنة» في الداشبورد.
//    يعني: اللي الفني يضيفه هنا بيبان هناك، واللي المحاسب يحطه
//    هناك بيبان هنا. دولاب واحد بشباكين — مش مزامنة بين اتنين.
//
// ⚠️ الفني بيكتب اسم + كمية بس. السعر شغل المحاسب (زي أي قطعة
//    داخلة من فاتورة من غير سعر). وعشان كده كل ما الكمية تتغير
//    بنعيد حساب total_cost = كمية × سعر الوحدة — من غير كده
//    إجمالي المخزن في الداشبورد كان هيبقى غلط.
//
// ⚠️ دوسات + و − مش بتروح للسيرفر مع كل دوسة. بنستنى نص ثانية
//    بعد آخر دوسة وبنبعت الرقم النهائي مرة واحدة (SK_T).
//    من غير كده، الفني اللي بيدوس ١٠ مرات بيعمل ١٠ طلبات.
// ============================================================
let SK = { rows: [], loading: false, q: '', busy: false, log: [] };
// ⏱️ مدة ظهور الأثر: ٣ أيام من وقت الحركة
const SK_TRACE_DAYS = 3;
const SK_T = {};            // مؤقّت تجميع دوسات الكمية لكل قطعة

function skMoney(n){ return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-US'); }
// تبسيط الاسم قبل المقارنة — «شاشة ايفون 11» و«شاشة  ايفون 11 » حاجة واحدة
function skNorm(s){ return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase(); }

// ⏱️ «من إمتى» بالعربي — من غير ما نوري تاريخ كامل للفني
function skAgo(iso){
  const ms = Date.now() - new Date(iso).getTime();
  if(!(ms >= 0)) return '';
  const m = Math.floor(ms / 60000);
  if(m < 1)  return 'دلوقتي';
  if(m < 60) return 'من ' + m + ' دقيقة';
  const h = Math.floor(m / 60);
  if(h < 24) return 'من ' + h + ' ساعة';
  const d = Math.floor(h / 24);
  return d === 1 ? 'من يوم' : 'من ' + d + ' أيام';
}

// آخر تعديل كمية مسجّل للقطعة دي جوه الـ ٣ أيام (أو null)
function skLastQty(partId){
  return SK.log.find(l => l.action === 'qty' && l.part_id === partId) || null;
}

// القطع اللي اتمسحت جوه الـ ٣ أيام ولسه مش موجودة دلوقتي.
// ⚠️ بنستبعد أي قطعة موجودة فعلاً في القايمة — لو اتمسحت
//    واتضافت تاني بنفس الاسم، مش منطقي نوريها محذوفة.
function skGhosts(){
  const live = new Set(SK.rows.map(r => r.id));
  const seen = new Set();
  return SK.log.filter(l => {
    if(l.action !== 'delete') return false;
    if(l.part_id && live.has(l.part_id)) return false;
    if(l.part_id){ if(seen.has(l.part_id)) return false; seen.add(l.part_id); }
    return true;
  });
}

function skGhostHtml(l){
  const q = (l.old_qty == null) ? '' : ` (كانت ${Number(l.old_qty) || 0} قطعة)`;
  return `
    <div class="st-card gone">
      <div class="st-top"><div class="st-name">${esc(l.part_name || 'قطعة')}${q}</div></div>
      <div class="st-trace del">🗑 <b>اتمسحت</b> — ${esc(l.by_name || 'مش معروف')} · ${skAgo(l.at)}</div>
    </div>`;
}

function openStock(){
  let ov = document.getElementById('skOv');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'skOv'; ov.className = 'rw-ov';
    ov.onclick = e => { if(e.target === ov) closeStock(); };
    document.body.appendChild(ov);
  }
  SK.q = '';
  ov.innerHTML = skShellHtml();
  skPaintList();
  skLoad();
}

function closeStock(){
  const ov = document.getElementById('skOv'); if(ov) ov.remove();
}

// القشرة بتترسم مرة واحدة بس — عشان الكلام اللي الفني كاتبه في
// خانة الاسم ما يتمسحش كل ما القايمة تتحدّث.
function skShellHtml(){
  return `
    <div class="rw-sheet" dir="rtl">
      <div class="rw-head">
        <h3>📦 قطع الغيار المخزنة</h3>
        <button type="button" class="rw-x" onclick="skLoad(true)" title="تحديث">🔄</button>
        <button type="button" class="rw-x" onclick="closeStock()">✕</button>
      </div>
      <div class="rw-info">
        دي القطع المتخزّنة في المحل ومستنية أي جهاز.
        أي حاجة تضيفها هنا بتظهر على طول في <b>مخزن قطع الغيار</b> — والعكس.
      </div>
      <div class="st-add">
        <input class="nm" id="skName" maxlength="120" placeholder="اسم القطعة… مثلاً: شاشة ايفون 11"
          onkeydown="if(event.key==='Enter'){event.preventDefault();skAdd();}">
        <input class="qt" id="skQty" type="number" min="1" step="1" value="1" inputmode="numeric">
        <button type="button" class="st-addbtn" id="skAddBtn" onclick="skAdd()">➕ ضيف</button>
      </div>
      <input class="st-search" id="skQ" placeholder="🔍 دوّر على قطعة…" oninput="skSearch(this.value)">
      <div class="st-tot" id="skTot"></div>
      <div id="skList"></div>
    </div>`;
}

// جلب القطع المخزنة. بنجيب الأعمدة اللي محتاجينها بس — مش select('*') —
// عشان الاستهلاك (نفس درس الـ ٩٦ جيجا).
async function skLoad(manual){
  if(!navigator.onLine){
    if(manual) toast('مفيش نت — مش هينفع نحدّث دلوقتي');
    SK.loading = false; skPaintList(); return;
  }
  SK.loading = true; skPaintList();
  const since = new Date(Date.now() - SK_TRACE_DAYS * 86400000).toISOString();
  try{
    // الاتنين مع بعض — القطع الموجودة، ودفتر آخر ٣ أيام.
    // Promise.all عشان ما نستناش طلب ورا التاني على نت الموبايل.
    const [parts, log] = await Promise.all([
      sb.from('spare_parts')
        .select('id,name,quantity,unit_cost,total_cost,created_by,created_by_name,created_at')
        .eq('category', 'stored')
        .order('created_at', { ascending: false })
        .limit(500),
      sb.from('spare_parts_log')
        .select('id,part_id,part_name,action,old_qty,new_qty,by_name,at')
        .eq('category', 'stored')
        .gte('at', since)
        .order('at', { ascending: false })
        .limit(300)
    ]);
    // ⚠️ سوبابيز مبيرميش خطأ — بيرجّعه في error. لو ما شيكناش، القايمة
    //    كانت هتفضل فاضية من غير ما حد يعرف ليه.
    if(parts.error) throw parts.error;
    SK.rows = parts.data || [];
    // الدفتر مش حرج: لو فشل، القايمة تشتغل عادي من غير أثر.
    if(log.error){ console.error('[الاستوك] الدفتر فشل:', log.error); SK.log = []; }
    else SK.log = log.data || [];
    if(manual) toast('اتحدّثت ✅');
  }catch(e){
    console.error('[الاستوك] فشل الجلب:', e);
    toast('مقدرناش نجيب المخزن: ' + ((e && e.message) || ''));
  }
  SK.loading = false;
  skPaintList();
}

function skFiltered(){
  const q = skNorm(SK.q);
  if(!q) return SK.rows;
  return SK.rows.filter(p => skNorm(p.name).includes(q));
}

function skSearch(v){ SK.q = v; skPaintList(); }   // خانة البحث نفسها مش بتتلمس

// سطر «الكمية كانت كام» — بيفضل ظاهر ٣ أيام بعد التعديل وبعدين بيختفي لوحده
function skTraceHtml(p){
  const l = skLastQty(p.id);
  if(!l) return '';
  return `<div class="st-trace">✏️ الكمية كانت <span class="st-was">${Number(l.old_qty) || 0}</span>
    وبقت <span class="st-now">${Number(l.new_qty) || 0}</span> — ${esc(l.by_name || 'مش معروف')} · ${skAgo(l.at)}</div>`;
}

function skCardHtml(p){
  const qty   = Number(p.quantity) || 0;
  const price = Number(p.total_cost) || 0;
  const who   = p.created_by_name ? ' · ضافها ' + esc(p.created_by_name) : '';
  return `
    <div class="st-card" id="skc_${p.id}">
      <div class="st-top">
        <div class="st-name">${esc(p.name)}</div>
        <button type="button" class="st-del" onclick="skDel('${p.id}')" title="مسح">🗑</button>
      </div>
      <div class="st-meta">${price ? skMoney(price) + ' ج.م' : 'لسه من غير سعر'}${who}</div>
      ${skTraceHtml(p)}
      <div class="st-qrow">
        <button type="button" class="st-q" onclick="skQty('${p.id}',-1)">−</button>
        <span class="st-qn" id="skq_${p.id}">${qty}</span>
        <button type="button" class="st-q" onclick="skQty('${p.id}',1)">+</button>
        <span class="st-qlbl">قطعة</span>
      </div>
    </div>`;
}

function skPaintList(){
  const tot  = document.getElementById('skTot');
  const list = document.getElementById('skList');
  if(!list) return;
  const rows = skFiltered();
  const pcs  = rows.reduce((t, p) => t + (Number(p.quantity) || 0), 0);
  if(tot) tot.textContent = SK.loading ? 'بنجيب المخزن…' : `${rows.length} صنف · ${pcs} قطعة`;

  // الكروت المحذوفة بتتحط تحت خالص — أثر بيختفي لوحده بعد ٣ أيام،
  // مش جزء من المخزن. وبتتفلتر بنفس خانة البحث.
  const q = skNorm(SK.q);
  const ghosts = skGhosts().filter(l => !q || skNorm(l.part_name).includes(q));
  const ghostBlock = ghosts.length
    ? `<div class="rw-sep">🗑 اتمسح في آخر ٣ أيام</div>` + ghosts.map(skGhostHtml).join('')
    : '';

  list.innerHTML = SK.loading && !SK.rows.length
    ? '<div class="rw-empty">لحظة…</div>'
    : ((rows.length
        ? rows.map(skCardHtml).join('')
        : `<div class="rw-empty">${SK.q ? 'مفيش قطعة بالاسم ده' : 'المخزن فاضي — ضيف أول قطعة من فوق'}</div>`) + ghostBlock);
}

// ---------- إضافة قطعة ----------
async function skAdd(){
  const nEl = document.getElementById('skName');
  const qEl = document.getElementById('skQty');
  const bt  = document.getElementById('skAddBtn');
  if(!nEl) return;
  const name = (nEl.value || '').trim();
  const qty  = Math.max(1, parseInt(qEl && qEl.value, 10) || 1);
  if(!name){ toast('اكتب اسم القطعة الأول'); nEl.focus(); return; }
  if(!navigator.onLine){ toast('مفيش نت — الإضافة محتاجة اتصال'); return; }
  if(SK.busy) return;

  // القطعة موجودة بنفس الاسم؟ نزوّد كميتها بدل ما نعمل صف مكرر.
  // ⚠️ من غير كده المخزن بيمتلي «شاشة ايفون 11» أربع مرات وكل
  //    واحدة بكمية لوحدها، ومحدش يعرف العدد الحقيقي.
  const dup = SK.rows.find(p => skNorm(p.name) === skNorm(name));
  if(dup){
    if(!confirm(`«${dup.name}» موجودة بالفعل بكمية ${Number(dup.quantity) || 0}.\nنزوّدها ${qty}؟`)) return;
    nEl.value = ''; if(qEl) qEl.value = 1;
    skQtySet(dup.id, (Number(dup.quantity) || 0) + qty);
    return;
  }

  SK.busy = true; if(bt){ bt.disabled = true; bt.textContent = '⏳ …'; }
  try{
    let uid = null;
    try{ const { data:{ user } } = await sb.auth.getUser(); uid = user ? user.id : null; }catch(e){}
    const { data, error } = await sb.from('spare_parts').insert({
      name, quantity: qty,
      unit_cost: 0, total_cost: 0,          // السعر شغل المحاسب
      category: 'stored',
      device_id: null, device_label: null,
      created_by: uid,
      created_by_name: ME || ''
    }).select('id,name,quantity,unit_cost,total_cost,created_by,created_by_name,created_at').single();
    if(error) throw error;
    SK.rows.unshift(data);
    nEl.value = ''; if(qEl) qEl.value = 1;
    nEl.focus();
    skPaintList();
    toast('اتضافت للمخزن ✅');
  }catch(e){
    console.error('[الاستوك] فشل الإضافة:', e);
    toast('مقدرناش نضيفها: ' + ((e && e.message) || ''));
  }
  SK.busy = false; if(bt){ bt.disabled = false; bt.textContent = '➕ ضيف'; }
}

// ---------- تعديل الكمية ----------
// بنغيّر الرقم على الشاشة فوراً (عشان الدوس يحس بيه)، وبنبعت
// للسيرفر بعد نص ثانية من آخر دوسة. لو السيرفر رفض، بنرجّع الرقم.
function skQty(id, delta){
  const p = SK.rows.find(x => x.id === id); if(!p) return;
  const next = (Number(p.quantity) || 0) + delta;
  if(next < 1){ toast('الكمية مبتنزلش عن ١ — لو خلصت امسحها 🗑'); return; }
  skQtySet(id, next);
}

function skQtySet(id, next){
  const p = SK.rows.find(x => x.id === id); if(!p) return;
  p.quantity = next;
  const el = document.getElementById('skq_' + id);
  if(el) el.textContent = next; else skPaintList();
  clearTimeout(SK_T[id]);
  SK_T[id] = setTimeout(() => skQtyFlush(id), 500);
}

async function skQtyFlush(id){
  const p = SK.rows.find(x => x.id === id); if(!p) return;
  if(!navigator.onLine){ toast('مفيش نت — الكمية مااتحفظتش'); skLoad(); return; }
  const qty  = Number(p.quantity) || 1;
  const unit = Number(p.unit_cost) || 0;
  const card = document.getElementById('skc_' + id);
  if(card) card.classList.add('busy');
  try{
    const { error } = await sb.from('spare_parts')
      .update({ quantity: qty, total_cost: +(qty * unit).toFixed(2) })
      .eq('id', id);
    if(error) throw error;
    p.total_cost = +(qty * unit).toFixed(2);
    skLoad();           // نرجّع نقرا الدفتر عشان سطر «كانت كام» يبان فوراً
  }catch(e){
    console.error('[الاستوك] فشل حفظ الكمية:', e);
    toast('الكمية مااتحفظتش: ' + ((e && e.message) || ''));
    await skLoad();                 // نرجّع الشاشة لحقيقة السيرفر
  }
  if(card) card.classList.remove('busy');
  skPaintList();
}

// ---------- مسح قطعة ----------
async function skDel(id){
  const p = SK.rows.find(x => x.id === id); if(!p) return;
  const price = Number(p.total_cost) || 0;
  const warn = price
    ? `\n\n⚠️ القطعة دي عليها سعر مسجّل (${skMoney(price)} ج.م) — يعني داخلة من فاتورة. متأكد؟`
    : '';
  if(!confirm(`تحذف «${p.name}»؟\nهتتنقل لـ«قطع غيار محذوفة» عند المحاسب، وتتمسح نهائي بعد ٣٠ يوم.${warn}`)) return;
  if(!navigator.onLine){ toast('مفيش نت — المسح محتاج اتصال'); return; }
  const card = document.getElementById('skc_' + id);
  if(card) card.classList.add('busy');
  try{
    // ⚠️ مش delete — السيرفر بينقلها لسلة المحذوفات (٣٠ يوم) ويسجّلها في الدفتر
    const { data, error } = await sb.rpc('trash_spare_parts', { p_ids: [id], p_by_name: ME || '' });
    if(error) throw error;
    if(!data) throw new Error('القطعة ما اتنقلتش');
    SK.rows = SK.rows.filter(x => x.id !== id);
    skPaintList();
    toast('اتمسحت 🗑');
    skLoad();           // الدفتر بقى فيه سطر جديد — نجيبه عشان الكارت الرمادي يبان
  }catch(e){
    console.error('[الاستوك] فشل المسح:', e);
    toast('مقدرناش نمسحها: ' + ((e && e.message) || ''));
    if(card) card.classList.remove('busy');
  }
}

/* ===== توست ===== */
let toastT;
function toast(msg){ const el=$('toast'); el.innerHTML=msg; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2600); }

/* ===== الخروج ===== */
async function doLogout(){
  try{ await sb.auth.signOut(); }catch(e){}
  try{
    localStorage.removeItem('ifix_tech_me');
    localStorage.removeItem(CACHE_KEY);
    // ⚠️ لازم نمسح الدور المخزّن عشان مستخدم تاني على نفس الجهاز
    // ما يتحوّلش لصفحة الفني بالغلط
    // الدور بيفضل محفوظ — مربوط بالإيميل، فحساب تاني مش هيتأثر بيه.
    sessionStorage.removeItem('ifix-bounced');
  }catch(e){}
  location.replace('index.html');
}

/* ============================================================
   التحديث
   ------------------------------------------------------------
   شيلنا اشتراك Realtime على devices_data. الاشتراك على جدول
   بآلاف الصفوف بياكل حصة الـ Realtime بسرعة على الخطة المجانية،
   وكان سبب مشترك في رسالة "تجاوز الحصة".
   البديل: تحديث لما الفني يرجع للصفحة — كفاية عملياً.
   ============================================================ */
async function refresh(){
  if(!booted || !navigator.onLine) return;
  const keepNote = $('noteTxt') ? $('noteTxt').value : '';
  await loadDevices();
  // ⚠️ لازم نعيد قراية الإعدادات كمان — جواها ترتيب الفنيين.
  //    من غير السطر ده الترتيب كان بيتقرا مرة واحدة عند فتح الصفحة
  //    وبعدين يفضل متجمّد، حتى لو الفني علّم أجهزة تانية "تم الصيانة".
  loadNotices().then(() => {
    // لو شاشة الترتيب مفتوحة دلوقتي، تتحدّث في مكانها
    try{
      const sh = $('sheet');
      if(sh && sh.classList.contains('on') && sh.innerHTML.indexOf('\u062a\u0631\u062a\u064a\u0628 \u0627\u0644\u0641\u0646\u064a\u064a\u0646') >= 0) renderTechBoard();
    }catch(e){}
  }).catch(() => {});
  render();
  if(sheetId){
    if(devices.some(x => x.id === sheetId)){
      renderSheet();
      if($('noteTxt')) $('noteTxt').value = keepNote;
    } else closeSheet();
  }
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(); });

addEventListener('online', refresh);
addEventListener('offline', () => { offline = true; showOffline(); });

</script>
<script>
// ============================================================
// قايمة ⋮ في الهيدر
// ------------------------------------------------------------
// الخروج كان زرار مكشوف في الهيدر — سهل يتدوس بالغلط والفني بيفقد
// شغله. دلوقتي بقى آخر بند في القايمة ومعاه تأكيد.

<div class="set-bg hidden" id="setBg" onclick="if(event.target===this) closeSettings()">
  <div class="set-card">

    <div class="set-lbl" data-i18n="rp.theme">🎨 المظهر</div>
    <div class="set-row" id="setRow"></div>
    <p class="set-note" id="setNote"></p>
    <div class="set-lbl" style="margin-top:16px;" data-i18n="rp.lang">🌐 اللغة</div>
    <div class="set-row2" id="setLang"></div>

  </div>
</div>
<script>
// ============================================================
// الإعدادات — المظهر
// ------------------------------------------------------------
// نفس مفتاح الداشبورد (ifix-theme)، فاختيار الفني بيسري على أي
// شاشة يفتحها في النظام.
// التلقائي: فاتح من ٧ص لـ ٧م، وداكن بعد كده.
// ============================================================
var LANGS = [{k:'ar', i:'🇪🇬', n:'العربية', s:'RTL'}, {k:'en', i:'🇬🇧', n:'English', s:'LTR'}];
function curLang(){ try{ return I18N.getLang(); }catch(e){ return 'ar'; } }
function pickLang(l){
  if(l === curLang()){ closeSettings(); return; }
  try{ I18N.setLang(l); }catch(e){}   // بيحفظ ويعيد التحميل
}

var THEMES = [
  { k:'light', i:'☀️', n:t('rp.themeLight') },
  { k:'dark',  i:'🌙', n:t('rp.themeDark') },
  { k:'auto',  i:'⏰', n:t('rp.themeAuto') },
];
function themeMode(){ try{ return localStorage.getItem('ifix-theme') || 'auto'; }catch(e){ return 'auto'; } }
function isDarkNow(m){
  if(m==='dark') return true;
  if(m==='light') return false;
  var h = new Date().getHours();
  return h >= 19 || h < 7;
}
function applyTheme(){
  var d = isDarkNow(themeMode());
  document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
  var mt = document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', d ? '#0E1721' : '#1B2A3A');
}
// ============================================================
// ترتيب الفنيين — عرض بس
// ------------------------------------------------------------
// مفيش ضغط على اسم ولا صفحة أجهزة: الفني بيشوف أرقامه وأرقام
// زمايله، مش أجهزتهم. ده مقصود — قايمة الأجهزة فيها أسامي عملاء
// وأرقامهم، وde مش شغل الفني.
let techBoard = null;
let tbMode = 'month';        // 'today' | 'month'

// ⚠️ الصفحة دي مافيهاش --accent (اللي موجود: --blue · --gold · --card).
//    الشرايح كانت بتستخدمه، فالخلفية بتفشل والخط الأبيض يقع على
//    خلفية بيضا في الثيم الفاتح — نص مش باين خالص.
const TB_BLUE = '#2563EB';

// نصوص الشاشة دي بس — أسطر قليلة ما تستاهلش لمس i18n.js المشترك
function tbT(k){
  let en = false;
  try{ en = (typeof I18N !== 'undefined' && I18N.getLang() === 'en'); }catch(e){}
  const M = {
    title:   ['\u062a\u0631\u062a\u064a\u0628 \u0627\u0644\u0641\u0646\u064a\u064a\u0646', 'Technician ranking'],
    today:   ['\u0627\u0644\u0646\u0647\u0627\u0631\u062f\u0647', 'Today'],
    d30:     ['\u0622\u062e\u0631 \u0663\u0660 \u064a\u0648\u0645', 'Last 30 days'],
    tech:    ['\u0627\u0644\u0641\u0646\u064a', 'Technician'],
    points:  ['\u0627\u0644\u0646\u0642\u0627\u0637', 'Points'],
    done:    ['\u0623\u062c\u0647\u0632\u0629', 'Devices'],
    avg:     ['\u0645\u062a\u0648\u0633\u0637 \u0627\u0644\u0645\u062f\u0629', 'Avg time'],
    returns: ['\u0645\u0631\u062a\u062c\u0639', 'Returns'],
    day:     ['\u064a\u0648\u0645', 'd'],
    lessDay: ['\u0623\u0642\u0644 \u0645\u0646 \u064a\u0648\u0645', '< 1d'],
    you:     ['(\u0625\u0646\u062a)', '(you)'],
    updated: ['\u0622\u062e\u0631 \u062a\u062d\u062f\u064a\u062b:', 'Updated:'],
    r1:      ['\ud83e\udd47 \u0627\u0644\u0645\u062a\u0635\u062f\u0631', '\ud83e\udd47 1st'],
    r2:      ['\ud83e\udd48 \u0627\u0644\u062a\u0627\u0646\u064a', '\ud83e\udd48 2nd'],
    r3:      ['\ud83e\udd49 \u0627\u0644\u062a\u0627\u0644\u062a', '\ud83e\udd49 3rd'],
    rLast:   ['\u0627\u0644\u0623\u062e\u064a\u0631', 'Last'],
    rLast2:  ['\u0642\u0628\u0644 \u0627\u0644\u0623\u062e\u064a\u0631', 'Second to last'],
    rN:      ['\u0627\u0644\u062a\u0631\u062a\u064a\u0628 {n}', 'Rank {n}'],
    paused:  ['\u0627\u0644\u062a\u062d\u062f\u064a\u062b\u0627\u062a \u0645\u0648\u0642\u0648\u0641\u0629 \u0644\u062d\u064a\u0646 \u062d\u0636\u0648\u0631 \u0627\u0644\u0645\u062d\u0627\u0633\u0628\u064a\u0646',
              'Updates paused until an accountant is online'],
    resume:  ['\u0634\u063a\u0644\u0643 \u0645\u062a\u0633\u062c\u0651\u0644 \u0648\u0645\u062d\u0641\u0648\u0638 \u2014 \u0627\u0644\u062a\u0631\u062a\u064a\u0628 \u0647\u064a\u062a\u062d\u062f\u0651\u062b \u0623\u0648\u0644 \u0645\u0627 \u064a\u0641\u062a\u062d\u0648\u0627 \u0627\u0644\u0646\u0638\u0627\u0645',
              'Your work is saved — the ranking updates once they open the system'],
    empty:   ['\u0644\u0633\u0647 \u0645\u0641\u064a\u0634 \u062a\u0631\u062a\u064a\u0628 \u2014 \u0647\u064a\u0638\u0647\u0631 \u0623\u0648\u0644 \u0645\u0627 \u0627\u0644\u0645\u062d\u0627\u0633\u0628 \u064a\u0641\u062a\u062d \u0627\u0644\u0646\u0638\u0627\u0645',
              'No ranking yet — it appears once the accountant opens the system'],
  };
  return (M[k] || ['',''])[en ? 1 : 0];
}

function openTechBoard(){
  closeKebab();
  renderTechBoard();
  $('sheet').classList.add('on'); $('sheetBg').classList.add('on');
}

function setTbMode(m){ tbMode = m; renderTechBoard(); }

function renderTechBoard(){
  const rows = (techBoard && techBoard[tbMode === 'today' ? 'today' : 'd30']) || [];
  const at = techBoard && techBoard.at;
  const chip = (m, lbl) =>
    `<button onclick="setTbMode('${m}')" style="border:1px solid ${tbMode===m?TB_BLUE:'var(--line)'};`
    + `background:${tbMode===m?TB_BLUE:'transparent'};color:${tbMode===m?'#fff':'var(--ink)'};`
    + `border-radius:999px;padding:7px 15px;font:800 12.5px/1 inherit;cursor:pointer;">${lbl}</button>`;

  const fmtAvg = v => (v === null || v === undefined) ? '—'
                    : (v < 1 ? tbT('lessDay') : Number(v).toFixed(1) + ' ' + tbT('day'));

  // ============================================================
  // لقب الترتيب — بيظهر جنب اسم الفني **نفسه بس**
  // ------------------------------------------------------------
  // ⚠️ مقصود إن كل واحد يشوف لقبه هو ومايشوفش ألقاب زمايله:
  //    اللقب حافز شخصي، ولو الكل شايف مين "الأخير" بيتحوّل لإحراج
  //    قدام الزمايل بدل ما يبقى دافع للتحسّن.
  //
  // الألقاب من فوق (١·٢·٣) ومن تحت (الأخير · قبل الأخير).
  // بنطبّق ألقاب التحت لما الترتيب أكبر من ٣ بس — عشان مع فريق
  // صغير مايحصلش تضارب (تالت = قبل الأخير في نفس الوقت).
  // ⚠️ الشارة لازم تتغيّر مع الثيم — لون واحد للاتنين مستحيل ينفع.
  //    أول محاولة كانت ألوان غامقة (#475569 للفضي) — مقروءة على
  //    الأبيض وبتختفي تماماً على الأزرق الداكن.
  //    فالغامق بياخد درجات فاتحة، والفاتح بياخد درجات غامقة.
  const tbDark = () => {
    try{ return document.documentElement.getAttribute('data-theme') === 'dark'; }
    catch(e){ return false; }
  };

  function tbRankLabel(i, total){
    const r = i + 1;
    const D = tbDark();
    // [نص فاتح للغامق, نص غامق للفاتح, درجة الخلفية والحدود]
    const mk = (txt, dk, lt, rgb) => ({
      txt,
      col: D ? dk : lt,
      bg:  `rgba(${rgb},${D ? '.20' : '.16'})`,
      bd:  `rgba(${rgb},${D ? '.60' : '.42'})`
    });
    if(r === 1) return mk(tbT('r1'), '#FBBF24', '#8A4A05', '217,119,6');      // ذهبي
    if(r === 2) return mk(tbT('r2'), '#CBD5E1', '#475569', '148,163,184');    // فضي
    if(r === 3) return mk(tbT('r3'), '#FDBA74', '#92400E', '234,138,60');     // برونزي
    if(r > 3 && r === total)     return mk(tbT('rLast'),  '#FCA5A5', '#A81B1B', '220,38,38');
    if(r > 3 && r === total - 1) return mk(tbT('rLast2'), '#FDBA74', '#9A3A08', '234,88,12');
    // الترتيب في النص لازم يبقى ملوّن برضه — كان بيطلع رمادي بلا
    // خلفية فيبان كإنه نص مهمل، والباقي شارات ملوّنة.
    return mk(tbT('rN').replace('{n}', r), '#93C5FD', '#1D4ED8', '37,99,235');
  }
  const badge = (i, total) => {
    const b = tbRankLabel(i, total);
    return `<span style="display:inline-block;margin-inline-start:6px;font-size:10.5px;font-weight:900;`
         + `color:${b.col};background:${b.bg};border:1px solid ${b.bd};`
         + `border-radius:6px;padding:2px 7px;line-height:1.6;">${b.txt}</span>`;
  };

  // ⏸️ الترتيب بيتنشر من داشبورد المحاسب. لو مفيش داشبورد مفتوح،
  //    الأرقام بتفضل زي ما هي مهما الفني علّم أجهزة — فبنقول كده
  //    بصراحة بدل ما يفتكر إن شغله مش بيتحسب.
  // ⚠️ ٢٥ دقيقة — والداشبورد بيجدّد الوقت كل ٥ دقايق وهو مفتوح.
  //    الهامش (٥ نبضات) بيمنع أي إنذار كاذب لو النت اتقطع لحظة،
  //    وفي نفس الوقت الفني بيعرف بسرعة إن المحاسب قفل.
  //    كانت ٩٠ دقيقة: يعني المحاسب يقفل ٦ والفني يفضل ساعة ونص
  //    شايف أرقام قديمة من غير أي تنبيه.
  const STALE_MS = 25 * 60 * 1000;
  const stale = at && (Date.now() - new Date(at).getTime() > STALE_MS);
  // ⚠️ من غير أي ميعاد. النظام مش بيحدّث في ساعة معيّنة — بيحدّث
  //    أول ما أي داشبورد يفتح. أي رقم ساعة هنا هيبقى وعد مش موجود.
  const staleBar = stale ? `
    <div style="background:rgba(180,83,9,.12);border:1px solid rgba(180,83,9,.45);color:#B45309;
                border-radius:10px;padding:10px 12px;font-size:12px;font-weight:800;
                line-height:1.75;margin-bottom:12px;">
      ⏸️ ${tbT('paused')}<br>
      <span style="font-weight:500;">${tbT('resume')}</span>
    </div>` : '';

  const body = rows.length ? `
    <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
      <tr style="color:var(--muted);font-size:11.5px;">
        <th style="text-align:start;padding:7px 6px;">#</th>
        <th style="text-align:start;padding:7px 6px;">${tbT('tech')}</th>
        <th style="padding:7px 6px;">⭐ ${tbT('points')}</th>
        <th style="padding:7px 6px;">${tbT('done')}</th>
        <th style="padding:7px 6px;">${tbT('avg')}</th>
        <th style="padding:7px 6px;">${tbT('returns')}</th>
      </tr>
      ${rows.map((r,i) => `
      <tr style="border-top:1px solid var(--line);${r.t === ME ? (tbDark()?'background:rgba(59,130,246,.16);':'background:rgba(37,99,235,.10);') : ''}">
        <td style="padding:9px 6px;color:var(--muted);">${i+1}</td>
        <td style="padding:9px 6px;font-weight:800;">${esc(r.t)}${r.t === ME ? badge(i, rows.length) : ''}</td>
        <td style="padding:9px 6px;text-align:center;font-weight:900;color:${tbDark()?'#93C5FD':TB_BLUE};">${r.points}</td>
        <td style="padding:9px 6px;text-align:center;">${r.count}</td>
        <td style="padding:9px 6px;text-align:center;color:var(--muted);">${fmtAvg(r.avg)}</td>
        <td style="padding:9px 6px;text-align:center;">${r.ret} <span style="color:var(--muted);font-size:11px;">(${r.rate}%)</span></td>
      </tr>`).join('')}
    </table></div>` :
    `<div style="text-align:center;color:var(--muted);padding:26px 10px;font-size:13px;">${tbT('empty')}</div>`;

  $('sheet').innerHTML = `
    <div style="padding:16px 16px 22px;">
      <div style="font:900 16px/1.4 'Cairo',sans-serif;margin-bottom:12px;">🏆 ${tbT('title')}</div>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        ${chip('today', tbT('today'))}${chip('month', tbT('d30'))}
      </div>
      ${staleBar}
      ${body}
      ${at ? `<div style="color:var(--muted);font-size:11px;margin-top:12px;text-align:center;">${tbT('updated')} ${new Date(at).toLocaleString('ar-EG')}</div>` : ''}
    </div>`;
}

function openSettings(){ closeKebab(); renderSettings(); document.getElementById('setBg').classList.remove('hidden'); }
function closeSettings(){ var e=document.getElementById('setBg'); if(e) e.classList.add('hidden'); }
function renderSettings(){
  var cur = themeMode();
  document.getElementById('setRow').innerHTML = THEMES.map(function(x){
    return '<button class="set-o'+(x.k===cur?' on':'')+'" onclick="pickTheme(\''+x.k+'\')">'
         + '<span class="i">'+x.i+'</span><span>'+x.n+'</span></button>';
  }).join('');
  var lg = curLang();
  document.getElementById('setLang').innerHTML = LANGS.map(function(x){
    return '<button class="set-o'+(x.k===lg?' on':'')+'" onclick="pickLang(\''+x.k+'\')">'
         + '<span class="i">'+x.i+'</span><span>'+x.n+'</span>'
         + '<span style="font-size:10.5px;font-weight:400;opacity:.7">'+x.s+'</span></button>';
  }).join('');
  document.getElementById('setNote').textContent = cur==='auto'
    ? t('rp.themeAutoHint', { on: isDarkNow('auto') ? t('rp.themeDark') : t('rp.themeLight') })
    : '';
}
function pickTheme(m){
  try{ localStorage.setItem('ifix-theme', m); }catch(e){}
  applyTheme(); renderSettings();
}
// في الوضع التلقائي الشاشة تتبدّل لوحدها لما الساعة تعدّي الحد
setInterval(function(){ if(themeMode()==='auto') applyTheme(); }, 60000);
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSettings(); });
</script>
<script>
/* الترجمة بتتطبق بعد ما كل السكريبتات تحمّل — والاتجاه بيتظبط من I18N */
// ============================================================
// الترجمة للمحتوى المتولّد
// ------------------------------------------------------------
// applyI18n بتشتغل مرة واحدة وقت التحميل، لكن معظم الواجهة هنا
// بتتبني بعد كده من قوالب جافاسكريبت. فبنلفّ innerHTML: أي حقن
// جديد بتتطبّق عليه الترجمة على طول.
// ------------------------------------------------------------
(function(){
  var d = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  if(!d || !d.set) return;
  Object.defineProperty(Element.prototype, 'innerHTML', {
    configurable: true, enumerable: d.enumerable, get: d.get,
    set: function(v){
      d.set.call(this, v);
      try{ if(window.I18N && I18N.applyI18n) I18N.applyI18n(this); }catch(e){}
    }
  });
})();

document.addEventListener('DOMContentLoaded', function(){
  try{ I18N.applyI18n(document); }catch(e){}
  try{ mountScanBtn(); }catch(e){}
});
</script>
