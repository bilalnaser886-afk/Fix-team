<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>أجهزتي — I Fix Team</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0891A8">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#F3F5F7; color:#1A2332;
    font-family:'Tajawal','Segoe UI',Tahoma,sans-serif; text-align:center; padding:24px;
  }
  .box{max-width:320px;}
  .logo{
    width:74px; height:74px; border-radius:18px; margin:0 auto 18px; overflow:hidden;
    box-shadow:0 6px 20px rgba(16,16,20,.12);
  }
  .logo img{width:100%; height:100%; object-fit:cover; display:block;}
  h1{font-size:19px; font-weight:900; margin:0 0 8px;}
  p{font-size:14px; color:#64748B; margin:0; line-height:1.8;}
  .spin{
    width:28px; height:28px; margin:20px auto 0; border-radius:50%;
    border:3px solid #E2E8F0; border-top-color:#0891A8;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg);}}
  .fallback{margin-top:20px;}
  .fallback a{
    display:inline-block; background:#0891A8; color:#fff; text-decoration:none;
    font-weight:800; font-size:14px; padding:11px 20px; border-radius:11px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><img src="icon-192.png" alt=""></div>
    <h1>📱 أجهزتي</h1>
    <p id="msg">جاري تحميل أجهزتك...</p>
    <div class="spin" id="spin"></div>
    <div class="fallback" id="fallback" style="display:none;">
      <a href="dashboard.html#my-devices">افتح أجهزتي</a>
    </div>
  </div>

<script>
// ============================================================
// نقطة دخول الفني: /my-devices
// ------------------------------------------------------------
// الصفحة دي مجرد باب — الشغل الحقيقي في dashboard.html، وهو اللي فيه
// طبقة الأوفلاين والمزامنة والصلاحيات. الفني بيفتح اللينك ده (يحفظه على
// الشاشة الرئيسية للموبايل) وبوابة "أجهزتي" بتتفتح له تلقائياً ومايقدرش يقفلها.
//
// ليه مش صفحة مستقلة بالكامل؟ لأن ده كان معناه تكرار المصادقة وطبقة
// الأوفلاين وطابور المزامنة — وأي اختلاف بينهم بيولّد باجات صعبة الاكتشاف.
// ============================================================
(function(){
  var target = 'dashboard.html#my-devices';

  // لو الجهاز أوفلاين، الـ Service Worker هو اللي هيخدم الصفحة من الكاش
  try{
    window.location.replace(target);
  }catch(e){
    window.location.href = target;
  }

  // لو التحويل ما حصلش لأي سبب (حجب، أو جافاسكريبت متوقفة جزئياً)،
  // نوري الفني زرار يدوس عليه بنفسه بدل ما يفضل مستني
  setTimeout(function(){
    var s = document.getElementById('spin');
    var m = document.getElementById('msg');
    var f = document.getElementById('fallback');
    if(s) s.style.display = 'none';
    if(m) m.textContent = 'اضغط الزرار لفتح أجهزتك.';
    if(f) f.style.display = '';
  }, 2500);
})();
</script>
</body>
</html>
