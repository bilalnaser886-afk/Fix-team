  if(PAY_Q){
    const q = PAY_Q.trim().toLowerCase();
    list = list.filter(e => e.includes(q) || nameOf(e).toLowerCase().includes(q));
  }

  if(!list.length){
    box.innerHTML = '<div class="empty">' +
      (PAY_Q ? 'مفيش موظف بالاسم ده' :
       'مفيش موظفين متسجّلين<br><small>ضيفهم من لوحة الأدمن الأول</small>') +
      '</div>';
    return;
  }

  // ملخص فوق: كام مرتب متحدد، وإجمالي المرتبات والخصومات
  let setN = 0, totSal = 0, totDed = 0;
  allPeople().forEach(e => {
    if(SALS[e] != null){ setN++; totSal += SALS[e]; }
    totDed += manualDed(e).total + lateDed(e).total;
  });

  box.innerHTML = `
    ${penStartHtml()}

    <div class="kpis" style="margin:14px 0 16px;">
      <div class="kpi"><div class="v">${setN}/${allPeople().length}</div><div class="l">مرتب متحدد</div></div>
      <div class="kpi"><div class="v">${totSal.toLocaleString('en-US')}</div><div class="l">إجمالي المرتبات</div></div>
      <div class="kpi"><div class="v" style="color:${totDed?'var(--red)':'inherit'}">${totDed.toLocaleString('en-US')}</div><div class="l">كل الخصومات</div></div>
    </div>
    ${list.map(prCardHtml).join('')}`;
}

// مجموع ساعات الشهر المعروض لموظف
function monthHours(email){
  const byDay = OVER[(email||'').toLowerCase()] || {};
  let over = 0, short = 0;
  Object.keys(byDay).forEach(d => {
    over  += Number(byDay[d].over_min  || 0);
    short += Number(byDay[d].short_min || 0);
  });
  return { over, short, net: over - short };
}

function prCardHtml(e){
  const m   = manualDed(e);
  // ⚠️ خصم التأخير بتاع **الشهر المعروض فوق في الصفحة الرئيسية**
  //    مش كل التاريخ — عشان يتماشى مع المرتب الشهري.
  const lt  = lateDed(e);
  const sal = SALS[e];
  const has = sal != null;
  const net = (has ? sal : 0) - m.total - lt.total;
  // معرّف آمن للخانة: الإيميل فيه @ و . فمينفعش يبقى id مباشرة
  const uid = 'sal_' + e.replace(/[^a-z0-9]/gi, '_');
  return `
  <div class="pr-card${m.unseen ? ' alert' : ''}">
    <div class="pr-top">
      <div class="avatar" style="background:${avatarColor(e)}">${esc(nameOf(e).charAt(0))}</div>
      <div class="card-id">
        <b>${esc(nameOf(e))}</b>
        <span>${esc(e)}</span>
      </div>
    </div>

    <div class="pr-sal">
      <label>💵 المرتب</label>
      <input type="number" id="${uid}" min="0" step="50" inputmode="decimal"
             placeholder="لسه مش متحدد" value="${has ? sal : ''}">
      <button onclick="saveSalary('${esc(e)}','${uid}')">💾</button>
    </div>

    <div class="pr-nums" style="grid-template-columns:repeat(3,1fr);">
      <div>
        <b style="color:${m.total ? 'var(--red)' : 'inherit'}">${m.total.toLocaleString('en-US')}</b>
        <span>خصم يدوي</span>
      </div>
      <div>
        <b style="color:${lt.total ? 'var(--red)' : 'inherit'}">${lt.total.toLocaleString('en-US')}</b>
        <span>خصم تأخير</span>
      </div>
      <div>
        <b style="color:${has ? (net < 0 ? 'var(--red)' : 'var(--done)') : 'var(--muted)'}">${
          has ? net.toLocaleString('en-US') : '—'}</b>
        <span>الصافي ج.م</span>
      </div>
    </div>

    ${(() => {
      const h = monthHours(e);
      if(!h.over && !h.short) return '';
      const plus = h.net >= 0;
      return `<div class="pr-bell" style="color:${plus ? 'var(--done)' : 'var(--red)'};">
        ${plus ? '⏫ أوفر تايم' : '⏬ عجز ساعات'} ${fmtDur(Math.abs(h.net))}
        <span style="opacity:.75;font-weight:400;">(زيادة ${fmtDur(h.over)} · ناقص ${fmtDur(h.short)})</span>
      </div>`;
    })()}
    ${lt.days ? `<div class="pr-bell" style="color:var(--waiting);">⏰ ${lt.days} يوم تأخير
      محسوب تلقائي — تقدر تشيله من 📋 السجل</div>` : ''}
    ${m.unseen ? `<div class="pr-bell">🔔 ${m.unseen} رسالة لسه ما قراهاش الموظف</div>` : ''}

    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="pr-ded-btn" style="margin:0;flex:1;"
              onclick="openDeduction('${esc(e)}')">💸 خصم</button>
      <button class="pr-slip-btn" onclick="openPayslips('${esc(e)}')">🧾 الكشوف</button>
    </div>
  </div>`;
}

async function saveSalary(email, uid){
  const el = document.getElementById(uid);
  if(!el) return;
  const raw = (el.value || '').trim();

  // خانة فاضية = «لسه مش متحدد». مش بنكتب صفر عشان الموظف
  // ما يشوفش «مرتبك ٠ ج.م» وده مجرد إن حد نسي يكتبه.
  if(raw === ''){ alert('اكتب المرتب الأول'); el.focus(); return; }

  const amt = parseFloat(raw);
  if(isNaN(amt) || amt < 0){ alert('المرتب مينفعش يكون بالسالب'); return; }

  const btn = el.parentNode.querySelector('button');
  if(btn){ btn.disabled = true; btn.textContent = '⏳'; }
  try{
    const { error } = await sb.rpc('hr_set_salary', { p_email: email, p_amount: amt });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error. من غير السطر ده
    //    الزرار هيوري ✅ والمرتب ما اتكتبش.
    if(error) throw error;
    SALS[email] = amt;
    if(btn){ btn.textContent = '✅'; }
    // بنعيد الرسم بعد لحظة عشان الصافي يتحدّث، والعلامة تبان للمستخدم
    setTimeout(renderPayrollAdmin, 700);
  }catch(e){
    console.error('saveSalary failed:', e);
    if(btn){ btn.disabled = false; btn.textContent = '💾'; }
    const t = (e && e.message) ? e.message : String(e);
    alert(/does not exist|42883|42P01/i.test(t)
      ? '❌ الميزة لسه ماتركبتش في قاعدة البيانات — شغّل ملف 34-hr-salaries.sql'
      : '❌ فشل حفظ المرتب: ' + t);
  }
}

const STATE_LBL = {
  ontime: { t:'في الميعاد', c:'var(--done)' },
  grace:  { t:'جوه السماح', c:'var(--done)' },
  backup: { t:'المعاد الاحتياطي', c:'var(--waiting)' },
  late:   { t:'متأخر', c:'var(--red)' }
};
