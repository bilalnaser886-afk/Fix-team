<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
/* المظهر قبل أي رسم — نفس مفتاح باقي الصفحات (ifix-theme).
   من غير ده فيه ومضة بيضا قبل ما الغامق يشتغل. */
(function(){
  try{
    var m = localStorage.getItem('ifix-theme') || 'auto';
    var h = new Date().getHours();
    var d = m === 'dark' || (m === 'auto' && (h >= 19 || h < 7));
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>شؤون العاملين — I Fix Team</title>
<meta name="theme-color" content="#1B2A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HR">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<!-- نفس مكتبة الداشبورد بالظبط — عشان شكل ملف الإكسل يبقى واحد في النظام كله -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="attendance.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* نفس ألوان باقي النظام بالحرف — الصفحة دي مش بتخترع لغة تصميم جديدة */
  :root{
    --chrome:#16233A; --on-chrome:#FFFFFF;
    --paper:#EBEEF2; --card:#FFFFFF; --line:#E4E9EF;
    --ink:#17222E; --ink-2:#475569; --muted:#6B7A8C; --faint:#94A3B4;
    --red:#E8321E; --done:#15803D; --done-bg:#EAF6EE;
    --waiting:#B5651D; --waiting-bg:#FBF2E9;
    --blue:#2B6CB0; --blue-bg:#EAF1F8;
    --mono:ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  :root{ --bg:var(--paper); --surface:var(--card); --surface-2:var(--paper);
         --border:var(--line); --muted-2:var(--faint); }
  html[data-theme="dark"]{
    color-scheme:dark;
    --chrome:#0E1721; --on-chrome:#E9EFF5;
    --paper:#131E29; --card:#1B2A3A; --line:#2F4356;
    --ink:#E9EFF5; --ink-2:#C3D2DF; --muted:#92A6B8; --faint:#71879B;
    --red:#F0554A; --done:#4ADE80; --done-bg:rgba(74,222,128,.14);
    --waiting:#E0A15C; --waiting-bg:rgba(224,161,92,.15);
    --blue:#7BA9DC; --blue-bg:rgba(123,169,220,.15);
  }

  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:'Tajawal',system-ui,sans-serif; padding-bottom:40px;}

  .topbar{position:sticky; top:0; z-index:20; background:var(--chrome);
    color:var(--on-chrome); display:flex; align-items:center; gap:12px;
    padding:calc(12px + env(safe-area-inset-top)) 16px 13px;}
  .topbar h1{flex:1; min-width:0; margin:0; font-family:'Cairo',sans-serif;
    font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar .who{font-size:11.5px; opacity:.75;}
  .icon-btn{border:none; background:rgba(255,255,255,.12); color:inherit;
    width:38px; height:38px; border-radius:11px; font-size:17px; cursor:pointer;}

  .wrap{padding:16px;}
  .bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .bar input, .bar select{border:1px solid var(--border); background:var(--surface);
    color:var(--ink); border-radius:10px; padding:10px 12px; font-family:inherit; font-size:14px;}
  .bar input[type="search"]{flex:1; min-width:150px;}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:16px;}
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
  .kpi .v{font-family:'Cairo',sans-serif; font-weight:900; font-size:21px;}
  .kpi .l{font-size:12px; color:var(--muted); margin-top:2px;}

  .day{border:1px solid var(--border); border-radius:11px; padding:11px 13px; margin-bottom:8px;}
  .day-h{display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-weight:800; font-size:13.5px; margin-bottom:7px;}
  .day-h .hrs{font-family:var(--mono); color:var(--done);}
  .punch{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:var(--ink-2);}
  .punch .meta{font-size:11px; color:var(--faint);}
  .flag{display:inline-block; background:var(--waiting-bg); color:var(--waiting);
    border-radius:7px; padding:2px 8px; font-size:11px; font-weight:800; margin-inline-start:6px;}
  .empty{text-align:center; color:var(--muted); padding:40px 16px; font-size:14px; line-height:2;}
  .btn{border:none; border-radius:11px; padding:11px 15px; font-family:inherit;
    font-size:14px; font-weight:800; cursor:pointer; background:var(--blue); color:#fff;}

  /* ===== كارت الموظف ===== */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px;
    overflow:hidden; transition:transform .12s, box-shadow .12s;}
  .card:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(16,16,20,.10);}
  .card-top{display:flex; align-items:center; gap:11px; padding:14px 15px 12px;
    border-bottom:1px solid var(--border);}
  .avatar{flex:none; width:42px; height:42px; border-radius:13px; display:flex;
    align-items:center; justify-content:center; font-family:'Cairo',sans-serif;
    font-weight:900; font-size:16px; color:#fff;}
  .card-id{flex:1; min-width:0;}
  .card-id b{display:block; font-size:15px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;}
  .card-id span{font-size:11.5px; color:var(--muted);}
  .card-stats{display:grid; grid-template-columns:repeat(3,1fr); text-align:center;
    padding:12px 8px; gap:4px;}
  .card-stats div b{display:block; font-family:'Cairo',sans-serif; font-weight:900; font-size:17px;}
  .card-stats div span{font-size:11px; color:var(--muted);}
  .card-bar{height:6px; background:var(--surface-2); display:flex;}
  .card-bar i{display:block; height:100%;}
  .card-foot{display:flex; gap:8px; padding:10px 12px 13px;}
  .card-foot button{flex:1; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink-2); border-radius:10px; padding:9px; font-family:inherit;
    font-size:12.5px; font-weight:800; cursor:pointer;}
  .card-foot button:hover{background:var(--surface);}

  /* ===== قايمة الثلاث نقط ===== */
  .menu-wrap{position:relative;}
  .menu-drop{position:absolute; inset-inline-end:0; top:46px; z-index:40; min-width:220px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 14px 36px rgba(0,0,0,.22); padding:6px; display:none;}
  .menu-drop.open{display:block;}
  .menu-drop button{display:block; width:100%; text-align:right; border:none;
    background:none; color:var(--ink); font-family:inherit; font-size:14px;
    padding:12px 13px; border-radius:10px; cursor:pointer;}
  .menu-drop button:hover{background:var(--surface-2);}
  .menu-drop hr{border:none; border-top:1px solid var(--border); margin:5px 8px;}

  /* ===== الشاشات المنبثقة ===== */
  .sheet{position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto; display:none;}
  .sheet.open{display:block;}
  .sheet-head{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:10px;
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;}
  .sheet-head h2{flex:1; min-width:0; margin:0; font-family:'Cairo',sans-serif; font-size:17px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet-body{padding:16px 16px 60px;}

  .fld{display:block; margin-bottom:14px;}
  .fld > span{display:block; font-size:13px; font-weight:800; margin-bottom:6px;}
  .fld > small{display:block; font-size:11.5px; color:var(--muted); line-height:1.8; margin-bottom:6px;}
  .fld input, .fld select, .fld textarea{width:100%; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); border-radius:11px; padding:12px;
    font-family:inherit; font-size:15px;}
  .days{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .days button{border:1px solid var(--border); background:var(--surface); color:var(--ink-2);
    border-radius:10px; padding:10px 4px; font-family:inherit; font-size:12.5px;
    font-weight:800; cursor:pointer;}
  .days button.on{background:var(--red); border-color:var(--red); color:#fff;}
  .save{width:100%; border:none; border-radius:13px; padding:15px; background:var(--done);
    color:#fff; font-family:inherit; font-size:15px; font-weight:900; cursor:pointer;}
  .emp-top{display:flex; align-items:center; gap:12px;}
  .emp-acts{display:flex; gap:8px;}
  .emp-acts button{flex:1; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink-2); border-radius:11px; padding:11px 6px; font-family:inherit;
    font-size:12.5px; font-weight:800; cursor:pointer;}
  .emp-acts button:hover{background:var(--surface);}
  /* زراير صغيرة جوه سطور السجل */
  .mini-btn{flex:none; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink-2); border-radius:8px; padding:5px 10px; font-family:inherit;
    font-size:11.5px; font-weight:800; cursor:pointer;}
  .mini-btn.danger{border-color:var(--red); color:var(--red);}
  .punch .meta.manual{color:var(--blue); font-weight:800;}
  .punch .mini-btn{padding:3px 7px; font-size:11px; margin-inline-start:5px;}
  .ded-row.waived{opacity:.85; border-color:var(--done);}
  /* أيام المواعيد الخاصة */
  .dsch-days button.edit{outline:2px solid var(--blue); outline-offset:-2px;}
  .dsch-days button.on{background:var(--blue); border-color:var(--blue); color:#fff;}
  .dsch-form{margin-top:14px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:13px; padding:14px;}
  /* شريط تاريخ بداية الخصم */
  .pen-start{background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:13px 14px; margin-top:14px;}
  .pen-start.warn{border-color:var(--red); background:var(--rejected-bg,#FEF2F2);}
  html[data-theme="dark"] .pen-start.warn{background:rgba(240,85,74,.10);}
  .pen-start-h{display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; font-size:13.5px; margin-bottom:5px;}
  .pen-start-h span{font-weight:800; color:var(--done);}
  .pen-start-h span.bad{color:var(--red);}
  .pen-start small{display:block; font-size:12px; line-height:1.9; color:var(--muted);}
  .pen-start.warn small{color:var(--red);}
  .pen-start-row{display:flex; gap:8px; margin-top:10px;}
  .pen-start-row input{flex:1; min-width:0; border:1px solid var(--border);
    background:var(--surface-2); color:var(--ink); border-radius:10px;
    padding:10px 11px; font-family:inherit; font-size:14.5px;}
  .pen-start-row button{flex:none; border:none; border-radius:10px; padding:10px 14px;
    background:var(--done); color:#fff; font-family:inherit; font-size:13.5px;
    font-weight:800; cursor:pointer;}
  /* ===== كروت صفحة المخصومات والمرتبات ===== */
  .pr-card{background:var(--surface); border:1px solid var(--border);
    border-radius:15px; padding:13px 14px; margin-bottom:11px;}
  .pr-card.alert{border-color:var(--red);}
  .pr-top{display:flex; align-items:center; gap:11px;}
  .pr-top .card-id b{font-size:15px;}
  .pr-top .card-id span{font-size:11px; color:var(--muted); direction:ltr; display:block;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pr-sal{display:flex; align-items:center; gap:7px; margin-top:11px;}
  .pr-sal label{flex:none; font-size:12.5px; font-weight:800; color:var(--ink-2);}
  .pr-sal input{flex:1; min-width:0; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink); border-radius:10px; padding:10px 11px; font-family:inherit;
    font-size:15px; font-weight:800; text-align:center;}
  .pr-sal button{flex:none; border:none; border-radius:10px; padding:10px 13px;
    background:var(--done); color:#fff; font-family:inherit; font-size:14px;
    font-weight:800; cursor:pointer;}
  .pr-sal button:disabled{opacity:.5; cursor:default;}
  .pr-nums{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;
    padding-top:10px; border-top:1px solid var(--border);}
  .pr-nums div{text-align:center;}
  .pr-nums b{display:block; font-family:'Cairo',sans-serif; font-weight:900; font-size:17px;}
  .pr-nums span{font-size:11px; color:var(--muted);}
  .pr-ded-btn{width:100%; margin-top:10px; border:none; border-radius:11px; padding:11px;
    background:var(--red); color:#fff; font-family:inherit; font-size:13.5px;
    font-weight:800; cursor:pointer;}
  .pr-bell{margin-top:9px; font-size:11.5px; font-weight:800; color:var(--red);}
  .pr-slip-btn{flex:1; border:1px solid var(--border); border-radius:11px; padding:11px;
    background:var(--surface-2); color:var(--ink); font-family:inherit;
    font-size:13.5px; font-weight:800; cursor:pointer;}
  /* كروت كشف الراتب */
  .slip{background:var(--surface); border:1px solid var(--border); border-radius:15px;
    padding:14px; margin-bottom:11px;}
  .slip.paid{border-color:var(--done);}
  .slip.due{border-color:var(--waiting);}
  .slip-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .slip-h b{font-size:15px;}
  .slip-tag{font-size:11px; font-weight:800; border-radius:7px; padding:3px 9px;}
  .slip-tag.ok{background:var(--done-bg); color:var(--done);}
  .slip-tag.wait{background:var(--waiting-bg); color:var(--waiting);}
  .slip-lines{margin-top:11px; padding-top:10px; border-top:1px solid var(--border);}
  .slip-lines div{display:flex; justify-content:space-between; align-items:baseline;
    gap:10px; padding:4px 0; font-size:13px; color:var(--muted);}
  .slip-lines b{font-family:'Cairo',sans-serif; font-weight:900; font-size:15px;
    color:var(--ink);}
  .slip-lines b.minus{color:var(--red);}
  .slip-lines .eq{margin-top:5px; padding-top:8px; border-top:1px solid var(--border);
    color:var(--ink);}
  .slip-lines .eq b{color:var(--done); font-size:18px;}
  .slip-btn{width:100%; margin-top:11px; border:none; border-radius:11px; padding:12px;
    font-family:inherit; font-size:14px; font-weight:800; cursor:pointer;
    background:var(--done); color:#fff;}
  .slip-btn.undo{background:var(--surface-2); color:var(--muted);
    border:1px solid var(--border); font-size:12.5px; padding:9px;}
  .slip-meta{margin-top:8px; font-size:11px; color:var(--muted); line-height:1.8;}
  .card-ded{background:var(--rejected-bg,#FEF2F2); color:var(--red); font-size:12px;
    font-weight:800; padding:8px 13px; border-top:1px solid var(--border);}
  html[data-theme="dark"] .card-ded{background:rgba(240,85,74,.13);}
  .card-ded i{font-style:normal; opacity:.85;}
  /* قايمة الخصومات جوه سجل الموظف */
  .ded-row{display:flex; align-items:flex-start; gap:10px; background:var(--surface);
    border:1px solid var(--border); border-radius:12px; padding:11px 13px; margin-bottom:8px;}
  .ded-row.unseen{border-color:var(--red);}
  .ded-amt{flex:none; font-family:'Cairo',sans-serif; font-weight:900; font-size:17px;
    color:var(--red);}
  .ded-mid{flex:1; min-width:0;}
  .ded-mid b{display:block; font-size:13.5px; line-height:1.8; word-break:break-word;}
  .ded-mid span{font-size:11px; color:var(--muted);}
  .ded-del{flex:none; border:none; background:none; color:var(--muted);
    font-size:17px; cursor:pointer; padding:2px 4px;}
  .hintbox{background:var(--waiting-bg); color:var(--waiting); border-radius:11px;
    padding:12px 14px; font-size:12.5px; line-height:1.9; margin-bottom:16px;}
</style>
</head>
<body>

<div class="topbar">
  <div style="flex:1; min-width:0;">
    <h1>👥 شؤون العاملين</h1>
    <div class="who" id="whoLbl">—</div>
  </div>
  <button class="icon-btn att-menu-btn" style="display:none;" title="المواعيد" onclick="openAttendance()">⏰</button>
  <div class="menu-wrap">
    <button class="icon-btn" title="القايمة" onclick="toggleMenu(event)">⋮</button>
    <div class="menu-drop" id="menuDrop">
      <button onclick="closeMenu(); openPayrollAdmin()">💰 المخصومات والمرتبات</button>
      <button onclick="closeMenu(); openHrSettings()">⏰ إعدادات المواعيد</button>
      <button onclick="closeMenu(); openGeneral()">⚙️ الإعدادات العامة</button>
      <hr>
      <button onclick="closeMenu(); loadMonth()">↻ تحديث</button>
      <button onclick="closeMenu(); doLogout()" style="color:var(--red);">⏻ تسجيل الخروج</button>
    </div>
  </div>
</div>

<!-- ===== إعدادات المواعيد (لكل موظف) ===== -->
<div class="sheet" id="hrSet">
  <div class="sheet-head">
    <h2>⏰ إعدادات المواعيد</h2>
    <button class="icon-btn" style="background:var(--surface-2); color:var(--ink);"
            onclick="closeSheet('hrSet')">×</button>
  </div>
  <div class="sheet-body" id="hrSetBody"></div>
</div>

<!-- ===== سجل الموظف — شاشة كاملة ===== -->
<div class="sheet" id="empSheet">
  <div class="sheet-head">
    <h2 id="empSheetTitle">📋 السجل</h2>
    <button class="icon-btn" style="background:var(--surface-2); color:var(--ink);"
            onclick="closeEmpLog()">×</button>
  </div>
  <div class="sheet-body" id="empSheetBody"></div>
</div>

<!-- ===== 🧾 كشوف الرواتب =====
     z-index:62 — فوق صفحة المرتبات (55) وتحت التسجيل اليدوي (65) -->
<div class="sheet" id="slipSheet" style="z-index:62;">
  <div class="sheet-head">
    <h2 id="slipTitle">🧾 كشوف الرواتب</h2>
    <button class="icon-btn" style="background:var(--surface-2); color:var(--ink);"
            onclick="closeSheet('slipSheet')">×</button>
  </div>
  <div class="sheet-body" id="slipBody"></div>
</div>

<!-- ===== ✍️ تسجيل يدوي (إضافة / تعديل) =====
     ⚠️ z-index:65 — أعلى من كل الشاشات، لأنها بتفتح **من جوه**
        شاشة سجل الموظف (60). -->
<div class="sheet" id="punchSheet" style="z-index:65;">
  <div class="sheet-head">
    <h2 id="punchTitle">✍️ تسجيل يدوي</h2>
    <button class="icon-btn" style="background:var(--surface-2); color:var(--ink);"
            onclick="closeSheet('punchSheet')">×</button>
  </div>
  <div class="sheet-body" id="punchBody"></div>
</div>

<!-- ===== 💰 المخصومات والمرتبات =====
     ⚠️ z-index:55 عن قصد — أقل من dedSheet (60) عشان شاشة الخصم
        تفتح فوقها مش تحتها. -->
<div class="sheet" id="paySheet" style="z-index:55;">
  <!-- ⚠️ خانة البحث **جوه** الهيدر اللي sticky، على سطر تاني
       (flex-basis:100%). لو حطيناها تحته كانت هتروح مع السكرول
       وإنت بتدوّر على موظف في نص قايمة طويلة. -->
  <div class="sheet-head" style="flex-wrap:wrap;">
    <h2>💰 المخصومات والمرتبات</h2>
    <button class="icon-btn" style="background:var(--surface-2); color:var(--ink);"
            onclick="closeSheet('paySheet')">×</button>
    <input type="search" id="paySearch" placeholder="🔍 ابحث باسم الموظف أو إيميله…"
           oninput="PAY_Q=this.value; renderPayrollAdmin()"
           style="flex-basis:100%; border:1px solid var(--border);
                  background:var(--surface-2); color:var(--ink); border-radius:11px;
                  padding:11px 13px; font-family:inherit; font-size:15px;">
  </div>
  <div class="sheet-body" id="payBody"></div>
</div>

<!-- ===== 💸 خصم جديد ===== -->
<div class="sheet" id="dedSheet">
  <div class="sheet-head">
    <h2 id="dedTitle">💸 خصم جديد</h2>
    <button class="icon-btn" style="background:var(--surface-2); color:var(--ink);"
            onclick="closeSheet('dedSheet')">×</button>
  </div>
  <div class="sheet-body" id="dedBody"></div>
</div>

<!-- شاشة المواعيد — بتتبني بالكامل من attendance.js -->
<div id="attOverlay" class="hidden"></div>

<script>
// ============================================================
// I Fix Team — شؤون العاملين (hr.html)
// ------------------------------------------------------------
// بتوري سجل مواعيد كل الموظفين بالشهر: حضور · انصراف · بريك ·
// وساعات الشغل الصافية.
//
// 🔴 الحماية الحقيقية في قاعدة البيانات مش هنا.
//    سياسة attendance_read بتقول: كل واحد سجله هو، إلا لو دوره
//    hr أو super_admin. فحتى لو حد فتح الصفحة دي بالعافية،
//    مش هيشوف غير سجله هو. الفحص اللي تحت للتوجيه بس.
//
// ⚠️ حساب الأوفر تايم والتأخير والخصومات **لسه ماتعملش**.
//    الصفحة دي بتوري الساعات الخام. القواعد جاية في خطوة تانية.
// ============================================================

let ME = '', MY_ROLE = '', ROLES_MAP = {};
let MONTH = (() => { const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); })();
let ROWS = [], OPEN_EMP = null, SEARCH = '';

const KIND = {
  in:     { t:'حضور',   icon:'🟢' },
  out:    { t:'انصراف', icon:'🔴' },
  break:  { t:'بريك',   icon:'☕' },
  resume: { t:'استئناف', icon:'▶️' }
};

// ===== الدخول =====
(async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href = 'index.html'; return; }
  ME = (session.user.email || '').toLowerCase();

  // خريطة الأدوار — عشان نعرض الأسماء والصلاحيات
  try{
    const { data } = await sb.from('app_data').select('value').eq('key','user-roles').maybeSingle();
    if(data && data.value) ROLES_MAP = JSON.parse(data.value) || {};
  }catch(e){ console.error('user-roles failed:', e); }

  const mine = ROLES_MAP[ME];
  MY_ROLE = typeof mine === 'string' ? mine : (mine && mine.role) || '';
  document.getElementById('whoLbl').textContent =
    ME + (MY_ROLE ? ' — ' + roleLabel(MY_ROLE) : '');

  attSyncMenu();          // زرار المواعيد على الموبايل بس
  await loadMonth();
})();

function roleLabel(r){
  return { super_admin:'أدمن', accountant:'محاسب', dispatcher:'مسؤول حركة',
           technician:'فني', hr:'شؤون العاملين', staff:'موظف' }[r] || r;
}
function nameOf(email){
  const v = ROLES_MAP[email];
  const n = (v && typeof v === 'object' && v.techName) ? v.techName : '';
  return n || (email || '').split('@')[0];
}
async function doLogout(){
  try{ await sb.auth.signOut(); }catch(e){}
  location.href = 'index.html';
}

// ===== التحميل =====
async function loadMonth(){
  const root = document.getElementById('root');
  root.innerHTML = '<div class="empty">جاري التحميل…</div>';
  const [y,m] = MONTH.split('-').map(Number);
  const from = `${y}-${String(m).padStart(2,'0')}-01`;
  // اليوم صفر من الشهر اللي بعده = آخر يوم في الشهر ده
  const to = new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10);
  try{
    const { data, error } = await sb.from('attendance')
      // ⚠️ id لازم يكون هنا — من غيره مفيش تعديل ولا مسح.
      //    و manual_by هو ختم «اتكتب بإيد HR».
      .select('id,user_email,user_name,kind,at,work_date,distance_m,verified,manual_by,manual_note')
      .gte('work_date', from).lte('work_date', to)
      .order('at', { ascending:true });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;
    ROWS = data || [];
    await loadEmpSettings();   // القواعد لازم تكون موجودة قبل الرسم
    await loadPenaltyStart();       // الحاجز لازم يتقرا قبل العرض
    await loadPenalties(from, to);  // 🔴 خصم التأخير — من السيرفر
    await loadOvertime(from, to);   // 🔴 والأوفر تايم كمان
    await loadDeductions();    // والخصومات اليدوية كمان
    render();
  }catch(e){
    console.error('loadMonth failed:', e);
    root.innerHTML = '<div class="empty">❌ مقدرناش نحمّل السجل<br><small>' +
      esc(e.message || e) + '</small></div>';
  }
}

// ============================================================
// حساب ساعات اليوم
// ------------------------------------------------------------
// بنمشي على تسجيلات اليوم بالترتيب:
//   حضور/استئناف → بنفتح عدّاد
//   بريك/انصراف  → بنقفله ونضيف الفرق
// الوقت اللي جوه البريك مش بيتحسب — العدّاد بيبقى مقفول.
//
// ⚠️ لو الموظف نسي ينصرف، آخر فترة بتفضل مفتوحة ومش بتتحسب،
//    وبنعلّم اليوم بعلامة "ناقص انصراف" عشان HR تشوفه وتصلّحه.
//    الأأمن إننا نقول "مش عارفين" بدل ما نخمّن ساعة وننسبها له.
// ============================================================
function dayMinutes(punches){
  let total = 0, openAt = null, missingOut = false;
  for(const p of punches){
    const t = new Date(p.at).getTime();
    if(p.kind === 'in' || p.kind === 'resume'){
      if(openAt === null) openAt = t;
    }else if(p.kind === 'break' || p.kind === 'out'){
      if(openAt !== null){ total += (t - openAt); openAt = null; }
    }
  }
  // ⚠️ العلامة على **آخر تسجيل** مش على العدّاد.
  //    الاختبار كشف إن اللي بيروح بريك وميرجعش خالص كان بيعدّي
  //    نضيف: البريك قفل العدّاد فالعدّاد مش مفتوح — بس الراجل
  //    برضه ما سجّلش انصراف. أي يوم آخره مش 'out' ناقص.
  const last = punches.length ? punches[punches.length - 1].kind : null;
  missingOut = (last !== 'out');
  return { minutes: Math.round(total / 60000), missingOut };
}
function fmtHm(mins){
  if(!mins) return '0:00';
  return Math.floor(mins/60) + ':' + String(mins % 60).padStart(2,'0');
}
function fmtTime(iso){
  return new Date(iso).toLocaleTimeString('ar-EG',
    { hour:'2-digit', minute:'2-digit', timeZone:'Africa/Cairo' });
}

// ===== العرض =====
function render(){
  const root = document.getElementById('root');

  // تجميع: موظف → يوم → تسجيلات
  const emps = {};
  for(const r of ROWS){
    const e = (r.user_email || '').toLowerCase();
    (emps[e] = emps[e] || {})[r.work_date] = (emps[e][r.work_date] || []);
    emps[e][r.work_date].push(r);
  }

  let keys = Object.keys(emps).sort((a,b) => nameOf(a).localeCompare(nameOf(b),'ar'));
  if(SEARCH){
    const q = SEARCH.toLowerCase();
    keys = keys.filter(k => k.includes(q) || nameOf(k).toLowerCase().includes(q));
  }

  // مؤشرات فوق
  let totalMin = 0, totalDays = 0, flagged = 0;
  for(const e of Object.keys(emps)){
    for(const d of Object.keys(emps[e])){
      const s = dayMinutes(emps[e][d]);
      totalMin += s.minutes; totalDays++;
      if(s.missingOut) flagged++;
    }
  }

  const bar = `
    <div class="bar">
      <input type="month" value="${MONTH}" onchange="MONTH=this.value; loadMonth()">
      <input type="search" placeholder="ابحث باسم الموظف…" value="${esc(SEARCH)}"
             oninput="SEARCH=this.value; render()">
    </div>
    <div class="kpis">
      <div class="kpi"><div class="v">${Object.keys(emps).length}</div><div class="l">موظف</div></div>
      <div class="kpi"><div class="v">${totalDays}</div><div class="l">يوم حضور</div></div>
      <div class="kpi"><div class="v">${fmtHm(totalMin)}</div><div class="l">إجمالي الساعات</div></div>
      <div class="kpi"><div class="v" style="color:var(--waiting)">${flagged}</div><div class="l">يوم ناقص انصراف</div></div>
    </div>`;

  if(!keys.length){
    root.innerHTML = bar + '<div class="empty">مفيش تسجيلات في الشهر ده' +
      (ROWS.length ? '' : '<br><small>لو إنت مش HR ولا أدمن، مش هتشوف غير سجلك إنت</small>') +
      '</div>';
    return;
  }

  root.innerHTML = bar + '<div class="cards">' +
    keys.map(e => cardHtml(e, emps[e])).join('') + '</div>';
  // ⚠️ السجل بقى شاشة كاملة (empSheet) مش قسم بيتفتح تحت الكارت.
  //    لو كان مفتوح وحصل تحديث، بنعيد رسمه بالبيانات الجديدة.
  if(OPEN_EMP && emps[OPEN_EMP]) renderEmpSheet(OPEN_EMP, emps[OPEN_EMP]);
}

// تجميع أيام موظف واحد — بيتستخدم في الكروت وفي الشاشة
function daysOf(email){
  const days = {};
  ROWS.filter(r => (r.user_email||'').toLowerCase() === email)
      .forEach(r => { (days[r.work_date] = days[r.work_date] || []).push(r); });
  return days;
}

// لون ثابت لكل موظف من اسمه — عشان يعرفه بالشكل بسرعة،
// ونفس اللون يفضل معاه كل شهر
function avatarColor(e){
  let h = 0;
  for(let i=0;i<e.length;i++) h = (h*31 + e.charCodeAt(i)) % 360;
  return `hsl(${h} 55% 42%)`;
}

function cardHtml(e, days){
  let mins = 0, flags = 0, penalty = 0, late = 0, over = 0, short = 0;
  const dkeys = Object.keys(days);
  dkeys.forEach(d => {
    const st = dayMinutes(days[d]);
    mins += st.minutes;
    if(st.missingOut) flags++;
    const r = applyRules(e, days[d], d);
    if(r){ penalty += r.penalty; if(r.state === 'late') late++; }
    const o = dayOvertime(e, days[d], d);
    // ⚠️ اليوم اللي ناقصه انصراف ساعاته مش موثوقة، فمش بنحسبه
    //    لا أوفر تايم ولا نقص — وإلا هنطلع أرقام متخيّلة.
    if(o.has && !st.missingOut){ over += o.over; short += o.short; }
  });
  const c = EMP_SET[e] || {};
  // الشريط الملوّن: أيام سليمة / متأخرة / ناقصة — قراءة بنظرة
  const good = Math.max(0, dkeys.length - late - flags);
  const pct  = n => dkeys.length ? (n / dkeys.length * 100) : 0;
  return `
  <div class="card">
    <div class="card-top">
      <div class="avatar" style="background:${avatarColor(e)}">${esc(nameOf(e).charAt(0))}</div>
      <div class="card-id">
        <b>${esc(nameOf(e))}</b>
        <span>${c.shift_start ? '🕙 ' + String(c.shift_start).slice(0,5) : '⚠️ مفيش ميعاد محدد'}</span>
      </div>
    </div>
    <div class="card-bar">
      <i style="width:${pct(good)}%;background:var(--done)"></i>
      <i style="width:${pct(late)}%;background:var(--red)"></i>
      <i style="width:${pct(flags)}%;background:var(--waiting)"></i>
    </div>
    <div class="card-stats">
      <div><b>${dkeys.length}</b><span>يوم</span></div>
      <div><b>${fmtHm(mins)}</b><span>ساعات</span></div>
      <div><b style="color:${over ? 'var(--done)' : 'inherit'}">${fmtHm(over)}</b><span>أوفر تايم</span></div>
    </div>
    <div class="card-stats" style="padding-top:0;">
      <div><b style="color:${short ? 'var(--waiting)' : 'inherit'}">${fmtHm(short)}</b><span>نقص</span></div>
      <div><b style="color:${late ? 'var(--red)' : 'inherit'}">${late}</b><span>تأخير</span></div>
      <div><b style="color:${penalty ? 'var(--red)' : 'inherit'}">${penalty || 0}</b><span>خصم تلقائي</span></div>
    </div>
    ${(() => {
      // شريط الخصم اليدوي — بيظهر لو فيه خصم بس، عشان الكارت
      // ما يتزحمش على الموظفين اللي مالهمش خصومات
      const m = manualDed(e);
      if(!m.total) return '';
      return `<div class="card-ded">💸 خصم يدوي: <b>${m.total}</b> ج.م${
        m.unseen ? ` · <i>${m.unseen} لسه ما اتقراش</i>` : ''}</div>`;
    })()}
    <div class="card-foot">
      <button onclick="openEmpLog('${esc(e)}')">📋 السجل</button>
      <button onclick="openDeduction('${esc(e)}')" title="خصم">💸</button>
      <button onclick="openHrSettings('${esc(e)}')">⏰</button>
      <button onclick="exportEmpPdf('${esc(e)}')">📄</button>
      <button onclick="exportEmpExcel('${esc(e)}')">📊</button>
    </div>
  </div>`;
}

// ============================================================
// سجل الموظف — شاشة كاملة
// ------------------------------------------------------------
// كان قسم بيتفتح تحت الكارت، فالمستخدم كان لازم يعدّي على كل
// الكروت عشان يوصله، والملخص كان بيفضل فوق برّه الشاشة.
// دلوقتي شاشة مستقلة: الملخص فوق ثابت، وتحته كل الأيام.
// ============================================================
function openEmpLog(email){
  OPEN_EMP = email;
  renderEmpSheet(email, daysOf(email));
  openSheet('empSheet');
}
function closeEmpLog(){ OPEN_EMP = null; closeSheet('empSheet'); }

function renderEmpSheet(email, days){
  const box = document.getElementById('empSheetBody');
  const ttl = document.getElementById('empSheetTitle');
  if(!box) return;
  if(ttl) ttl.textContent = '📋 سجل ' + nameOf(email);

  const dkeys = Object.keys(days).sort().reverse();
  let mins=0, over=0, short=0, pen=0, late=0, flags=0;
  dkeys.forEach(d => {
    const st = dayMinutes(days[d]);
    mins += st.minutes;
    if(st.missingOut) flags++;
    const r = applyRules(email, days[d], d);
    if(r){ pen += r.penalty; if(r.state === 'late') late++; }
    const o = dayOvertime(email, days[d], d);
    if(o.has && !st.missingOut){ over += o.over; short += o.short; }
  });

  const c = EMP_SET[email] || {};
  box.innerHTML = `
    <div class="emp-top">
      <div class="avatar" style="background:${avatarColor(email)}">${esc(nameOf(email).charAt(0))}</div>
      <div style="flex:1;min-width:0;">
        <b style="display:block;font-size:17px;">${esc(nameOf(email))}</b>
        <span style="font-size:12px;color:var(--muted);">
          ${esc(monthLabel())}${c.shift_start ? ' · 🕙 ' + String(c.shift_start).slice(0,5) : ''}</span>
      </div>
    </div>

    <div class="kpis" style="margin:14px 0 16px;">
      <div class="kpi"><div class="v">${dkeys.length}</div><div class="l">يوم</div></div>
      <div class="kpi"><div class="v">${fmtHm(mins)}</div><div class="l">ساعات</div></div>
      <div class="kpi"><div class="v" style="color:${over?'var(--done)':'inherit'}">${fmtHm(over)}</div><div class="l">أوفر تايم</div></div>
      <div class="kpi"><div class="v" style="color:${short?'var(--waiting)':'inherit'}">${fmtHm(short)}</div><div class="l">نقص</div></div>
      <div class="kpi"><div class="v" style="color:${late?'var(--red)':'inherit'}">${late}</div><div class="l">تأخير</div></div>
      <div class="kpi"><div class="v" style="color:${pen?'var(--red)':'inherit'}">${pen||0}</div><div class="l">خصم ج.م</div></div>
    </div>

    <div class="emp-acts">
      <button onclick="openDeduction('${esc(email)}')" style="background:var(--red);color:#fff;border-color:var(--red);">💸 خصم</button>
      <button onclick="openPunch('${esc(email)}')">✍️ تسجيل يدوي</button>
      <button onclick="openHrSettings('${esc(email)}')">⏰ المواعيد</button>
      <button onclick="exportEmpPdf('${esc(email)}')">📄 PDF</button>
      <button onclick="exportEmpExcel('${esc(email)}')">📊 Excel</button>
    </div>

    ${dedSectionHtml(email)}

    ${flags ? `<div class="hintbox" style="margin-top:14px;">⚠️ فيه ${flags} يوم ناقص انصراف —
      ساعاتهم مش محسوبة في الإجمالي.</div>` : ''}
    ${(() => {
      // ⚠️ التسجيلات من غير بصمة: يا إما جهاز الموظف مالوش بصمة
      //    أصلاً، يا إما البصمة بايظة. المهم إن HR تشوف العدد —
      //    لو موظف كل تسجيلاته من غير بصمة، ده يستاهل سؤال.
      const nb = dkeys.reduce((n,d) => n + days[d].filter(r => !r.verified).length, 0);
      const all = dkeys.reduce((n,d) => n + days[d].length, 0);
      if(!nb) return '';
      return `<div class="hintbox" style="margin-top:10px;">🔓 ${nb} من ${all} تسجيل
        اتعمل <b>من غير بصمة</b> — جهازه غالباً مالوش بصمة أو بايظة.
        (اللوكيشن اتفحص في كل الحالات.)</div>`;
    })()}

    <div style="margin-top:14px;">
      ${dkeys.length
        ? dkeys.map(d => dayHtml(d, days[d], email)).join('')
        : '<div class="empty">مفيش تسجيلات في الشهر ده</div>'}
    </div>`;
}

// سبب الخصم بالكلام — الموظف والـHR لازم يعرفوا الفلوس راحت ليه
function penaltyWhy(r){
  const bits = [];
  if(r.latePen)  bits.push(`تأخير ${r.latePen} ج.م`);
  if(r.breakPen) bits.push(`تعدّي البريك ${r.breakPen} ج.م (بريك ${fmtDur(r.breakMin)} والمسموح ${fmtDur(r.breakLimit)})`);
  return bits.length ? 'خصم تلقائي: ' + bits.join(' + ') : 'الخصم ده تلقائي حسب المواعيد';
}

function dayHtml(d, punches, email){
  const s = dayMinutes(punches);
  const r = email ? applyRules(email, punches, d) : null;
  // سطر القواعد: بيوري الحضور الفعلي والمحتسب والمفروض ينصرف
  const rules = !r ? '' : `
    <div class="punch" style="border-bottom:1px solid var(--border); padding-bottom:7px; margin-bottom:5px;">
      <span style="color:${STATE_LBL[r.state].c}; font-weight:800;">${STATE_LBL[r.state].t}
        ${r.penalty ? `<span class="flag" style="background:var(--rejected-bg,#FEF2F2);color:var(--red)">خصم ${r.penalty} ج.م</span>` : ''}
        ${r.breakPen ? `<span class="flag" style="background:var(--rejected-bg,#FEF2F2);color:var(--red)">☕ زوّد البريك ${fmtDur(r.breakOver)}</span>` : ''}
        ${(!r.breakPen && r.breakOver && r.breakLimit) ? `<span class="flag">☕ زوّد ${fmtDur(r.breakOver)}</span>` : ''}
        ${r.breakOpen ? `<span class="flag">☕ بريك مفتوح</span>` : ''}
        ${r.waived ? `<span class="flag" style="background:var(--done-bg);color:var(--done)">✋ الخصم اتشال</span>` : ''}</span>
      <span class="meta">ميعاده ${fmtMinTime(r.shift)} · حضر ${fmtMinTime(r.arrived)}${
        r.lateBy ? ' (متأخر ' + fmtDur(r.lateBy) + ')' : ''} · يتحسب ${fmtMinTime(r.counted)} · ينصرف ${fmtMinTime(r.leaveAt)}${
        r.breakMin ? ' · ☕ بريك ' + fmtDur(r.breakMin) + (r.breakLimit ? ' من ' + fmtDur(r.breakLimit) : '') : ''}</span>
    </div>
    ${r.beforeStart ? `
      <div class="punch" style="padding-bottom:7px;">
        <span class="meta" style="flex:1;">🛡️ اليوم ده قبل بداية تطبيق الخصم — متأخر بس من غير فلوس</span>
      </div>` :
      (r.waived ? `
      <div class="punch" style="padding-bottom:7px;">
        <span class="meta" style="flex:1;">سبب الشيل: ${esc(r.waiveReason || '—')}</span>
        <button class="mini-btn" onclick="unwaivePenalty('${esc(email)}','${esc(d)}')">↩️ رجّع الخصم</button>
      </div>` :
      (r.penalty ? `
      <div class="punch" style="padding-bottom:7px;">
        <span class="meta" style="flex:1;">${penaltyWhy(r)}</span>
        <button class="mini-btn danger" onclick="waivePenalty('${esc(email)}','${esc(d)}')">✋ شيل الخصم</button>
      </div>` : ''))}`;
  return `
  <div class="day">
    <div class="day-h">
      <span>${new Date(d).toLocaleDateString('ar-EG',
        { weekday:'long', day:'numeric', month:'long' })}
        ${s.missingOut ? '<span class="flag">ناقص انصراف</span>' : ''}</span>
      <span class="hrs">${fmtHm(s.minutes)}${(() => {
        const o = email ? dayOvertime(email, punches, d) : null;
        if(!o || !o.has || s.missingOut) return '';
        if(o.over)  return ` <span style="color:var(--done)">+${fmtHm(o.over)}</span>`;
        if(o.short) return ` <span style="color:var(--waiting)">−${fmtHm(o.short)}</span>`;
        return '';
      })()}</span>
    </div>
    ${rules}
    ${punches.map(p => `
      <div class="punch">
        <span style="flex:1;min-width:0;">${KIND[p.kind].icon} ${KIND[p.kind].t}
          ${p.manual_by
            ? '<span class="meta manual">✍️ يدوي</span>'
            : (p.verified ? '' : '<span class="meta">(من غير بصمة)</span>')}</span>
        <span>${fmtTime(p.at)}
          <span class="meta">${p.distance_m != null ? Math.round(p.distance_m) + 'م' : ''}</span>
        </span>
        ${email && p.id ? `
          <button class="mini-btn" title="تعديل"
                  onclick="openPunch('${esc(email)}','${esc(d)}','${esc(p.id)}')">✏️</button>
          <button class="mini-btn danger" title="مسح"
                  onclick="deletePunch('${esc(p.id)}')">🗑️</button>` : ''}
      </div>`).join('')}
    ${email ? `<button class="mini-btn" style="width:100%;margin-top:8px;"
        onclick="openPunch('${esc(email)}','${esc(d)}')">➕ ضيف تسجيل لليوم ده</button>` : ''}
  </div>`;
}

//    مش هيظهر في القايمة — ومش هتقدر تحطله ميعاد أصلاً.
function allEmployees(){
  const out = [];
  for(const em of Object.keys(ROLES_MAP || {})){
    const v = ROLES_MAP[em];
    const r = typeof v === 'string' ? v : (v && v.role) || '';
    if(r === 'hr') continue;          // HR مش بتسجّل حضور موظفين
    out.push(em.toLowerCase());
  }
  // وأي حد في السجل ومش في الخريطة (حساب اتشال مثلاً)
  ROWS.forEach(r => {
    const e = (r.user_email||'').toLowerCase();
    if(e && out.indexOf(e) < 0) out.push(e);
  });
  return out.sort((a,b) => nameOf(a).localeCompare(nameOf(b),'ar'));
}

function toggleOff(i){
  const c = EMP_SET[SET_EMAIL] = EMP_SET[SET_EMAIL] || { user_email: SET_EMAIL };
  const off = Array.isArray(c.off_days) ? c.off_days.slice() : [];

  if(at >= 0) off.splice(at,1); else off.push(i);
  // ⚠️ بنحفظ اللي متكتب في الخانات قبل إعادة الرسم — من غير كده
  //    أي حاجة كتبتها وما حفظتهاش بتضيع أول ما تدوس على يوم.
  stashForm(c);
  c.off_days = off.sort();
  renderHrSettings();

function stashForm(c){

  if(g('fStart')   !== undefined) c.shift_start   = g('fStart')  || null;
  if(g('fGrace')   !== undefined) c.grace_minutes = parseInt(g('fGrace'),10) || 0;
  if(g('fHours')   !== undefined) c.work_hours    = parseFloat(g('fHours')) || 8;
  if(g('fBackup')  !== undefined) c.backup_start  = g('fBackup') || null;
  if(g('fPenalty') !== undefined) c.late_penalty  = parseFloat(g('fPenalty')) || 0;
  if(g('fBreak')      !== undefined) c.break_minutes       = parseInt(g('fBreak'),10) || 0;
  if(g('fBreakGrace') !== undefined) c.break_grace_minutes = parseInt(g('fBreakGrace'),10) || 0;
  if(g('fBreakPen')   !== undefined) c.break_penalty       = parseFloat(g('fBreakPen')) || 0;
  if(g('fNote')    !== undefined) c.note          = g('fNote') || null;
}

// ============================================================
// تطبيق قواعد الميعاد على يوم واحد
// ------------------------------------------------------------
// بترجّع: وقت الحضور الفعلي · المحتسب · المفروض ينصرف · الخصم
// ⚠️ لو الموظف مالوش إعدادات، بنرجّع null والعرض بيوري الساعات
//    الخام بس — **ما بنخترعش ميعاد افتراضي**، لأن ميعاد متخيّل
//    معناه خصم على حد ملوش ذنب.
// ============================================================
function hhmmOf(iso){
  // الساعة والدقيقة بتوقيت مصر — مش بتوقيت الجهاز اللي بيتفرّج
  const p = new Date(iso).toLocaleTimeString('en-GB',
    { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Africa/Cairo' });
  const [h,m] = p.split(':').map(Number);
  return h*60 + m;
}
function toMin(t){
  if(!t) return null;
  const [h,m] = String(t).slice(0,5).split(':').map(Number);
  return h*60 + m;
}
// مدة بالساعة والدقيقة
function fmtDur(mins){
  const m = Math.max(0, Math.round(Number(mins) || 0));
  const h = Math.floor(m / 60), r = m % 60;
  if(!h) return r + ' د';
  if(!r) return h + ' س';
  return h + ' س و ' + r + ' د';
}

function fmtMinTime(mins){
  mins = ((mins % 1440) + 1440) % 1440;
  return String(Math.floor(mins/60)).padStart(2,'0') + ':' + String(mins%60).padStart(2,'0');
}

// 🔴🔴 الدالة دي **مبقتش بتحسب حاجة** — بقت بتقرا من السيرفر.
// ------------------------------------------------------------
// كانت بتطبّق القواعد هنا في الجافاسكريبت. المشكلة ظهرت أول ما
// الموظف بقى يشوف خصمه في شاشة «مرتبك»: يا إما نكتب نفس الحساب
// تاني في payroll.js، يا إما نخلّي مصدر واحد.
//
// كتابة الحساب مرتين معناها إن أول تعديل على واحد فيهم من غير
// التاني = HR شايفة رقم والموظف شايف رقم تاني، ومحدش هياخد باله
// غير لما تحصل خناقة على المرتب.
//
// دلوقتي دالة hr_late_penalties في السيرفر هي المصدر الوحيد،
// والاتنين بيقروا منها. الدالة دي بقت **مترجم** بس.
//
// ⚠️ بترجّع null لو اليوم مش في رد السيرفر — وده بيحصل في حالتين
//    شرعيتين: الموظف مالوش ميعاد محدد، أو مسجّلش «حضور» في اليوم
//    ده أصلاً. العرض ساعتها بيوري الساعات الخام وبس.
function applyRules(email, punches, workDate){
  const byDay = PENS[(email || '').toLowerCase()];
  const row = byDay && workDate ? byDay[workDate] : null;
  if(!row) return null;
  const need = Number(row.need_min || 0);
  return {
    arrived: Number(row.arrived_min),
    // ⚠️ shift = ميعاده الحقيقي · counted = الوقت اللي بيتحسب منه
    //    شغله. الاتنين بيتساووا لو جه بدري أو جوه السماح، وبيختلفوا
    //    لو اتأخر. خلطهم كان بيطلع «حضرت ١٨ وميعادك ١٨» على يوم
    //    فيه خصم — كلام متناقض.
    shift:   Number(row.shift_min != null ? row.shift_min : row.counted_min),
    lateBy:  Number(row.late_min || 0),
    counted: Number(row.counted_min),
    leaveAt: Number(row.counted_min) + need,
    need,
    // السيرفر بيصفّر الخصم لوحده لو HR شالته — مش بنكرّر الفحص هنا
    // 🔴 penalty = المجموع (تأخير + بريك) — السيرفر بيجمعهم.
    //    التفصيل تحت عشان العرض يقول السبب الصح.
    penalty: Number(row.penalty || 0),
    latePen:   Number(row.late_penalty_amt  || 0),
    breakPen:  Number(row.break_penalty_amt || 0),
    breakMin:  Number(row.break_min || 0),
    breakLimit:Number(row.break_allow_min || 0),
    breakOver: Number(row.break_over_min || 0),
    breakOpen: !!row.break_open,
    state:   row.state,
    waived:  !!row.waived,
    waiveReason: row.waive_reason || '',
    beforeStart: !!row.before_start
  };
}

// ============================================================
// الأوفر تايم
// ------------------------------------------------------------
// بيبدأ بعد ما الموظف يخلّص عدد ساعاته ويفضل في الفرع.
//
// ⚠️ تفصيلة مهمة: الساعات بتتحسب من **الوقت المحتسب** مش من
//    وقت الحضور الفعلي. يعني اللي جه ١٠:٢٠ وسماحه لـ ١٠:٣٠،
//    الـ ٢٠ دقيقة دي بتتحسبله شغل — لأننا اتفقنا إنه "كأنه جه
//    الساعة ١٠". من غير السطر ده كان هيخسر الوقت ده من ساعاته
//    وممكن يطلع ناقص وهو ملوش ذنب.
//
//    والبريك مش داخل في الحساب أصلاً (dayMinutes بتقفل العدّاد
//    عنده)، فالأوفر تايم شغل حقيقي مش قعدة.
// ============================================================
// 🔴 زي applyRules — **مبقتش بتحسب**، بقت بتقرا من السيرفر.
// ------------------------------------------------------------
// الأوفر تايم بقى بيتحوّل لفلوس في كشف الراتب. فلو الحساب اتكتب
// هنا وكمان في السيرفر، أول تعديل على واحد فيهم من غير التاني
// معناه إن HR شايفة «٣ ساعات زيادة» والكشف بيحسب ساعتين — وده
// فرق فلوس مباشر.
//
// ⚠️ النقص بيرجع صفر لليوم اللي لسه ما اتقفلش بانصراف. من غير
//    الشرط ده، اليوم اللي الموظف شغال فيه دلوقتي كان هيبان عليه
//    عجز يوم كامل — وكل واحد يفتح الشاشة الصبح يلاقي «عجز ٨
//    ساعات» وهو لسه بادئ.
function dayOvertime(email, punches, workDate){
  const byDay = OVER[(email || '').toLowerCase()];
  const row = byDay && workDate ? byDay[workDate] : null;

  // السيرفر مبيرجّعش اليوم ده (مفيش ميعاد محدد، أو مفيش «حضور»)
  // → نوري ساعاته الخام من غير ما نخترع زيادة ولا نقص
  if(!row){
    const raw = dayMinutes(punches);
    return { worked: raw.minutes, over: 0, short: 0, need: 0, has: false };
  }

  return {
    worked: Number(row.worked_min || 0),
    over:   Number(row.over_min   || 0),
    short:  Number(row.short_min  || 0),
    need:   Number(row.need_min   || 0),
    closed: !!row.closed,
    has:    true
  };
}

// صفوف الكشف — مصدر واحد للاتنين، عشان الملفين ما يختلفوش
function empRows(email){
  const days = {};
  ROWS.filter(r => (r.user_email||'').toLowerCase() === email)
      .forEach(r => { (days[r.work_date] = days[r.work_date] || []).push(r); });

  const out = [];
  let tW=0, tO=0, tS=0, tP=0, flags=0;
  Object.keys(days).sort().forEach(d => {
    const p = days[d];
    const st = dayMinutes(p);
    const r  = applyRules(email, p, d);
    const o  = dayOvertime(email, p, d);
    const firstIn = p.find(x => x.kind === 'in');
    const lastOut = [...p].reverse().find(x => x.kind === 'out');
    if(st.missingOut) flags++;
    const counted = !st.missingOut && o.has;
    if(counted){ tW += o.worked; tO += o.over; tS += o.short; }
    if(r) tP += r.penalty;
    out.push({
      date: d,
      day:  new Date(d).toLocaleDateString('ar-EG', { weekday:'long' }),
      in:   firstIn ? fmtTime(firstIn.at) : '—',
      out:  lastOut ? fmtTime(lastOut.at) : '—',
      counted: r ? fmtMinTime(r.counted) : '—',
      due:  r ? fmtMinTime(r.leaveAt) : '—',
      worked: fmtHm(st.minutes),
      over:  counted && o.over  ? fmtHm(o.over)  : '',
      short: counted && o.short ? fmtHm(o.short) : '',
      pen:   r && r.penalty ? r.penalty : '',
      state: r ? STATE_LBL[r.state].t : '—',
      flag:  st.missingOut ? 'ناقص انصراف' : ''
    });
  });
  return { rows: out, tW, tO, tS, tP, flags, days: Object.keys(days).length };
}

const HR_COLS = ['التاريخ','اليوم','حضور','انصراف','محتسب','المفروض ينصرف',
                 'ساعات','أوفر تايم','نقص','خصم','الحالة','ملاحظة'];

function monthLabel(){
  const [y,m] = MONTH.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('ar-EG', { month:'long', year:'numeric' });
}

function hrPrint(html, title){
  const old = document.getElementById('hrPrintFrame');
  if(old) old.remove();
  const f = document.createElement('iframe');
  f.id = 'hrPrintFrame';
  f.title = title || 'print';
  f.setAttribute('aria-hidden','true');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;';
  document.body.appendChild(f);
  try{
    const d = f.contentWindow.document;
    d.open(); d.write(html); d.close();
    f.contentWindow.focus();
    f.contentWindow.print();     // فوراً — من غير أي انتظار
  }catch(e){
    console.error('hrPrint failed:', e);
    f.remove();
    alert('مقدرناش نفتح نافذة الطباعة. جرّب تاني.');
  }
}

// ===== Excel =====
async function exportEmpExcel(email){
  const R = empRows(email);
  if(!R.rows.length){ alert('مفيش تسجيلات للموظف ده في الشهر ده'); return; }
  if(typeof ExcelJS === 'undefined'){
    alert('مكتبة الإكسل مش محمّلة — اتأكد إن فيه نت وجرّب تاني');
    return;
  }
  try{
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('المواعيد', { views:[{ rightToLeft:true, state:'frozen', ySplit:4 }] });

    ws.mergeCells('A1:L1');
    ws.getCell('A1').value = 'كشف مواعيد — ' + nameOf(email);
    ws.getCell('A1').font = { bold:true, size:15 };
    ws.getCell('A1').alignment = { horizontal:'center' };

    ws.mergeCells('A2:L2');
    ws.getCell('A2').value = monthLabel() + '  ·  ' + email;
    ws.getCell('A2').alignment = { horizontal:'center' };

    ws.mergeCells('A3:L3');
    ws.getCell('A3').value = `أيام: ${R.days}   |   ساعات: ${fmtHm(R.tW)}   |   `
      + `أوفر تايم: ${fmtHm(R.tO)}   |   نقص: ${fmtHm(R.tS)}   |   خصومات: ${R.tP} ج.م`;
    ws.getCell('A3').alignment = { horizontal:'center' };

    const head = ws.addRow(HR_COLS);
    head.font = { bold:true };
    head.eachCell(c => {
      c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF3F5F8' } };
      c.alignment = { horizontal:'center' };
    });

    R.rows.forEach(r => {
      const row = ws.addRow([r.date, r.day, r.in, r.out, r.counted, r.due,
                             r.worked, r.over, r.short, r.pen, r.state, r.flag]);
      row.alignment = { horizontal:'center' };
      if(r.over)  row.getCell(8).font  = { color:{ argb:'FF15803D' }, bold:true };
      if(r.short) row.getCell(9).font  = { color:{ argb:'FFB5651D' } };
      if(r.pen)   row.getCell(10).font = { color:{ argb:'FFDC2626' }, bold:true };
      if(r.flag)  row.getCell(12).font = { color:{ argb:'FFB5651D' } };
    });

    ws.columns.forEach((c,i) => { c.width = i === 0 ? 12 : (i === 5 ? 16 : 11); });

    const buf = await wb.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buf],
      { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `مواعيد-${nameOf(email)}-${MONTH}.xlsx`;
    a.click();
    // ⚠️ بنفضّي الرابط بعد شوية — من غير كده الملف بيفضل في
    //    الذاكرة لحد ما الصفحة تتقفل
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch(e){
    console.error('exportEmpExcel failed:', e);
    alert('فشل التصدير: ' + (e.message || e));
  }
}

// 💸 الخصومات اليدوية
// ------------------------------------------------------------
// HR بتكتب خصم + سبب، والموظف بيشوفه في شاشة «مرتبك» على موبايله.
//
// 🔴 الكتابة كلها من دوال السيرفر (hr_add_deduction / hr_delete_deduction).
//    جدول hr_deductions **مفيهوش سياسة إدخال ولا حذف خالص** — زي
//    جدول attendance بالظبط. الصفحة دي واجهة عرض وبس.
//
// ⚠️ الخصم ده **غير** خصم التأخير الأوتوماتيكي اللي بيتحسب من
//    قواعد المواعيد. ده يدوي وبسبب مكتوب، وده بيتحسب لوحده —
//    وعن قصد مش بنجمعهم في رقم واحد عشان محدش يتلغبط.
// ============================================================
let DEDS = {};            // إيميل → [خصومات] (كل الشهور، مش الشهر المعروض بس)
let DED_EMAIL = '';       // الموظف المفتوح في شاشة الخصم

async function loadDeductions(){
  try{
    // ⚠️ ترتيب قبل قص — أحدث خصم لازم يبان حتى لو العدد وصل الحد
    const { data, error } = await sb.from('hr_deductions')
      .select('id,user_email,amount,reason,work_date,created_at,created_by,seen_at,waived_at,waived_by,waive_reason')
      .order('created_at', { ascending:false })
      .limit(1000);
    if(error) throw error;
    DEDS = {};
    (data || []).forEach(r => {
      const e = (r.user_email || '').toLowerCase();
      (DEDS[e] = DEDS[e] || []).push(r);
    });
  }catch(e){
    // بنقول بصوت عالي. الفشل الصامت هنا معناه إن HR تفتكر إن
    // الموظف مالوش خصومات وهي موجودة فعلاً.
    console.error('loadDeductions failed:', e);
    DEDS = {};
    const t = (e && e.message) ? e.message : String(e);
    if(/hr_deductions/i.test(t) || (e && e.code === '42P01'))
      console.warn('⚠️ الجدول لسه ماتعملش — شغّل 32-hr-deductions.sql');
  }
}

// مجموع الخصم اليدوي لموظف (كله، مش الشهر المعروض)
// ⚠️ اللي اتشال **مش داخل في المجموع** — بس بيفضل في القايمة
//    بختم مين شاله وليه. لو شلناه من القايمة كمان، محدش هيعرف
//    إن كان فيه خصم أصلاً.
function manualDed(email){
  const list = DEDS[(email||'').toLowerCase()] || [];
  let total = 0, unseen = 0, waived = 0;
  list.forEach(r => {
    if(r.waived_at){ waived++; }
    else { total += Number(r.amount || 0); }
    if(!r.seen_at) unseen++;
  });
  return { total: Math.round(total * 100) / 100, unseen, waived,
           count: list.length, list };
}

// خصم التأخير التلقائي لموظف في الشهر المعروض
function lateDed(email){
  const byDay = PENS[(email||'').toLowerCase()] || {};
  let total = 0, days = 0, waived = 0;
  Object.keys(byDay).forEach(d => {
    const r = byDay[d];
    if(r.waived){ waived++; return; }
    const p = Number(r.penalty || 0);
    if(p > 0){ total += p; days++; }
  });
  return { total: Math.round(total * 100) / 100, days, waived };
}

// سطر خصم يدوي واحد — مصدر واحد عشان الشكل ما يختلفش بين
// قايمة السجل وقايمة شاشة الخصم
function dedRowHtml(r){
  const w = !!r.waived_at;
  return `
    <div class="ded-row${w ? ' waived' : (r.seen_at ? '' : ' unseen')}">
      <div class="ded-amt" ${w ? 'style="text-decoration:line-through;opacity:.55;"' : ''}>−${Number(r.amount)}</div>
      <div class="ded-mid">
        <b ${w ? 'style="text-decoration:line-through;opacity:.6;"' : ''}>${esc(r.reason)}</b>
        <span>${new Date(r.created_at).toLocaleDateString('ar-EG',
          { day:'numeric', month:'long', year:'numeric' })}
          · ${w ? '✋ اتشال' : (r.seen_at ? '✔️ قراه الموظف' : '🔔 لسه ما قراهوش')}</span>
        ${w ? `<span style="color:var(--done);">سبب الشيل: ${esc(r.waive_reason || '—')}</span>` : ''}
      </div>
      ${w
        ? `<button class="ded-del" title="رجّع الخصم" onclick="unwaiveDeduction('${esc(r.id)}')">↩️</button>`
        : `<button class="ded-del" title="شيل الخصم" onclick="waiveDeduction('${esc(r.id)}')">✋</button>`}
      <button class="ded-del" title="مسح نهائي" onclick="deleteDeduction('${esc(r.id)}')">🗑️</button>
    </div>`;
}

function dedSectionHtml(email){
  const m = manualDed(email);
  if(!m.count) return '';
  return `
    <div style="margin-top:18px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;">

      </div>
      ${m.list.map(dedRowHtml).join('')}

}

async function saveDeduction(){
  const btn = document.getElementById('dedSave');
  const amt = parseFloat((document.getElementById('dedAmt') || {}).value);
  const why = ((document.getElementById('dedWhy') || {}).value || '').trim();

  // ⚠️ الفحص هنا **مجاملة للمستخدم بس**. الفحص الحقيقي جوه دالة
  //    hr_add_deduction في السيرفر — لو شيلنا السطرين دول، محدش
  //    هيقدر يعدّي خصم فاضي برضه.
  if(!amt || amt <= 0){ alert('اكتب مبلغ أكبر من صفر'); return; }
  if(!why){ alert('لازم تكتب سبب الخصم'); return; }
  if(!confirm(`تأكيد الخصم\n\nالموظف: ${nameOf(DED_EMAIL)}\nالمبلغ: ${amt} ج.م\nالسبب: ${why}`)) return;

  if(btn){ btn.disabled = true; btn.textContent = '⏳ جاري الحفظ…'; }
  try{
    const { data, error } = await sb.rpc('hr_add_deduction', {
      p_email:  DED_EMAIL,
      p_amount: amt,
      p_reason: why
    });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error. من غير السطر ده
    //    الشاشة هتقول «اتحفظ ✅» والخصم ما اتكتبش.
    if(error) throw error;

    await notifyDeduction(DED_EMAIL, amt, why);   // إشعار برّه التطبيق (اختياري)
    await loadDeductions();
    render();
    renderDeduction();
    // ⚠️ لو الخصم اتعمل من صفحة المرتبات، لازم أرقامها تتحدّث كمان —
    //    من غير السطر ده الصافي بيفضل قديم قدام عين المستخدم.
    if(document.getElementById('paySheet').classList.contains('open')) renderPayrollAdmin();
    const a = document.getElementById('dedAmt'); if(a) a.value = '';
    const w = document.getElementById('dedWhy'); if(w) w.value = '';
    alert('✅ اتسجّل الخصم — هيوصل للموظف في شاشة «مرتبك»');
  }catch(e){
    console.error('saveDeduction failed:', e);
    const t = (e && e.message) ? e.message : String(e);
    alert(/does not exist|42883|42P01/i.test(t)
      ? '❌ الميزة لسه ماتركبتش في قاعدة البيانات — شغّل ملف 32-hr-deductions.sql'
      : '❌ فشل الخصم: ' + t);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '💸 اعمل الخصم'; }
  }
}

async function deleteDeduction(id){
  if(!confirm('متأكد إنك عايز تمسح الخصم ده؟\n\nهيتشال من عند الموظف ومن المجموع.')) return;
  try{
    const { error } = await sb.rpc('hr_delete_deduction', { p_id: id });
    if(error) throw error;
    await loadDeductions();
    render();
    if(document.getElementById('dedSheet').classList.contains('open')) renderDeduction();
    if(document.getElementById('paySheet').classList.contains('open')) renderPayrollAdmin();
    alert('اتمسح ✅');
  }catch(e){
    console.error('deleteDeduction failed:', e);
    alert('❌ مقدرناش نمسحه: ' + (e.message || e));
  }
}

// ============================================================
// 🧾 كشوف الرواتب
// ------------------------------------------------------------
// 🔴 الكشف **قبل الصرف حي، وبعد الصرف متجمّد**.
//
//    قبل الصرف: الأرقام بتتحسب لحظة السؤال. لو شلتي خصم أو
//    ظبّطتي تسجيل، الكشف بيتصحّح لوحده. وده المفروض.
//
//    بعد الصرف: الأرقام بتتصوّر في جدول hr_payslips وتتقفل.
//    لو سيبناها حية، أي تعديل في السجل بعد سنة كان هيغيّر ورقة
//    قبض الموظف بأثر رجعي — والورقة مبقاش ليها معنى.
//
// ⚠️ التراجع بيمسح الصورة فالكشف يرجع حي. وده صح: التراجع معناه
//    «الصرف ده ما حصلش»، مش «حصل وبنعدّله».
// ============================================================
let SLIP = { email:'', rows:[], busy:false };

async function openPayslips(email){
  SLIP = { email:(email||'').toLowerCase(), rows:[], busy:false };
  document.getElementById('slipTitle').textContent = '🧾 كشوف — ' + nameOf(SLIP.email);
  document.getElementById('slipBody').innerHTML = '<div class="empty">جاري التحميل…</div>';
  openSheet('slipSheet');
  await loadPayslips();
  renderPayslips();
}

async function loadPayslips(){
  try{
    const { data, error } = await sb.rpc('hr_payroll_periods', { p_email: SLIP.email });
    if(error) throw error;
    SLIP.rows = data || [];
  }catch(e){
    // بنقول بصوت عالي: لو سكتنا، الشاشة هتقول «مفيش كشوف»
    // و HR تفتكر إن الموظف مالوش مستحقات
    console.error('loadPayslips failed:', e);
    SLIP.rows = [];
    const t = (e && e.message) ? e.message : String(e);
    document.getElementById('slipBody').innerHTML =
      '<div class="hintbox" style="background:var(--rejected-bg,#FEF2F2);color:var(--red);">' +
      (/does not exist|42883/i.test(t)
        ? '❌ الميزة لسه ماتركبتش — شغّل ملف 39-payslips.sql'
        : '❌ مقدرناش نقرا الكشوف: ' + esc(t)) + '</div>';
    throw e;
  }
}

function slipMonthName(p){
  return new Date(p).toLocaleDateString('ar-EG', { month:'long', year:'numeric' });
}

function renderPayslips(){
  const box = document.getElementById('slipBody');
  if(!box) return;
  if(!SLIP.rows.length){
    box.innerHTML = '<div class="empty">مفيش كشوف للموظف ده لسه<br>' +
      '<small>الكشف بيظهر أول ما يبقى ليه مرتب أو حضور أو خصم</small></div>';
    return;
  }

  const due  = SLIP.rows.filter(r => !r.paid);
  const paid = SLIP.rows.filter(r =>  r.paid);

  box.innerHTML = `
    ${due.length ? `
      <div style="font-weight:900;font-size:13.5px;margin:4px 0 10px;color:var(--waiting);">
        ⏳ لسه ماتصرفش (${due.length})</div>
      ${due.map(r => slipCard(r)).join('')}` : `
      <div class="hintbox" style="background:var(--done-bg);color:var(--done);">
        ✅ كل الكشوف اتصرفت</div>`}

    ${paid.length ? `
      <button class="mini-btn" style="width:100%;margin-top:16px;padding:11px;"
              onclick="slipToggleOld()">
        <span id="slipArrow">▾</span> 📜 سجل المرتبات المصروفة (${paid.length})
      </button>
      <div id="slipOld" class="hidden" style="margin-top:11px;">
        ${paid.map(r => slipCard(r)).join('')}
      </div>` : ''}`;
}

function slipToggleOld(){
  const box = document.getElementById('slipOld');
  const arw = document.getElementById('slipArrow');
  if(!box) return;
  box.classList.toggle('hidden');
  if(arw) arw.textContent = box.classList.contains('hidden') ? '▾' : '▴';
}

// ============================================================
// سطور الأوفر تايم في كشف الراتب
// ------------------------------------------------------------
// ⚠️ الصافي بالموجب = أوفر تايم (بيتزوّد على المرتب).
//    بالسالب = عجز ساعات (بينزل من المرتب).
//    بنكتب الاتنين بلون وعلامة مختلفين عشان محدش يقراهم غلط.
// ============================================================
function slipOvertimeLines(r){
  const n  = v => Number(v || 0).toLocaleString('en-US');
  const om = Number(r.over_min  || 0);
  const sm = Number(r.short_min || 0);
  const nm = Number(r.net_min   || 0);
  const amt = Number(r.overtime_amt || 0);
  if(!om && !sm) return '';

  const plus = nm >= 0;
  return `
    <div><span>ساعات زيادة</span><b style="color:var(--done)">${fmtDur(om)}</b></div>
    <div><span>ساعات ناقصة</span><b class="minus">${fmtDur(sm)}</b></div>
    <div style="border-top:1px dashed var(--border);padding-top:7px;margin-top:3px;">
      <span>${plus ? '+ أوفر تايم' : '− عجز ساعات'}
        <small style="opacity:.75;">(${fmtDur(Math.abs(nm))} × ${
          Number(r.hour_value || 0).toFixed(2)} ج.م/س)</small></span>
      <b style="color:${plus ? 'var(--done)' : 'var(--red)'}">${n(Math.abs(amt))}</b>
    </div>`;
}

function slipCard(r){
  const n = v => Number(v || 0).toLocaleString('en-US');
  return `
  <div class="slip ${r.paid ? 'paid' : 'due'}">
    <div class="slip-h">
      <b>${esc(slipMonthName(r.period))}</b>
      <span class="slip-tag ${r.paid ? 'ok' : 'wait'}">${
        r.paid ? '✅ تم صرف الراتب' : '⏳ لسه ماتصرفش'}</span>
    </div>

    <div class="slip-lines">
      <div><span>المرتب</span><b>${n(r.salary)}</b></div>
      <div><span>− خصومات يدوية</span><b class="minus">${n(r.manual_ded)}</b></div>
      <div><span>− خصومات تأخير</span><b class="minus">${n(r.late_ded)}</b></div>
      ${slipOvertimeLines(r)}
      <div class="eq"><span>= الصافي</span><b>${n(r.net)} ج.م</b></div>
    </div>

    ${r.paid ? `
      <div class="slip-meta">
        اتصرف ${esc(new Date(r.paid_at).toLocaleDateString('ar-EG',
          { day:'numeric', month:'long', year:'numeric' }))}
        · بواسطة ${esc(r.paid_by || '—')}
        · ${r.seen_at ? '✔️ الموظف شافه' : '🔔 لسه ما شافوش'}
        <br>🔒 الأرقام دي متقفلة — أي تعديل في السجل بعد كده مش هيغيّرها.
      </div>
      <button class="slip-btn undo" onclick="unmarkPaid('${esc(r.period)}')">
        ↩️ تراجع عن الصرف</button>`
    : `
      <button class="slip-btn" onclick="markPaid('${esc(r.period)}')">
        ✅ تم صرف الراتب</button>`}
  </div>`;
}

async function markPaid(period){
  if(SLIP.busy) return;
  const row = SLIP.rows.find(r => String(r.period) === String(period));
  if(!row) return;

  if(!confirm('تسجيل صرف راتب ' + slipMonthName(period) + '\n\n'
            + 'الصافي: ' + Number(row.net || 0) + ' ج.م\n\n'
            + '⚠️ الأرقام دي هتتقفل. أي تعديل في السجل بعد كده مش هيغيّر الكشف.')) return;

  SLIP.busy = true;
  try{
    const { error } = await sb.rpc('hr_mark_paid',
      { p_email: SLIP.email, p_period: period });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;
    await notifyPay(SLIP.email,
      `تم صرف راتب ${slipMonthName(period)} — صافي ${Number(row.net || 0)} ج.م`);
    await loadPayslips();
    renderPayslips();
    alert('✅ اتسجّل — والموظف هيشوف الكشف في «مرتبك»');
  }catch(e){
    console.error('markPaid failed:', e);
    alert('❌ ' + (e.message || e));
  }finally{
    SLIP.busy = false;
  }
}

async function unmarkPaid(period){
  if(SLIP.busy) return;
  if(!confirm('تراجع عن صرف راتب ' + slipMonthName(period) + '؟\n\n'
            + 'الكشف هيرجع «لسه ماتصرفش» وأرقامه هترجع تتحسب لحظياً تاني.')) return;

  SLIP.busy = true;
  try{
    const { error } = await sb.rpc('hr_unmark_paid',
      { p_email: SLIP.email, p_period: period });
    if(error) throw error;
    await loadPayslips();
    renderPayslips();
  }catch(e){
    console.error('unmarkPaid failed:', e);
    alert('❌ ' + (e.message || e));
  }finally{
    SLIP.busy = false;
  }
}

async function savePenaltyStart(){

              + '• والكشوف اللي قبل الشهر ده مش هتظهر\n\n'
              + '(الكشف اللي اتصرف فعلاً بيفضل ظاهر في السجل.)')) return;
  }

  try{
    const { error } = await sb.rpc('hr_set_penalty_start', { p_date: v || null });

    // إعادة تحميل كاملة: كل الخصومات بتتحسب من أول وجديد
    await loadMonth();
    if(document.getElementById('paySheet').classList.contains('open')) renderPayrollAdmin();
    alert('✅ اتحفظ — الخصومات اتحسبت من أول وجديد');
  }catch(e){
    console.error('savePenaltyStart failed:', e);
    const t = (e && e.message) ? e.message : String(e);
    alert(/does not exist|42883/i.test(t)
      ? '❌ الميزة لسه ماتركبتش — شغّل ملف 38-penalty-start-date.sql'
      : '❌ ' + t);
  }
}

// ============================================================
// ✍️ التسجيل اليدوي — إضافة · تعديل · مسح
// ------------------------------------------------------------
// 🔴 جدول attendance **لسه مقفول** على الإدخال المباشر. كل حاجة
//    هنا بتمر من ٣ دوال في السيرفر بتفحص إن اللي بينده HR أو أدمن،
//    وبتحط ختم على الصف: مين كتبه بإيده وإمتى.
//
// 🔴 والختم بيظهر للموظف نفسه في سجله («✍️ يدوي»). لو HR قدرت
//    تعدّل السجل في الخفا، السجل كله يفقد قيمته كدليل — والموظف
//    يبقى معاه حق يشك في أي رقم.
//
// ⚠️ الوقت بيتبعت **نص** ('YYYY-MM-DD HH:MM') والسيرفر بيحوّله
//    بتوقيت القاهرة. لو بنينا timestamp في المتصفح، كان هيتبني
//    بساعة **الجهاز** — ولو جهاز الـ HR على توقيت تاني، كل
//    التسجيلات تتكتب غلط ومحدش ياخد باله.
// ============================================================
let PUNCH = { email:'', id:null, day:'' };

const PUNCH_KINDS = [
  { k:'in',     t:'🟢 حضور' },
  { k:'out',    t:'🔴 انصراف' },
  { k:'break',  t:'☕ بريك' },
  { k:'resume', t:'▶️ استئناف العمل' }
];

function openPunch(email, day, id){
  PUNCH = { email:(email||'').toLowerCase(), id:id || null, day:day || '' };
  renderPunch();
  openSheet('punchSheet');
}

function findPunch(id){
  return ROWS.find(r => String(r.id) === String(id)) || null;
}

// الوقت بتوقيت القاهرة في صيغة خانة datetime-local
function cairoLocal(iso){
  const p = new Date(iso).toLocaleString('sv-SE', { timeZone:'Africa/Cairo' });
  return p.slice(0,16).replace(' ', 'T');   // 'YYYY-MM-DDTHH:MM'
}

function renderPunch(){
  const editing = !!PUNCH.id;
  const row = editing ? findPunch(PUNCH.id) : null;
  const list = allPeople();

  if(editing && !row){
    document.getElementById('punchBody').innerHTML =
      '<div class="empty">التسجيل ده مش موجود — اقفل وافتح تاني</div>';
    return;
  }

  const kind = row ? row.kind : 'in';
  const day  = row ? row.work_date : (PUNCH.day || todayCairo());
  // الوقت الافتراضي: نص اليوم — عشان HR تكتبه بإيدها بدل ما تسيب
  // ساعة عشوائية تعدّي بالغلط
  const at   = row ? cairoLocal(row.at) : (day + 'T00:00');
  // الصف الموجود: اليوم المحاسبي مختلف عن يوم الوقت؟ يبقى ده
  // تسجيل بعد نص الليل
  const prevShift = row ? (String(row.work_date) !== at.slice(0,10)) : false;

  document.getElementById('punchTitle').textContent =
    (editing ? '✏️ تعديل تسجيل — ' : '✍️ تسجيل يدوي — ') + nameOf(PUNCH.email || (list[0]||''));

  document.getElementById('punchBody').innerHTML = `
    <div class="hintbox">
      التسجيل ده هيتكتب <b>باسمك</b> وهيظهر للموظف بعلامة «✍️ يدوي».<br>
      ومش هيبقى موثّق ببصمة ولا لوكيشن — طبيعي، الموظف مش موجود دلوقتي.<br>
      وأي تعديل هنا <b>بيعيد حساب الساعات والخصومات</b> لليوم ده لوحده.
    </div>

    ${editing ? '' : `
    <label class="fld"><span>👤 الموظف</span>
      <select id="pkEmail" onchange="PUNCH.email=this.value; renderPunch()">
        ${list.map(e => `<option value="${esc(e)}"${e===PUNCH.email?' selected':''}>${esc(nameOf(e))}</option>`).join('')}
      </select>
    </label>`}

    <label class="fld"><span>📌 نوع التسجيل</span>
      <select id="pkKind">
        ${PUNCH_KINDS.map(x => `<option value="${x.k}"${x.k===kind?' selected':''}>${x.t}</option>`).join('')}
      </select>
    </label>

    <label class="fld"><span>🕐 وقت التسجيل — بتوقيت القاهرة</span>
      <small>اكتب اليوم والساعة اللي حصل فيهم فعلاً. الكارت بيتحدد من هنا.</small>
      <input type="datetime-local" id="pkAt" value="${esc(at)}" oninput="punchPreview()">
    </label>

    <!-- ⚠️ كان فيه خانة تانية اسمها «اليوم المحاسبي». اتشالت.
         خانتين تاريخ في شاشة واحدة = دعوة للغلط: المستخدم بيغيّر
         واحدة وينسى التانية، فالتسجيل بيروح لكارت يوم تاني وهو
         مش فاهم ليه. دلوقتي التاريخ بيتاخد من الوقت أوتوماتيك،
         والحالة الاستثنائية الوحيدة بقت صح/غلط واضح. -->
    <label class="fld" style="display:flex;align-items:flex-start;gap:9px;">
      <input type="checkbox" id="pkPrev" ${prevShift ? 'checked' : ''}
             onchange="punchPreview()"
             style="width:auto;margin-top:3px;flex:none;">
      <span style="font-weight:700;font-size:13px;line-height:1.8;">
        ده تسجيل <b>بعد نص الليل</b> وبيتبع وردية اليوم اللي قبله<br>
        <small style="font-weight:400;color:var(--muted);">
          مثال: حضر ٣١ ومشي ٢ الفجر يوم ١ — الانصراف بيتحسب على وردية ٣١.</small>
      </span>
    </label>

    <div class="hintbox" id="pkPreview" style="background:var(--blue-bg);color:var(--blue);"></div>

    <label class="fld"><span>📝 ملاحظة (اختياري)</span>
      <input type="text" id="pkNote" placeholder="مثال: نسي يسجّل الانصراف"
             value="${esc(row && row.manual_note ? row.manual_note : '')}">
    </label>

    <button class="save" id="pkSave" onclick="savePunch()">
      ${editing ? '💾 احفظ التعديل' : '➕ اكتب التسجيل'}</button>

    ${editing ? `<button class="save" style="margin-top:10px;background:var(--red);"

function todayCairo(){
  return new Date().toLocaleDateString('sv-SE', { timeZone:'Africa/Cairo' });
}

// إزاحة يوم على نص 'YYYY-MM-DD' — بـ UTC عشان التوقيت الصيفي
// ما يخليش اليوم يقفز يومين أو يقف مكانه
function shiftDay(ymd, delta){
  const [y,m,d] = ymd.split('-').map(Number);
  const t = new Date(Date.UTC(y, m-1, d));
  t.setUTCDate(t.getUTCDate() + delta);
  return t.toISOString().slice(0,10);
}

// 🔴 مصدر واحد لحساب اليوم المحاسبي — المعاينة والحفظ بيندهوه.
//    لو حسبناه في مكانين، المعاينة تقول كارت وهو يروح كارت تاني.
function punchWorkDate(){
  const atv = ((document.getElementById('pkAt') || {}).value || '').trim();
  if(!atv) return '';
  const day  = atv.slice(0,10);
  const prev = !!(document.getElementById('pkPrev') || {}).checked;
  return prev ? shiftDay(day, -1) : day;
}

// بتوري لـ HR الكارت اللي التسجيل هيروحه **قبل** ما تحفظ.
// ⚠️ ده مش زينة: الغلطة اللي حصلت كانت إن التسجيل راح لكارت يوم
//    تاني ومحدش عرف غير بعد ما دوّر. الشاشة بقت بتقول قبل الحفظ.
function punchPreview(){
  const box = document.getElementById('pkPreview');
  if(!box) return;
  const wd = punchWorkDate();
  if(!wd){ box.textContent = 'اكتب الوقت الأول'; return; }
  const nice = new Date(wd).toLocaleDateString('ar-EG',
    { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  box.innerHTML = '📍 هيتحط في كارت: <b>' + esc(nice) + '</b>';
}

async function savePunch(){
  const g   = id => ((document.getElementById(id) || {}).value || '').trim();
  const btn = document.getElementById('pkSave');
  const kind = g('pkKind'), note = g('pkNote');
  const atv  = g('pkAt');
  // 🔴 نفس الدالة اللي المعاينة بتستخدمها — عشان اللي شافته HR
  //    هو اللي هيتحفظ بالظبط
  const day  = punchWorkDate();

  if(!kind || !day || !atv){ alert('املا نوع التسجيل والوقت'); return; }
  // السيرفر عايز 'YYYY-MM-DD HH:MM' — الخانة بتدي 'YYYY-MM-DDTHH:MM'
  const local = atv.replace('T', ' ').slice(0,16);

  if(btn){ btn.disabled = true; btn.textContent = '⏳ جاري الحفظ…'; }
  try{
    let error;
    if(PUNCH.id){
      ({ error } = await sb.rpc('hr_edit_punch', {
        p_id: PUNCH.id, p_kind: kind, p_work_date: day, p_local: local, p_note: note || null }));
    }else{
      const em = g('pkEmail') || PUNCH.email;
      if(!em){ alert('اختار الموظف'); return; }
      ({ error } = await sb.rpc('hr_manual_punch', {
        p_email: em, p_kind: kind, p_work_date: day, p_local: local, p_note: note || null }));
    }
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;

    closeSheet('punchSheet');
    // إعادة تحميل كاملة: الساعات والخصومات كلها بتتحسب من أول وجديد
    await loadMonth();
    alert('✅ اتحفظ');
  }catch(e){
    console.error('savePunch failed:', e);
    const t = (e && e.message) ? e.message : String(e);
    alert(/does not exist|42883/i.test(t)
      ? '❌ الميزة لسه ماتركبتش — شغّل ملف 37-hr-manual-attendance.sql'
      : '❌ ' + t);
  }finally{
    if(btn){ btn.disabled = false; }
  }
}

    const row = (DEDS[DED_EMAIL] || []).concat(
      Object.keys(DEDS).reduce((a,k) => a.concat(DEDS[k]), [])).find(x => x.id === id);
    if(row) await notifyPay(row.user_email, `اتشال عنك خصم ${row.amount} ج.م — ${why.trim()}`);
    await loadDeductions();
    render();
    if(document.getElementById('dedSheet').classList.contains('open')) renderDeduction();
    if(document.getElementById('paySheet').classList.contains('open')) renderPayrollAdmin();
    alert('✅ الخصم اتشال — والموظف هيشوف السبب');
  }catch(e){
    console.error('waiveDeduction failed:', e);
    alert('❌ ' + (e.message || e));
  }
}

// 💰 صفحة «المخصومات والمرتبات»
// ------------------------------------------------------------
// 🔴 الفرق الجوهري بينها وبين الصفحة الرئيسية:
//    الصفحة الرئيسية بتبني كروتها **من سجل الحضور** — يعني
//    الموظف اللي ما سجّلش حضور ولا مرة مالوش كارت أصلاً، ومكانش
//    ينفع تحطله مرتب ولا تخصم منه.
//
//    الصفحة دي بتبني كروتها **من قايمة الأدمن** (user-roles).
//    فأي حد الأدمن سجّله بيبان هنا، حضر أو ما حضرش.
//
// ⚠️ الكتابة كلها من دوال السيرفر. جدول hr_salaries زي جدول
//    hr_deductions بالظبط: **مفيهوش سياسة كتابة خالص**.
// ============================================================
let SALS  = {};    // إيميل → مرتبه
let PAY_Q = '';    // نص البحث

// كل الناس اللي الأدمن سجّلهم — ما عدا السوبر أدمن (صاحب المحل)
// ⚠️ مش بنستخدم allEmployees() هنا لأنها بتشيل دور hr، وشؤون
//    العاملين نفسها ليها مرتب زي أي حد.
function allPeople(){
  const out = [];
  for(const em of Object.keys(ROLES_MAP || {})){
    const v = ROLES_MAP[em];
    const r = typeof v === 'string' ? v : (v && v.role) || '';
    if(r === 'super_admin') continue;
    out.push(em.toLowerCase());
  }
  // وأي حد ظهر في سجل الحضور ومش في الخريطة (حساب اتشال مثلاً) —
  // مينفعش يختفي وعليه خصومات
  ROWS.forEach(r => {
    const e = (r.user_email||'').toLowerCase();
    if(e && out.indexOf(e) < 0) out.push(e);
  });
  return out.sort((a,b) => nameOf(a).localeCompare(nameOf(b),'ar'));
}

  }catch(e){
    // بنقول بصوت عالي بدل ما الصفحة توري «مفيش مرتب» لكل الناس

}

function renderPayrollAdmin(){
  const box = document.getElementById('payBody');
  if(!box) return;
