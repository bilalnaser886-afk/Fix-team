<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
/* المظهر قبل أي رسم — صفحة عامة، فبتتبع جهاز العميل لو مفيش تفضيل محفوظ */
(function(){
  try{
    var m = localStorage.getItem('ifix-theme'), d;
    if(m === 'dark') d = true;
    else if(m === 'light') d = false;
    else if(m === 'auto'){ var h = new Date().getHours(); d = (h >= 19 || h < 7); }
    else d = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ============================================================
     الألوان من لوجو المحل نفسه — التروس الحمرا والزرقا والدهبي.
     مش لوحة جديدة: دي هوية موجودة في index.html و track.html،
     والعميل جاي من صفحة فيسبوك فيها نفس اللوجو.
     ============================================================ */
  :root{
    --red:#E8321E; --red-dark:#C22513;
    --blue:#2B1DE8; --gold:#BE8A1C;
    --ink:#101014; --paper:#F2F2F1;
    --card:#FFFFFF; --line:#E4E4E6;
    --muted:#6B7280; --faint:#9CA3AF;
    --on-color:#FFFFFF;
    --bot-bg:#FFFFFF; --me-bg:#101014; --me-ink:#FFFFFF;
    --tip-bg:#FFF8EC; --tip-bd:#EACB84; --tip-ink:#7A5309;
    --shadow:rgba(16,16,20,.10);
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --red:#F0554A; --red-dark:#D13B2E;
    --blue:#8B9BFF; --gold:#E3B85C;
    --ink:#E9EFF5; --paper:#131E29;
    --card:#1B2A3A; --line:#2F4356;
    --muted:#92A6B8; --faint:#71879B;
    --on-color:#0E1721;
    --bot-bg:#22323F; --me-bg:#E9EFF5; --me-ink:#0E1721;
    --tip-bg:rgba(234,203,132,.12); --tip-bd:rgba(234,203,132,.38); --tip-ink:#F0CE84;
    --shadow:rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100dvh; background:var(--paper); color:var(--ink);
    font-family:'Tajawal','Segoe UI',sans-serif; font-size:16px; line-height:1.75;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }

  /* ===== الهيدر: الشريط التلاتي هو توقيع المحل، موجود على الليبل المطبوع ===== */
  .top{background:var(--card); border-bottom:1px solid var(--line); padding:14px 18px 0;}
  .top-in{display:flex; align-items:center; gap:11px; max-width:560px; margin:0 auto; padding-bottom:12px;}
  .mark{width:44px; height:44px; border-radius:12px; overflow:hidden; flex:none; box-shadow:0 3px 10px var(--shadow);}
  .mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .top h1{font-family:'Cairo',sans-serif; font-weight:900; font-size:18px; margin:0; letter-spacing:.2px;}
  .top p{margin:1px 0 0; font-size:12.5px; color:var(--muted);}
  .stripe{height:4px; display:flex;}
  .stripe i{flex:1;} .s1{background:var(--blue);} .s2{background:var(--red);} .s3{background:var(--gold);}

  /* ===== المحادثة ===== */
  .flow{flex:1; width:100%; max-width:560px; margin:0 auto; padding:18px 16px 8px;}
  .row{display:flex; margin-bottom:12px; animation:in .28s ease both;}
  .row.me{justify-content:flex-start;}
  .row.bot{justify-content:flex-end;}
  @keyframes in{from{opacity:0; transform:translateY(7px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){ .row{animation:none;} }

  .bub{
    max-width:84%; padding:12px 15px; border-radius:17px; font-size:15.5px; line-height:1.8;
    box-shadow:0 2px 7px var(--shadow);
  }
  .bot .bub{background:var(--bot-bg); border:1px solid var(--line); border-end-end-radius:6px;}
  .me  .bub{background:var(--me-bg); color:var(--me-ink); border-end-start-radius:6px;}
  .bub b{font-weight:700;}

  /* نصيحة فورية — دي أكتر حاجة نافعة للعميل قبل ما يوصل المحل */
  .tip{
    background:var(--tip-bg); border:1px solid var(--tip-bd); color:var(--tip-ink);
    border-radius:14px; padding:12px 15px; font-size:14.5px; line-height:1.85;
    max-width:84%; margin:0 0 12px auto; box-shadow:0 2px 7px var(--shadow);
  }
  .tip .h{font-family:'Cairo',sans-serif; font-weight:800; display:block; margin-bottom:3px;}

  /* ===== الاختيارات ===== */
  .picks{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin:2px 0 16px;}
  .pick{
    font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer;
    background:var(--card); color:var(--ink); border:1.5px solid var(--line);
    border-radius:999px; padding:10px 17px; transition:border-color .15s, transform .1s;
  }
  .pick:hover{border-color:var(--red);}
  .pick:active{transform:scale(.97);}
  .pick:focus-visible{outline:3px solid color-mix(in srgb, var(--red) 45%, transparent); outline-offset:2px;}

  .ask{display:flex; gap:8px; margin:2px 0 16px;}
  .ask input{
    flex:1; font-family:inherit; font-size:16px; color:var(--ink);
    background:var(--card); border:1.5px solid var(--line); border-radius:13px; padding:12px 14px;
  }
  .ask input:focus{outline:none; border-color:var(--red);}
  .ask button{
    flex:none; font-family:'Cairo',sans-serif; font-weight:800; font-size:15px; cursor:pointer;
    background:var(--red); color:var(--on-color); border:none; border-radius:13px; padding:0 20px;
  }
  .ask button:active{background:var(--red-dark);}

  /* ============================================================
     التوقيع: بطاقة الكشف المبدئي
     شكلها متعمّد إنه يشبه الليبل الحراري اللي المحل بيطبعه على
     كل جهاز — نفس الشريط التلاتي ونفس الخط أحادي المسافة للرقم.
     العميل بيصوّرها ويجي بيها، فبتبقى وصلة بين اللينك والمحل.
     ============================================================ */
  .ticket{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    overflow:hidden; margin:6px 0 16px; box-shadow:0 8px 26px var(--shadow);
    animation:in .4s ease both;
  }
  .ticket .stripe{height:5px;}
  .tk-in{padding:16px 18px 18px;}
  .tk-eyebrow{
    font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
    font-size:11px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase;
  }
  .tk-in h2{font-family:'Cairo',sans-serif; font-weight:900; font-size:19px; margin:3px 0 14px;}
  .tk-line{display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px dashed var(--line);}
  .tk-line:last-of-type{border-bottom:none;}
  .tk-k{font-size:13.5px; color:var(--muted); flex:none;}
  .tk-v{font-size:14.5px; font-weight:700; text-align:start;}
  .tk-price{
    margin-top:14px; padding:13px 15px; border-radius:13px;
    background:color-mix(in srgb, var(--red) 8%, transparent);
    border:1px solid color-mix(in srgb, var(--red) 30%, transparent);
  }
  .tk-price .k{font-size:12.5px; color:var(--muted);}
  .tk-price .v{font-family:'Cairo',sans-serif; font-weight:900; font-size:22px; color:var(--red); margin-top:1px;}
  .tk-price .n{font-size:12px; color:var(--muted); line-height:1.7; margin-top:5px;}

  /* ===== الإجراءات ===== */
  .cta{display:grid; gap:9px; margin:2px 0 20px;}
  .cta a, .cta button{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:15.5px;
    padding:14px; border-radius:14px; border:none; cursor:pointer; text-decoration:none;
  }
  .c-wa{background:#25D366; color:#06301A;}
  .c-map{background:var(--card); color:var(--ink); border:1.5px solid var(--line);}
  .c-more{background:transparent; color:var(--muted); font-size:14px; font-weight:700; padding:8px;}

  .foot{
    text-align:center; font-size:12px; color:var(--faint); line-height:1.9;
    padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .foot b{color:var(--red);}
  .typing{display:inline-flex; gap:4px; align-items:center; padding:4px 0;}
  .typing i{width:6px; height:6px; border-radius:50%; background:var(--faint); animation:bob 1s infinite;}
  .typing i:nth-child(2){animation-delay:.15s;} .typing i:nth-child(3){animation-delay:.3s;}
  @keyframes bob{0%,60%,100%{opacity:.3;} 30%{opacity:1;}}
  @media (prefers-reduced-motion:reduce){ .typing i{animation:none; opacity:.6;} }
</style>
</head>

<script>

const BRANDS = [
  { k:'apple',   n:'ايفون',    tier:'apple'   },

// النصيحة هي أنفع حاجة في الصفحة: بتقول للعميل يعمل إيه دلوقتي

const ISSUES = [
  { k:'screen',   n:'الشاشة مكسورة أو مش شغالة',
    tip:'لو الشاشة مكسورة وفيها قزاز مكسّر، متعدّيش صوابعك عليها. لفّها بشريط شفاف لحد ما توصّلها.' },
  { k:'battery',  n:'البطارية بتفصل بسرعة',

  { k:'charge',   n:'مش بيشحن',
    tip:'جرّب شاحن وكابل تانيين قبل ما تيجي. أحياناً العطل في الكابل مش في الجهاز.' },
  { k:'water',    n:'وقع في ميه',
    tip:'متشحنوش ومتشغّلوش خالص، وسيبه مقفول. كل ساعة بتعدّي بتقلّل فرصة إنقاذه. هاته بسرعة.' },
  { k:'software', n:'بيهنّج أو بيقفل لوحده',
    tip:'لو فيه صور أو أرقام مهمة، خد نسخة احتياطية قبل ما تيجي لو الجهاز لسه بيشتغل.' },
  { k:'camera',   n:'الكاميرا',
    tip:'صوّر بيها صورة قبل ما تيجي — تعرفنا العطل في العدسة ولا في السوفت.' },
  { k:'sound',    n:'الصوت أو المايك',
    tip:'جرّب سماعة سلكية. لو الصوت طلع منها، العطل في السماعة الداخلية.' },
  { k:'dead',     n:'مش بيفتح خالص',
    tip:'حطّه على الشاحن ربع ساعة وجرّب تاني. لو مفيش أي علامة، هاته لنكشف عليه.' },
  { k:'other',    n:'مشكلة تانية',
    tip:'ابعتلنا التفاصيل على واتساب أو هاته المحل ونكشف عليه.' }
];

// ============================================================
// الاتصال بقاعدة البيانات — نفس منطق باقي الصفحات:
// نطاق الإنتاج بس هو اللي بيوصل لقاعدة الإنتاج
// ============================================================
const SUPABASE_ENVS = {
  production: {
    url: "https://ujpnewqqdkmiedtwvdsy.supabase.co",
    key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqcG5ld3FxZGttaWVkdHd2ZHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MzI0ODEsImV4cCI6MjEwMDAwODQ4MX0.PVreBU_ONzAsHO58AJgXVUhuZjvz0quJU8OTxEVcjDc"
  },

  }
};
const PROD_HOSTS = ["fix-team.pages.dev"];
const APP_ENV = PROD_HOSTS.includes(location.hostname) ? "production" : "staging";
const _cfg = SUPABASE_ENVS[APP_ENV];
const sb = supabase.createClient(_cfg.url, _cfg.key);

if(APP_ENV === "staging"){
  addEventListener("DOMContentLoaded", function(){
    var b = document.createElement("div");
    b.textContent = "🧪 بيئة تجريبية — STAGING";
    b.style.cssText = "position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#B45309;color:#fff;text-align:center;font:700 12px/1.7 system-ui,sans-serif;padding:5px;";

// ============================================================
// حالة المحادثة
// ============================================================
const TOKEN_KEY = 'ifix_assist_token';
const S = { token:'', brand:null, model:'', issue:null, phone:'', customer:'', msgs:[], saved:false };

const $flow = document.getElementById('flow');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function newToken(){
  try{ return crypto.randomUUID().replace(/-/g,''); }
  catch(e){ return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,10); }
}

// ============================================================
// الحفظ
// ------------------------------------------------------------
// بيشتغل في الخلفية ومبيوقفش المحادثة أبداً. لو النت وقع، العميل
// بيكمّل عادي — الحفظ يفشل بصمت وهو أهون من محادثة بتقف.
// ============================================================
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const row = {
      token: S.token,
      brand: S.brand ? S.brand.n : '',
      model: S.model, phone: S.phone, customer: S.customer,
      issue: S.issue ? S.issue.n : '',
      status: S.phone ? 'human' : 'bot',
      messages: S.msgs,
      updated_at: new Date().toISOString()
    };
    try{
      if(!S.saved){
        const { error } = await sb.from('assistant_chats').insert(row);
        if(!error) S.saved = true;
      }else{
        await sb.from('assistant_chats').update(row).eq('token', S.token);
      }
    }catch(e){ /* الحفظ مش بيوقف المحادثة */ }
  }, 700);
}

// ============================================================
// الرسم
// ============================================================
function bubble(who, html){
  const r = document.createElement('div');
  r.className = 'row ' + who;
  r.innerHTML = `<div class="bub">${html}</div>`;
  $flow.appendChild(r);
  S.msgs.push({ who, text: r.textContent.trim(), at: new Date().toISOString() });
  toBottom();
}
function tip(title, body){
  const d = document.createElement('div');
  d.className = 'tip';
  d.innerHTML = `<span class="h">${esc(title)}</span>${esc(body)}`;
  $flow.appendChild(d);
  S.msgs.push({ who:'bot', text: title + ' — ' + body, at: new Date().toISOString() });
  toBottom();
}
function clearInputs(){ $flow.querySelectorAll('.picks, .ask, .cta').forEach(e => e.remove()); }
function toBottom(){ requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' })); }

function picks(items, onPick){
  clearInputs();
  const d = document.createElement('div');
  d.className = 'picks';
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pick'; b.textContent = it.n;
    b.onclick = () => { bubble('me', esc(it.n)); clearInputs(); onPick(it); };
    d.appendChild(b);
  });
  $flow.appendChild(d); toBottom();
}

function askText(placeholder, cta, onDone, opts){
  clearInputs();
  const d = document.createElement('div');
  d.className = 'ask';
  d.innerHTML = `<input type="${(opts&&opts.tel)?'tel':'text'}" placeholder="${esc(placeholder)}"
                   ${(opts&&opts.tel)?'inputmode="tel"':''} maxlength="60">
                 <button type="button">${esc(cta)}</button>`;
  const [inp, btn] = [d.querySelector('input'), d.querySelector('button')];
  const go = () => {
    const v = inp.value.trim();
    if(!v) { inp.focus(); return; }
    bubble('me', esc(v)); clearInputs(); onDone(v);
  };
  btn.onclick = go;
  inp.onkeydown = e => { if(e.key === 'Enter') go(); };
  $flow.appendChild(d); toBottom();
  setTimeout(() => inp.focus(), 120);
}

function typing(ms, then){
  const r = document.createElement('div');
  r.className = 'row bot';
  r.innerHTML = `<div class="bub"><span class="typing"><i></i><i></i><i></i></span></div>`;
  $flow.appendChild(r); toBottom();
  setTimeout(() => { r.remove(); then(); }, ms);
}

// ============================================================
// المسار
// ============================================================
function start(){
  bubble('bot', 'أهلاً بيك في <b>I Fix Team</b> 👋<br>هساعدك تعرف مشكلة جهازك والتكلفة التقريبية في أقل من دقيقة.');
  typing(700, () => {
    bubble('bot', 'جهازك نوعه إيه؟');
    picks(BRANDS, b => { S.brand = b; save(); stepModel(); });
  });
}

function stepModel(){
  typing(500, () => {
    bubble('bot', 'موديل إيه بالظبط؟ <span style="color:var(--muted)">(لو مش متأكد اكتب تقريبي)</span>');
    askText('مثلاً: 13 برو ماكس', 'تمام', v => { S.model = v; save(); stepIssue(); });
  });
}

function stepIssue(){
  typing(600, () => {
    bubble('bot', 'المشكلة إيه؟');
    picks(ISSUES, i => { S.issue = i; save(); result(); });
  });
}

function priceLine(){
  if(!PRICES.enabled) return null;
  const tier = (S.brand && S.brand.tier) || 'other';
  const r = ((PRICES.table[tier] || {})[S.issue.k]) || null;
  if(!r || (!r[0] && !r[1])) return null;
  const f = n => n.toLocaleString('en-EG');
  return r[0] === r[1] ? `${f(r[0])} ج.م` : `${f(r[0])} – ${f(r[1])} ج.م`;
}

function result(){
  typing(900, () => {
    tip('اعمل إيه دلوقتي', S.issue.tip);

    const price = priceLine();
    const t = document.createElement('div');
    t.className = 'ticket';
    t.innerHTML = `
      <div class="stripe"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
      <div class="tk-in">
        <div class="tk-eyebrow">PRE-DIAGNOSIS</div>
        <h2>بطاقة كشف مبدئي</h2>
        <div class="tk-line"><span class="tk-k">الجهاز</span><span class="tk-v">${esc(S.brand.n)} ${esc(S.model)}</span></div>
        <div class="tk-line"><span class="tk-k">المشكلة</span><span class="tk-v">${esc(S.issue.n)}</span></div>
        <div class="tk-line"><span class="tk-k">المحل</span><span class="tk-v">ميدان سرور، دمياط</span></div>
        ${price ? `
          <div class="tk-price">
            <div class="k">التكلفة التقريبية</div>
            <div class="v">${price}</div>
            <div class="n">تقدير مبدئي حسب الموديل والعطل. السعر النهائي بعد الكشف.</div>
          </div>`
        : `<div class="tk-price"><div class="k">التكلفة</div>
             <div class="v" style="font-size:17px;">بعد الكشف</div>
             <div class="n">الأعطال بتختلف من جهاز للتاني — بنكشف الأول وبنقولك السعر قبل ما نبدأ.</div>
           </div>`}
      </div>`;
    $flow.appendChild(t);
    S.msgs.push({ who:'bot', text:'بطاقة كشف مبدئي: ' + S.brand.n + ' ' + S.model + ' — ' + S.issue.n, at:new Date().toISOString() });
    save(); toBottom();

    typing(700, () => {
      bubble('bot', 'صوّر البطاقة دي وهاتها معاك — هتوفّر عليك وقت الشرح.');
      actions();
    });
  });
}

function actions(){
  clearInputs();
  const msg = encodeURIComponent(
    `السلام عليكم، جهازي ${S.brand.n} ${S.model}\nالمشكلة: ${S.issue.n}`);
  const d = document.createElement('div');
  d.className = 'cta';
  d.innerHTML = `
    <a class="c-wa" href="https://wa.me/${SHOP.whatsapp}?text=${msg}" target="_blank" rel="noopener">💬 كلّمنا على واتساب</a>
    <a class="c-map" href="${SHOP.maps}" target="_blank" rel="noopener">📍 مكان المحل — ${esc(SHOP.hours)}</a>
    <button type="button" class="c-more" id="callMe">تحب حد من الفريق يكلمك؟</button>`;
  $flow.appendChild(d); toBottom();
  document.getElementById('callMe').onclick = () => { clearInputs(); leaveNumber(); };
}

function leaveNumber(){
  bubble('bot', 'اكتب رقمك وهنكلمك في أقرب وقت.');
  askText('01xxxxxxxxx', 'ابعت', v => {
    const digits = v.replace(/\D/g,'');
    if(digits.length < 10){
      bubble('bot', 'الرقم شكله ناقص — اكتبه تاني من فضلك.');
      return leaveNumberRetry();
    }
    S.phone = digits;
    save();
    typing(500, () => {
      bubble('bot', 'وصلنا رقمك ✅ هنكلمك قريب.<br>ولو مستعجل، الواتساب أسرع.');
      actions();
    });
  }, { tel:true });
}
function leaveNumberRetry(){
  askText('01xxxxxxxxx', 'ابعت', v => {
    S.phone = v.replace(/\D/g,''); save();
    typing(500, () => { bubble('bot', 'وصلنا رقمك ✅ هنكلمك قريب.'); actions(); });
  }, { tel:true });
}

// ============================================================
// الإقلاع
// ============================================================
(function boot(){
  try{
    S.token = localStorage.getItem(TOKEN_KEY) || '';
    if(!S.token){ S.token = newToken(); localStorage.setItem(TOKEN_KEY, S.token); }
  }catch(e){ S.token = newToken(); }

  const mt = document.getElementById('tcMeta');
  if(mt) mt.setAttribute('content',
    document.documentElement.getAttribute('data-theme') === 'dark' ? '#131E29' : '#F2F2F1');

  start();
})();
</script>
