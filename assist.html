<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
/* المظهر قبل أي رسم — صفحة عامة، فبتتبع جهاز العميل لو مفيش تفضيل محفوظ */
(function(){
  try{
    var m = localStorage.getItem('ifix-theme'), d;
    if(m === 'dark') d = true;
    else if(m === 'light') d = false;
    else if(m === 'auto'){ var h = new Date().getHours(); d = (h >= 19 || h < 7); }
    else d = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F1" id="tcMeta">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ============================================================
     الألوان من لوجو المحل نفسه — التروس الحمرا والزرقا والدهبي.
     مش لوحة جديدة: دي هوية موجودة في index.html و track.html،
     والعميل جاي من صفحة فيسبوك فيها نفس اللوجو.
     ============================================================ */
  :root{
    --red:#E8321E; --red-dark:#C22513;
    --blue:#2B1DE8; --gold:#BE8A1C;
    --ink:#101014; --paper:#F2F2F1;
    --card:#FFFFFF; --line:#E4E4E6;
    --muted:#6B7280; --faint:#9CA3AF;
    --on-color:#FFFFFF;
    --bot-bg:#FFFFFF; --me-bg:#101014; --me-ink:#FFFFFF;
    --tip-bg:#FFF8EC; --tip-bd:#EACB84; --tip-ink:#7A5309;
    --shadow:rgba(16,16,20,.10);
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --red:#F0554A; --red-dark:#D13B2E;
    --blue:#8B9BFF; --gold:#E3B85C;
    --ink:#E9EFF5; --paper:#131E29;
    --card:#1B2A3A; --line:#2F4356;
    --muted:#92A6B8; --faint:#71879B;
    --on-color:#0E1721;
    --bot-bg:#22323F; --me-bg:#E9EFF5; --me-ink:#0E1721;
    --tip-bg:rgba(234,203,132,.12); --tip-bd:rgba(234,203,132,.38); --tip-ink:#F0CE84;
    --shadow:rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100dvh; background:var(--paper); color:var(--ink);
    font-family:'Tajawal','Segoe UI',sans-serif; font-size:16px; line-height:1.75;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }

  /* ===== الهيدر: الشريط التلاتي هو توقيع المحل، موجود على الليبل المطبوع ===== */
  .top{background:var(--card); border-bottom:1px solid var(--line); padding:14px 18px 0;}
  .top-in{display:flex; align-items:center; gap:11px; max-width:560px; margin:0 auto; padding-bottom:12px;}
  .mark{width:44px; height:44px; border-radius:12px; overflow:hidden; flex:none; box-shadow:0 3px 10px var(--shadow);}
  .mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .top h1{font-family:'Cairo',sans-serif; font-weight:900; font-size:18px; margin:0; letter-spacing:.2px;}
  .top p{margin:1px 0 0; font-size:12.5px; color:var(--muted);}
  .stripe{height:4px; display:flex;}
  .stripe i{flex:1;} .s1{background:var(--blue);} .s2{background:var(--red);} .s3{background:var(--gold);}

  /* ===== المحادثة ===== */
  .flow{flex:1; width:100%; max-width:560px; margin:0 auto; padding:18px 16px 8px;}
  .row{display:flex; margin-bottom:12px; animation:in .28s ease both;}
  .row.me{justify-content:flex-start;}
  .row.bot{justify-content:flex-end;}
  @keyframes in{from{opacity:0; transform:translateY(7px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){ .row{animation:none;} }

  .bub{
    max-width:84%; padding:12px 15px; border-radius:17px; font-size:15.5px; line-height:1.8;
    box-shadow:0 2px 7px var(--shadow);
  }
  .bot .bub{background:var(--bot-bg); border:1px solid var(--line); border-end-end-radius:6px;}
  .me  .bub{background:var(--me-bg); color:var(--me-ink); border-end-start-radius:6px;}
  .bub b{font-weight:700;}

  /* نصيحة فورية — دي أكتر حاجة نافعة للعميل قبل ما يوصل المحل */
  .tip{
    background:var(--tip-bg); border:1px solid var(--tip-bd); color:var(--tip-ink);
    border-radius:14px; padding:12px 15px; font-size:14.5px; line-height:1.85;
    max-width:84%; margin:0 0 12px auto; box-shadow:0 2px 7px var(--shadow);
  }
  .tip .h{font-family:'Cairo',sans-serif; font-weight:800; display:block; margin-bottom:3px;}

  /* ===== الاختيارات ===== */
  .picks{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin:2px 0 16px;}
  .pick{
    font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer;
    background:var(--card); color:var(--ink); border:1.5px solid var(--line);
    border-radius:999px; padding:10px 17px; transition:border-color .15s, transform .1s;
  }
  .pick:hover{border-color:var(--red);}
  .pick:active{transform:scale(.97);}
  .pick:focus-visible{outline:3px solid color-mix(in srgb, var(--red) 45%, transparent); outline-offset:2px;}

  .ask{display:flex; gap:8px; margin:2px 0 16px;}
  .ask input{
    flex:1; font-family:inherit; font-size:16px; color:var(--ink);
    background:var(--card); border:1.5px solid var(--line); border-radius:13px; padding:12px 14px;
  }
  .ask input:focus{outline:none; border-color:var(--red);}
  .ask button{
    flex:none; font-family:'Cairo',sans-serif; font-weight:800; font-size:15px; cursor:pointer;
    background:var(--red); color:var(--on-color); border:none; border-radius:13px; padding:0 20px;
  }
  .ask button:active{background:var(--red-dark);}

  /* ============================================================
     التوقيع: بطاقة الكشف المبدئي
     شكلها متعمّد إنه يشبه الليبل الحراري اللي المحل بيطبعه على
     كل جهاز — نفس الشريط التلاتي ونفس الخط أحادي المسافة للرقم.
     العميل بيصوّرها ويجي بيها، فبتبقى وصلة بين اللينك والمحل.
     ============================================================ */
  .ticket{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    overflow:hidden; margin:6px 0 16px; box-shadow:0 8px 26px var(--shadow);
    animation:in .4s ease both;
  }
  .ticket .stripe{height:5px;}
  .tk-in{padding:16px 18px 18px;}
  .tk-eyebrow{
    font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
    font-size:11px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase;
  }
  .tk-in h2{font-family:'Cairo',sans-serif; font-weight:900; font-size:19px; margin:3px 0 14px;}
  .tk-line{display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px dashed var(--line);}
  .tk-line:last-of-type{border-bottom:none;}
  .tk-k{font-size:13.5px; color:var(--muted); flex:none;}
  .tk-v{font-size:14.5px; font-weight:700; text-align:start;}
  .tk-price{
    margin-top:14px; padding:13px 15px; border-radius:13px;
    background:color-mix(in srgb, var(--red) 8%, transparent);
    border:1px solid color-mix(in srgb, var(--red) 30%, transparent);
  }
  .tk-price .k{font-size:12.5px; color:var(--muted);}
  .tk-price .v{font-family:'Cairo',sans-serif; font-weight:900; font-size:22px; color:var(--red); margin-top:1px;}
  .tk-price .n{font-size:12px; color:var(--muted); line-height:1.7; margin-top:5px;}

  /* ===== الإجراءات ===== */
  .cta{display:grid; gap:9px; margin:2px 0 20px;}
  .cta a, .cta button{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:15.5px;
    padding:14px; border-radius:14px; border:none; cursor:pointer; text-decoration:none;
  }
  .c-wa{background:#25D366; color:#06301A;}
  .c-map{background:var(--card); color:var(--ink); border:1.5px solid var(--line);}
  .c-more{background:transparent; color:var(--muted); font-size:14px; font-weight:700; padding:8px;}

  .foot{
    text-align:center; font-size:12px; color:var(--faint); line-height:1.9;
    padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .foot b{color:var(--red);}
  .typing{display:inline-flex; gap:4px; align-items:center; padding:4px 0;}
  .typing i{width:6px; height:6px; border-radius:50%; background:var(--faint); animation:bob 1s infinite;}
  .typing i:nth-child(2){animation-delay:.15s;} .typing i:nth-child(3){animation-delay:.3s;}
  @keyframes bob{0%,60%,100%{opacity:.3;} 30%{opacity:1;}}
  @media (prefers-reduced-motion:reduce){ .typing i{animation:none; opacity:.6;} }
</style>
</head>

<style>

  /* زرار التثبيت — بيظهر لما المتصفح يسمح بس */

</style>

<script>
// ============================================================
// إعدادات المحل — عدّلها من هنا
// ============================================================
const SHOP = {
  whatsapp: '201028794359',          // 01028794359 بصيغة دولية: صفر البداية بيتشال ويتحط 20
  coords:   { lat: 31.4115841, lng: 31.8119856 },   // ميدان سرور، دمياط
  hours:    'مفتوح طول اليوم'
};
// ⚠️ اللينك بيتبني من الإحداثيات مش من نص بحث. النص كان بيوقع
//    العميل على أي مكان اسمه قريب — والإحداثيات نقطة واحدة بالظبط.
SHOP.maps = 'https://www.google.com/maps/search/?api=1&query=' +
            SHOP.coords.lat + ',' + SHOP.coords.lng;
SHOP.nav  = 'https://www.google.com/maps/dir/?api=1&destination=' +
            SHOP.coords.lat + ',' + SHOP.coords.lng;

// ============================================================
// ⚠️ الأسعار مقفولة لحد ما تتملي
// ------------------------------------------------------------
// خليتها مقفولة عن قصد: صفحة عامة برقم غلط أسوأ من صفحة من غير
// أرقام. العميل بييجي المحل بالرقم اللي شافه.
//
// لما تملاها، غيّر enabled لـ true. الأرقام بالجنيه.
// المفتاح: نوع الجهاز → المشكلة → [من, إلى]
// ============================================================
// ============================================================
// جدول الأسعار — مبني على أسعار أحدث ٩٠٠٠ جهاز دخلوا السيستم،
// معدّلة بقواعد بلال. الأرقام بالجنيه: [من, إلى, (تنويه اختياري)].
// المفتاح: فئة الجهاز → المشكلة.
//
// الفئات:
//   apple_new = ايفون X وأحدث → أرضية ٧٠٠ لأي عطل (مفيش أقل من كده)
//   apple_old = ايفون 6/7/8 وأقل → أرخص، حاجات محدودة تحت ٧٠٠
//   android   = أي جهاز تاني → شاشات ٧٠٠–١٥٠٠ (السوبر أموليد أعلى)
//
// عطل من غير سعر واقعي (زي الميّة) بيرجّع null → البوت يقول "بعد الكشف".
// ============================================================
const PRICES = {
  enabled: true,
  table: {
    apple_new: {
      screen:  [700, 4000, 'الشاشة الأصلية أغلى من غير الأصلية'],
      battery: [700, 1800],
      charge:  [700, 2000],
      software:[700, 1300],
      camera:  [700, 2500],
      sound:   [700, 1200],
      dead:    [700, 3000],
      water:   null
    },
    apple_old: {
      screen:  [500, 1200],
      battery: [500, 900],
      charge:  [300, 1000],
      software:[400, 1000],
      camera:  [400, 900],
      sound:   [400, 900],
      dead:    [500, 1800],
      water:   null
    },
    android: {
      screen:  [700, 1500, 'لو الشاشة سوبر أموليد بتكون أعلى — حوالي ١٢٠٠ أو ٢٦٠٠ أو ٤٢٠٠ حسب الموديل'],
      battery: [600, 1300],
      charge:  [300, 1000],
      software:[150, 600],
      camera:  [400, 1400],
      sound:   [300, 900],
      dead:    [500, 1800],
      water:   null
    }
  }
};

// ------------------------------------------------------------
// تحديد فئة السعر: للايفون نحلّل الموديل (فوق/تحت الإكس)، وأي حاجة
// تانية = أندرويد. موديل ايفون مش واضح → نفترض الأحدث (أرضية ٧٠٠)
// عشان التقدير ميبقاش أقل من الواقع ويضايق العميل.
// ------------------------------------------------------------
function normModel(m){
  m = String(m || '').toLowerCase().trim();
  m = m.replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); });
  m = m.replace(/برو\s*ماكس|بروماكس/g, 'promax')
       .replace(/ماكس/g, 'max').replace(/برو/g, 'pro')
       .replace(/بلس|بلص|بلاس/g, 'plus');
  m = m.replace(/ايفون|أيفون|iphone/g, '').replace(/\s+/g, '');
  return m;
}
function appleTier(model){
  var m = normModel(model);
  var mt = m.match(/^(\d{1,2})/);
  if(mt){
    var n = parseInt(mt[1], 10);
    if(n >= 11) return 'apple_new';           // 11 وأحدث
    if(n >= 4 && n <= 8) return 'apple_old';   // 6/7/8 (و5 نادراً)
  }
  if(/^x/.test(m)) return 'apple_new';         // x / xr / xs / xmax / xsmax
  return 'apple_new';                           // مش واضح → الأحدث (أأمن)
}
function resolveTier(){
  if(S.brand && S.brand.k === 'apple') return appleTier(S.model);
  return 'android';
}

const BRANDS = [
  { k:'apple',   n:'ايفون',    tier:'apple'   },
  { k:'samsung', n:'سامسونج',  tier:'samsung' },
  { k:'xiaomi',  n:'شاومي',    tier:'other'   },
  { k:'oppo',    n:'أوبو',     tier:'other'   },
  { k:'realme',  n:'ريلمي',    tier:'other'   },
  { k:'infinix', n:'انفنكس',   tier:'other'   },
  { k:'tecno',   n:'تكنو',     tier:'other'   },
  { k:'huawei',  n:'هواوي',    tier:'other'   },
  { k:'other',   n:'نوع تاني', tier:'other'   }
];

// النصيحة هي أنفع حاجة في الصفحة: بتقول للعميل يعمل إيه دلوقتي
// قبل ما يوصل، وساعات بتنقذ الجهاز فعلاً.
const ISSUES = [
  { k:'screen',   n:'الشاشة مكسورة أو لا تعمل',
    tip:'لو الشاشة مكسورة وفيها قزاز مكسّر، متعدّيش صوابعك عليها. لفّها بشريط شفاف لحد ما توصّلها.' },
  { k:'battery',  n:'البطارية بتفصل بسرعة',
    tip:'لو البطارية بتسخن أو منفوخة، بطّل تشحنه — ده خطر حقيقي. هاته على طول.' },
  { k:'charge',   n:'لا يشحن',
    tip:'جرّب شاحناً وكابلاً آخرين قبل حضورك. أحياناً يكون العطل في الكابل لا في الجهاز.' },
  { k:'water',    n:'وقع في ميه',
    tip:'متشحنوش ومتشغّلوش خالص، وسيبه مقفول. كل ساعة بتعدّي بتقلّل فرصة إنقاذه. هاته بسرعة.' },
  { k:'software', n:'بيهنّج أو بيقفل لوحده',
    tip:'لو فيه صور أو أرقام مهمة، خد نسخة احتياطية قبل ما تيجي لو الجهاز لسه بيشتغل.' },
  { k:'camera',   n:'الكاميرا',
    tip:'التقط بها صورة قبل حضورك — تدلّنا إن كان العطل في العدسة أم في البرمجيات.' },
  { k:'sound',    n:'الصوت أو المايك',
    tip:'جرّب سماعة سلكية. لو الصوت طلع منها، العطل في السماعة الداخلية.' },
  { k:'dead',     n:'لا يفتح نهائياً',
    tip:'ضعه على الشاحن ربع ساعة ثم أعد المحاولة. إن لم تظهر أي علامة، أحضره لنفحصه.' },
  { k:'other',    n:'مشكلة تانية',
    tip:'أرسل لنا التفاصيل على واتساب أو أحضره إلى المحل لنفحصه.' }
];

// ============================================================
// الاتصال بقاعدة البيانات — نفس منطق باقي الصفحات:
// نطاق الإنتاج بس هو اللي بيوصل لقاعدة الإنتاج
// ============================================================
const SUPABASE_ENVS = {

// وبعدها البوت بينده عليه باسمه ويعدّي الأسئلة الشخصية.

//    ولو العميل بقى مستخدم authenticated كان هيدخل تحت سياسات
//    زي spare_parts_read اللي بتقول "to authenticated using (true)"
//    — يعني أي عميل يسجّل يقرا مخزن قطع الغيار. البروفايل المحلي
//    بيدّي نفس الراحة من غير أي سطح أمني جديد.
var P = { name:'', phone:'', email:'' };

function loadProfile(){
  try{ var r = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}');
       P = { name:r.name||'', phone:r.phone||'', email:r.email||'' }; }catch(e){}
  return P;
}
function saveProfile(){
  try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(P)); }catch(e){}
  S.customer = P.name; S.phone = P.phone; S.email = P.email;
  paintAcct();
}
function hasProfile(){ return !!(P.name && P.phone); }

// ⚠️ الزرار بيظهر لما المتصفح يقول إنه ممكن. سفاري على الأيفون
//    مبيبعتش الحدث ده خالص — فبنوريه تعليمات بدل زرار مايشتغلش.
var deferredPrompt = null;
addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt = e; paintInstall();
});
function isIOS(){ return /iPhone|iPad|iPod/i.test(navigator.userAgent); }
function paintInstall(){
  var b = document.getElementById('pInstall');
  if(!b) return;
  var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if(standalone){ b.classList.add('hidden'); return; }
  if(deferredPrompt){
    b.classList.remove('hidden');
    b.textContent = '📲 ثبّت الصفحة كتطبيق';
    b.onclick = function(){ deferredPrompt.prompt(); deferredPrompt = null; b.classList.add('hidden'); };
  } else if(isIOS()){
    b.classList.remove('hidden');
    b.textContent = '📲 للتثبيت: زر المشاركة ← إضافة إلى الشاشة الرئيسية';
    b.onclick = null;
  } else b.classList.add('hidden');
}

const $flow = document.getElementById('flow');
// ⚠️ \D في جافاسكربت معناها "مش [0-9]" — فالأرقام العربية (٠-٩)
//    والفارسية (۰-۹) كانت **بتتشال بالكامل** مش بتتحوّل. عميل يكتب
//    ٠١٠١٢٣٤٥٦٧٨ كان يجد الخانة فارغة بلا سبب ظاهر.
//    نحوّلها إلى إنجليزي أولاً ثم ننظّف.
function enDigits(v){
  return String(v == null ? '' : v)
    .replace(/[\u0660-\u0669]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
    .replace(/[\u06F0-\u06F9]/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); });
}
function onlyDigits(v){ return enDigits(v).replace(/\D/g, ''); }

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function newToken(){
  try{ return crypto.randomUUID().replace(/-/g,''); }
  catch(e){ return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,10); }
}

// ============================================================
// الحفظ
// ------------------------------------------------------------
// بيشتغل في الخلفية ومبيوقفش المحادثة أبداً. لو النت وقع، العميل
// بيكمّل عادي — الحفظ يفشل بصمت وهو أهون من محادثة بتقف.
// ============================================================
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const row = {
      token: S.token,
      // ⚠️ الإيميل مش عمود في الجدول. بنبعته جوه نص الرسالة بدل ما
      //    نبعت عمود مش موجود — العملية كلها كانت هتفشل في صمت.
      brand: S.brand ? S.brand.n : '',
      model: S.model, phone: S.phone, customer: S.customer,
      issue: S.issue ? S.issue.n : '',
      // ⚠️ 'human' معناها "محتاج رد من موظف" — مش "معانا رقمه".
      //    كانت S.phone ? 'human' : 'bot'، وده كان صح أيام ما الرقم
      //    مكانش بيتاخد غير لما العميل يطلب حد يكلمه. دلوقتي بناخده
      //    من أول الكلام، فالشرط ده كان هيعلّم **كل** محادثة إنها
      //    محتاجة رد ويغرق طابور المحاسب.
      status: S.wantHuman ? 'human' : 'bot',
      messages: S.msgs,
      updated_at: new Date().toISOString()
    };
    try{
      if(!S.saved){
        const { error } = await sb.from('assistant_chats').insert(row);
        if(!error) S.saved = true;
      }else{
        await sb.from('assistant_chats').update(row).eq('token', S.token);
      }
    }catch(e){ /* الحفظ مش بيوقف المحادثة */ }
  }, 700);
}

function toBottom(){ requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' })); }

function picks(items, onPick){
  clearInputs();
  const d = document.createElement('div');
  d.className = 'picks';
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pick'; b.textContent = it.n;
    b.onclick = () => { bubble('me', esc(it.n)); clearInputs(); onPick(it); };
    d.appendChild(b);

}

function askText(placeholder, cta, onDone, opts){
  clearInputs();
  const d = document.createElement('div');
  d.className = 'ask';
  d.innerHTML = `<input type="${(opts&&opts.tel)?'tel':'text'}" placeholder="${esc(placeholder)}"
                   ${(opts&&opts.tel)?'inputmode="tel"':''} maxlength="60">
                 <button type="button">${esc(cta)}</button>`;
  const [inp, btn] = [d.querySelector('input'), d.querySelector('button')];
  // الأرقام تتحوّل إلى إنجليزي أثناء الكتابة — ليرى العميل ما سيُسجَّل
  if(opts && opts.tel){
    inp.oninput = () => { const c = enDigits(inp.value); if(c !== inp.value) inp.value = c; };
  }
  const go = () => {
    const v = inp.value.trim();
    if(!v) { inp.focus(); return; }
    bubble('me', esc(v)); clearInputs(); onDone(v);
  };
  btn.onclick = go;
  inp.onkeydown = e => { if(e.key === 'Enter') go(); };
  $flow.appendChild(d); toBottom();
  setTimeout(() => inp.focus(), 120);
}

function typing(ms, then){
  const r = document.createElement('div');
  r.className = 'row bot';
  r.innerHTML = `<div class="bub"><span class="typing"><i></i><i></i><i></i></span></div>`;
  $flow.appendChild(r); toBottom();
  setTimeout(() => { r.remove(); then(); }, ms);
}

// ============================================================
// المسافة للمحل
// ------------------------------------------------------------
// هافرساين على كورة الأرض — دي مسافة الخط المستقيم، مش الطريق.
// بنقولها كده صريح عشان محدش يستنى رقم العدّاد.
// ============================================================
function distanceKm(lat, lng){
  var R = 6371, rad = function(d){ return d * Math.PI / 180; };
  var dLat = rad(SHOP.coords.lat - lat), dLng = rad(SHOP.coords.lng - lng);
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(rad(lat))*Math.cos(rad(SHOP.coords.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function showDistance(btn){
  if(!navigator.geolocation){
    btn.textContent = 'جهازك لا يدعم تحديد الموقع'; btn.disabled = true; return;
  }
  btn.textContent = 'جارٍ تحديد موقعك…'; btn.disabled = true;
  navigator.geolocation.getCurrentPosition(function(pos){
    var km = distanceKm(pos.coords.latitude, pos.coords.longitude);
    var txt = km < 1 ? Math.round(km * 1000) + ' متر'
            : (km < 10 ? km.toFixed(1) : Math.round(km)) + ' كيلو';
    btn.outerHTML =
      '<a class="c-map" href="' + SHOP.nav + '" target="_blank" rel="noopener">' +
      '🧭 المحل يبعد عنك <b>' + txt + '</b> — افتح الطريق</a>' +
      '<div style="font-size:11px;color:var(--muted,#6B7A8C);text-align:center;margin-top:6px;">' +
      'المسافة بالخط المستقيم — الطريق الفعلي أطول قليلاً.</div>';
  }, function(err){
    // ⚠️ الرفض مش خطأ — العميل ممكن يكون مقفل الموقع عن قصد.
    //    بنوريه الطريق على الخريطة بدل رسالة اعتذار.
    btn.disabled = false;
    btn.textContent = err && err.code === 1
      ? 'الموقع مغلق — فعّله من إعدادات المتصفح ثم أعد المحاولة'
      : 'تعذّر تحديد موقعك — أعد المحاولة';
  }, { enableHighAccuracy:false, timeout:9000, maximumAge:300000 });
}

function actions(){
  clearInputs();
  const msg = encodeURIComponent(
    `السلام عليكم، جهازي ${S.brand.n} ${S.model}\nالمشكلة: ${S.issue.n}`);
  const d = document.createElement('div');
  d.className = 'cta';
  d.innerHTML = `
    <a class="c-wa" href="https://wa.me/${SHOP.whatsapp}?text=${msg}" target="_blank" rel="noopener">💬 كلّمنا على واتساب</a>
    <a class="c-map" href="${SHOP.maps}" target="_blank" rel="noopener">📍 مكان المحل — ${esc(SHOP.hours)}</a>
    <button type="button" class="c-more" id="howFar">🧭 كم يبعد المحل عني؟</button>
    <button type="button" class="c-more" id="wantDelivery">🛵 أرسلوا مندوباً لاستلام الجهاز</button>
    <button type="button" class="c-more" id="callMe">هل تريد أن يتصل بك أحد من الفريق؟</button>`;
  $flow.appendChild(d); toBottom();
  document.getElementById('callMe').onclick = () => { clearInputs(); leaveNumber(); };
  document.getElementById('wantDelivery').onclick = () => { clearInputs(); askDelivery(); };
  const hf = document.getElementById('howFar');
  if(hf) hf.onclick = () => showDistance(hf);
}

// ============================================================
// طلب مندوب
// ------------------------------------------------------------
// بيتكتب في نفس محادثة العميل بحالة 'human' — يعني "محتاج رد".
// شاشة المحادثات في شريط الأدوات هي اللي هتعرضه للمحاسب.
// ⚠️ من غير الشاشة دي الطلب بيوصل القاعدة ومحدش شايفه.
// ============================================================
// ⚠️ نسأل عن الرقم المحفوظ بدل أن نطلب رقماً جديداً.
//    كان يطلب رقماً في كل مرة رغم أن العميل مسجَّل — وهذا يلغي
//    الفائدة كلها من الحساب.
function confirmPhone(label, next){
  if(!P.phone) return next();
  bubble('bot', label + '<br>الرقم المحفوظ: <b style="direction:ltr;display:inline-block;">' +
                esc(P.phone) + '</b>');
  clearInputs();
  const d = document.createElement('div');
  d.className = 'picks';
  d.innerHTML = '<button type="button" data-k="same">نعم، نفس الرقم</button>' +
                '<button type="button" data-k="new">رقم آخر</button>';
  d.querySelector('[data-k=same]').onclick = () => {
    bubble('me', 'نفس الرقم'); clearInputs(); next();
  };
  d.querySelector('[data-k=new]').onclick = () => {
    bubble('me', 'رقم آخر'); clearInputs();
    bubble('bot', 'اكتب الرقم الذي تريد التواصل عليه.');
    askText('01xxxxxxxxx', 'تأكيد', function(t){
      const dg = onlyDigits(t);
      if(dg.length < 10){ bubble('bot', 'الرقم غير مكتمل — اكتبه مرة أخرى.'); return; }
      P.phone = dg; saveProfile(); next();
    }, { tel:true });
  };
  $flow.appendChild(d); toBottom();
}

function askDelivery(){
  if(!hasProfile()){
    bubble('bot', 'لإرسال مندوب نحتاج اسمك ورقمك أولاً.');
    return typing(400, askIdentity);
  }
  confirmPhone('على أي رقم نتصل بك لتأكيد الموعد؟', askDeliveryAddress);
}

function askDeliveryAddress(){
  bubble('bot', 'إلى أين يأتي المندوب؟ اكتب العنوان بالتفصيل.');
  askText('الحي، الشارع، رقم العمارة، علامة مميزة', 'إرسال الطلب', function(addr){
    S.delivery = { addr: addr, at: new Date().toISOString() };
    S.msgs.push({ who:'me',
      text: '🛵 طلب مندوب — ' + P.name + ' · ' + P.phone + '\nالعنوان: ' + addr +
            (P.email ? '\nالإيميل: ' + P.email : '') +
            '\nالجهاز: ' + (S.brand ? S.brand.n : '') + ' ' + S.model + ' — ' + (S.issue ? S.issue.n : ''),
      at: new Date().toISOString() });
    S.wantHuman = true;                 // بيخلي الحالة 'human' في الحفظ
    save();
    typing(700, function(){
      bubble('bot', 'وصلنا طلبك ✅<br>سنتصل بك على <b style="direction:ltr;display:inline-block;">' +
                    esc(P.phone) + '</b> لتأكيد الموعد قبل تحرّك المندوب.');
      typing(500, function(){
        bubble('bot', 'وإن كنت مستعجلاً، راسلنا على واتساب وسنرد أسرع.');
        actions();
      });
    });
  });
}

function leaveNumber(){
  // نفس المنطق: إن كان الرقم محفوظاً نسأل بدل أن نطلبه من جديد
  if(P.phone && !leaveNumber._asked){
    leaveNumber._asked = true;
    return confirmPhone('على أي رقم يتصل بك الفريق؟', function(){
      S.phone = P.phone; S.wantHuman = true; save();
      typing(600, function(){
        bubble('bot', 'تمام ✅ سنتصل بك في أقرب وقت.');
        actions();
      });
    });
  }
  return leaveNumberAsk();
}

function leaveNumberAsk(){
  bubble('bot', 'اكتب رقمك وسنتصل بك في أقرب وقت.');
  askText('01xxxxxxxxx', 'إرسال', v => {
    const digits = onlyDigits(v);
    if(digits.length < 10){
      bubble('bot', 'الرقم غير مكتمل — اكتبه مرة أخرى من فضلك.');
      return leaveNumberRetry();
    }
    S.phone = digits; S.wantHuman = true;
    if(!P.phone){ P.phone = digits; saveProfile(); }
    save();
    typing(500, () => {
      bubble('bot', 'وصلنا رقمك ✅ سنتصل بك قريباً.<br>ولو مستعجل، الواتساب أسرع.');
      actions();
    });
  }, { tel:true });
}
function leaveNumberRetry(){
  askText('01xxxxxxxxx', 'إرسال', v => {
    S.phone = v.replace(/\D/g,''); save();
    typing(500, () => { bubble('bot', 'وصلنا رقمك ✅ سنتصل بك قريباً.'); actions(); });
  }, { tel:true });
}

// ============================================================
// الإقلاع
// ============================================================
(function boot(){
  try{
    S.token = localStorage.getItem(TOKEN_KEY) || '';
    if(!S.token){ S.token = newToken(); localStorage.setItem(TOKEN_KEY, S.token); }
  }catch(e){ S.token = newToken(); }

  loadProfile();
  S.customer = P.name; S.phone = P.phone; S.email = P.email;
  paintAcct();
  var ab = document.getElementById('acctBtn');
  if(ab) ab.onclick = openAcct;
  var xb = document.getElementById('shClose');
  if(xb) xb.onclick = closeAcct;
  var sheet = document.getElementById('acctSheet');
  if(sheet) sheet.addEventListener('click', function(e){ if(e.target === sheet) closeAcct(); });

  const mt = document.getElementById('tcMeta');
  if(mt) mt.setAttribute('content',
    document.documentElement.getAttribute('data-theme') === 'dark' ? '#131E29' : '#F2F2F1');

  start();
})();
</script>
</body>
</html>
